<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaatarra Loyalty</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(255,255,255,.10),transparent 28%),
        radial-gradient(circle at 85% 20%,rgba(255,255,255,.07),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(255,255,255,.05),transparent 35%),
        #050505;
    color:#fff;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{
    width:min(1180px,calc(100% - 36px));
    min-height:calc(100vh - 36px);
    margin:18px auto;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    overflow:hidden;
    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
}

/* ============================================================
   MAIN HEADER
   ============================================================ */

.header{
    height:78px;
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.045);
    border-bottom:1px solid rgba(255,255,255,.10);
    position:sticky;
    top:0;
    z-index:10;
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:-.5px;
    color:#fff;
    text-shadow:0 0 22px rgba(255,255,255,.20);
}

.header small{
    color:rgba(255,255,255,.45);
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* ============================================================
   HOME
   ============================================================ */

.home{
    padding:55px;
    max-width:1000px;
    margin:auto;
}

.hero{
    position:relative;
    overflow:hidden;
    padding:48px;
    border-radius:26px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.115),
            rgba(255,255,255,.035)
        );
    border:1px solid rgba(255,255,255,.14);
    margin-bottom:24px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.hero::before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    top:-180px;
    right:-80px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    filter:blur(30px);
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
        120deg,
        rgba(255,255,255,.07),
        transparent 35%
    );
}

.hero h1{
    position:relative;
    z-index:1;
    margin:0 0 10px;
    font-size:40px;
    font-weight:800;
    letter-spacing:-1.4px;
    color:#fff;
}

.hero p{
    position:relative;
    z-index:1;
    margin:0;
    color:rgba(255,255,255,.50);
    font-size:15px;
}

/* ============================================================
   HOME ACTIONS
   ============================================================ */

.home-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    align-items:stretch;
}

.data-btn,
.backup-btn{
    min-height:58px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:17px;
    padding:15px 20px;
    font-size:12px;
    font-weight:800;
    letter-spacing:1.2px;
    cursor:pointer;
    color:#fff;
    transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease,
        box-shadow .22s ease;
    box-shadow:
        0 10px 30px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.data-btn{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.055)
        );
}

.backup-btn{
    background:
        rgba(255,255,255,.045);
}

.data-btn:hover,
.backup-btn:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.32);
    background:rgba(255,255,255,.11);
    box-shadow:
        0 16px 35px rgba(0,0,0,.30),
        0 0 25px rgba(255,255,255,.04);
}

.data-btn:active,
.backup-btn:active{
    transform:scale(.97);
}

.backup-status{
    margin-top:18px;
    min-height:20px;
    color:rgba(255,255,255,.48);
    font-size:12px;
}

/* ============================================================
   PAGES
   ============================================================ */

.page{
    display:none;
}

.page.active{
    display:block;
}

.page-header{
    height:74px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 28px;
    background:rgba(255,255,255,.045);
    border-bottom:1px solid rgba(255,255,255,.10);
    position:sticky;
    top:0;
    z-index:10;
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.back{
    width:40px;
    height:40px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:13px;
    background:rgba(255,255,255,.055);
    color:#fff;
    font-size:27px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s ease;
}

.back:hover{
    background:rgba(255,255,255,.13);
    border-color:rgba(255,255,255,.28);
    transform:translateX(-2px);
}

.page-title{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.3px;
    color:#fff;
}

/* ============================================================
   SEARCH
   ============================================================ */

.search{
    padding:22px 28px;
    background:rgba(0,0,0,.18);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.search input{
    width:100%;
    max-width:620px;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.055);
    color:#fff;
    border-radius:15px;
    padding:15px 18px;
    outline:none;
    font-size:14px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 25px rgba(0,0,0,.18);
    transition:.2s ease;
}

.search input::placeholder{
    color:rgba(255,255,255,.34);
}

.search input:focus{
    border-color:rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    box-shadow:
        0 0 0 3px rgba(255,255,255,.045),
        0 10px 30px rgba(0,0,0,.22);
}

/* ============================================================
   CUSTOMER ACCOUNTS
   ============================================================ */

.accounts{
    padding:20px 28px 40px;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
    background:rgba(0,0,0,.10);
}

.account{
    position:relative;
    width:100%;
    min-height:84px;
    text-align:left;
    border:1px solid rgba(255,255,255,.10);
    border-radius:19px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    padding:16px 17px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    color:#fff;
    box-shadow:
        0 8px 25px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.account:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.23);
    background:rgba(255,255,255,.09);
    box-shadow:
        0 16px 35px rgba(0,0,0,.28),
        0 0 25px rgba(255,255,255,.035);
}

.account:active{
    transform:scale(.985);
}

.avatar{
    width:49px;
    height:49px;
    border-radius:16px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.19),
            rgba(255,255,255,.055)
        );
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:18px;
    flex:none;
    border:1px solid rgba(255,255,255,.17);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 8px 20px rgba(0,0,0,.25);
}

.account-info{
    min-width:0;
}

.account-name{
    font-weight:800;
    color:#fff;
    margin-bottom:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.account-phone{
    color:rgba(255,255,255,.42);
    font-size:13px;
}

.account-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
}

.whatsapp-btn{
    border:1px solid rgba(255,255,255,.13);
    border-radius:11px;
    padding:9px 12px;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    transition:.2s ease;
}

.whatsapp-btn:hover{
    background:rgba(255,255,255,.16);
    border-color:rgba(255,255,255,.25);
}

/* ============================================================
   PROFILE
   ============================================================ */

.profile{
    padding:30px 38px 50px;
    max-width:1000px;
    margin:auto;
}

.profile-card{
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.13);
    border-radius:24px;
    padding:25px;
    display:flex;
    align-items:center;
    gap:18px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.035)
        );
    box-shadow:
        0 15px 45px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
}

.profile-card::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    right:-100px;
    top:-130px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    filter:blur(30px);
}

.big-avatar{
    width:70px;
    height:70px;
    border-radius:21px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.20),
            rgba(255,255,255,.055)
        );
    color:#fff;
    border:1px solid rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
    flex:none;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 12px 30px rgba(0,0,0,.3);
}

.profile-name{
    font-size:25px;
    font-weight:800;
    letter-spacing:-.7px;
    color:#fff;
}

.profile-phone{
    color:rgba(255,255,255,.43);
    margin-top:6px;
    font-size:14px;
}

/* ============================================================
   STATS
   ============================================================ */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:16px;
}

.stat{
    border:1px solid rgba(255,255,255,.10);
    border-radius:19px;
    padding:19px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    box-shadow:
        0 8px 25px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    transition:.2s ease;
}

.stat:hover{
    transform:translateY(-2px);
    border-color:rgba(255,255,255,.18);
}

.stat-label{
    font-size:10px;
    font-weight:800;
    letter-spacing:1.2px;
    color:rgba(255,255,255,.36);
    margin-bottom:9px;
}

.stat-value{
    font-size:20px;
    font-weight:800;
    color:#fff;
}

/* ============================================================
   PURCHASE HISTORY
   ============================================================ */

.history-title{
    font-size:21px;
    font-weight:800;
    letter-spacing:-.4px;
    color:#fff;
    margin:34px 0 14px;
}

.purchase{
    border:1px solid rgba(255,255,255,.09);
    border-radius:17px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );
    padding:17px 19px;
    margin-bottom:10px;
    box-shadow:
        0 7px 22px rgba(0,0,0,.17),
        inset 0 1px 0 rgba(255,255,255,.05);
    transition:.2s ease;
}

.purchase:hover{
    border-color:rgba(255,255,255,.17);
    background:rgba(255,255,255,.075);
}

.purchase-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.purchase-date{
    font-size:13px;
    color:rgba(255,255,255,.40);
}

.purchase-total{
    font-weight:800;
    color:#fff;
}

.items{
    margin-top:10px;
    line-height:1.55;
    font-size:14px;
    color:rgba(255,255,255,.68);
}

.points{
    margin-top:10px;
    font-size:12px;
    font-weight:800;
    color:rgba(255,255,255,.50);
}

/* ============================================================
   STATES
   ============================================================ */

.empty{
    padding:55px 20px;
    text-align:center;
    color:rgba(255,255,255,.35);
    grid-column:1/-1;
}

.loading{
    padding:45px;
    text-align:center;
    color:rgba(255,255,255,.38);
    grid-column:1/-1;
}

.error{
    margin:20px 28px;
    padding:16px;
    border-radius:15px;
    background:rgba(255,60,60,.07);
    color:#ff9a9a;
    font-size:14px;
    border:1px solid rgba(255,80,80,.16);
}

/* ============================================================
   TABLET
   ============================================================ */

@media(max-width:900px){

    .app{
        width:calc(100% - 24px);
        margin:12px auto;
        min-height:calc(100vh - 24px);
    }

    .accounts{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .home{
        padding:35px;
    }

    .profile{
        padding:25px;
    }

    .home-actions{
        grid-template-columns:1fr;
    }
}

/* ============================================================
   SMALL SCREENS
   ============================================================ */

@media(max-width:600px){

    body{
        background:#050505;
    }

    .app{
        width:100%;
        min-height:100vh;
        margin:0;
        border:0;
        border-radius:0;
        box-shadow:none;
    }

    .header{
        padding:0 20px;
    }

    .home{
        padding:25px 18px;
    }

    .hero{
        padding:30px 23px;
        border-radius:22px;
    }

    .hero h1{
        font-size:31px;
    }

    .home-actions{
        grid-template-columns:1fr;
    }

    .data-btn,
    .backup-btn{
        width:100%;
        min-width:0;
    }

    .page-header{
        padding:0 18px;
    }

    .search{
        padding:16px 18px;
    }

    .accounts{
        padding:12px 18px 30px;
    }

    .profile{
        padding:20px 18px 35px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        padding:16px;
    }

    .stat-value{
        font-size:18px;
    }

    .account{
        padding:14px;
    }

    .account-actions{
        display:none;
    }
}
</style>

<div class="app">

    <!-- HOME -->
    <section id="homePage">

        <header class="header">

                <p>Manage customer accounts, purchases and loyalty points.</p>
            </div>

            <div class="home-actions">

                <button
                    class="data-btn"
                    type="button"
                    onclick="openAccounts()"

                    DATAS
                </button>

                <button
                    class="backup-btn"

                    onclick="exportBackup()"
                >
                    📤 EXPORT BACKUP
                </button>

                    class="backup-btn"

                >
                    📥 IMPORT BACKUP
                </button>

            ></div>

    >

                class="back"

            </div>

            <input
                id="searchInput"

                class="back"
                type="button"
                onclick="showPage('accountsPage')"
            >
                ‹
            </button>

            <div class="page-title">
                Customer
            </div>

        </header>


        <div id="customerContent"></div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=4"></script>


<script>

/*
============================================================
OFFLINE LOYALTY DATABASE
============================================================

Customer name and phone are stored ONLY in IndexedDB.

This Loyalty page does not send customer information
to Supabase.

Database:
    chaatarra_local_db

Stores:
    customers
    orders

============================================================
*/

const LOCAL_DB_NAME = "chaatarra_local_db";
const LOCAL_DB_VERSION = 2;

let localDB = null;
let allCustomers = [];


/* ============================================================
   OPEN LOCAL DATABASE
   ============================================================ */

function openLocalDB(){

    return new Promise((resolve,reject)=>{

        if(localDB){

            resolve(localDB);

            return;
        }

        const request =
            indexedDB.open(
                LOCAL_DB_NAME,
                LOCAL_DB_VERSION
            );

        request.onupgradeneeded = event => {

            const db =
                event.target.result;

            const customers =
                db.objectStoreNames.contains("customers")
                ? request.transaction.objectStore("customers")
                : db.createObjectStore(
                    "customers",
                    {
                        keyPath:"id"
                    }
                );

            if(
                !customers.indexNames.contains("phone")
            ){

                customers.createIndex(
                    "phone",
                    "phone",
                    {
                        unique:false
                    }
                );

            }

            const orders =
                db.objectStoreNames.contains("orders")
                ? request.transaction.objectStore("orders")
                : db.createObjectStore(
                    "orders",
                    {
                        keyPath:"id"
                    }
                );

            if(
                !orders.indexNames.contains("customerId")
            ){

                orders.createIndex(
                    "customerId",
                    "customerId",
                    {
                        unique:false
                    }
                );

            }

            if(
                !orders.indexNames.contains("createdAt")
            ){

                orders.createIndex(
                    "createdAt",
                    "createdAt",
                    {
                        unique:false
                    }
                );

            }

        };

        request.onsuccess = event => {

            localDB =
                event.target.result;

            localDB.onversionchange = () => {

                localDB.close();

                localDB = null;

            };

            resolve(localDB);

        };

        request.onerror = () => {

            reject(
                request.error
            );

        };

    });

}


/* ============================================================
   GET ALL RECORDS FROM STORE
   ============================================================ */

function getAllFromStore(storeName){

    return openLocalDB().then(db => {

        return new Promise((resolve,reject)=>{

            const request =
                db
                .transaction(
                    storeName,
                    "readonly"
                )
                .objectStore(storeName)
                .getAll();

            request.onsuccess = () => {

                resolve(
                    request.result || []
                );

            };

            request.onerror = () => {

                reject(
                    request.error
                );

            };

        });

    });

}


/* ============================================================
   NORMALIZE PHONE
   ============================================================ */

function normalizePhone(phone){

    let digits =
        String(phone || "")
        .replace(/\D/g,"");

    if(
        digits.length === 12 &&
        digits.startsWith("91")
    ){

        digits =
            digits.substring(2);

    }

    return digits;

}


/* ============================================================
   LOAD CUSTOMERS
   ============================================================ */

async function loadCustomers(){

    const list =
        document.getElementById(
            "accountsList"
        );

    list.innerHTML =
        `<div class="loading">
            Loading accounts...
        </div>`;

    try{

        const customers =
            await getAllFromStore(
                "customers"
            );

        const orders =
            await getAllFromStore(
                "orders"
            );

        const purchasesByCustomer = {};

        orders.forEach(order => {

            if(!order.customerId){

                return;

            }

            if(
                !purchasesByCustomer[
                    order.customerId
                ]
            ){

                purchasesByCustomer[
                    order.customerId
                ] = [];

            }

            purchasesByCustomer[
                order.customerId
            ].push({

                amount:
                    Number(
                        order.total || 0
                    ),

                created_at:
                    order.createdAt,

                description:
                    JSON.stringify(
                        order.items || []
                    ),

                order_number:
                    order.orderNumber,

                order_id:
                    order.serverOrderId ||
                    order.id,

                type:
                    "purchase"

            });

        });

        allCustomers =
            customers
            .map(customer => {

                return {

                    ...customer,

                    _purchases:
                        (
                            purchasesByCustomer[
                                customer.id
                            ] || []
                        )
                        .sort(
                            (a,b) =>
                                new Date(
                                    b.created_at
                                ) -
                                new Date(
                                    a.created_at
                                )
                        )

                };

            })
            .sort(
                (a,b) =>
                    String(
                        a.name || ""
                    )
                    .localeCompare(
                        String(
                            b.name || ""
                        )
                    )
            );

        renderCustomers(
            allCustomers
        );

    }catch(error){

        console.error(
            error
        );

        list.innerHTML = `
            <div class="error">
                Could not load local loyalty data.
                <br><br>
                ${escapeHtml(
                    error.message ||
                    String(error)
                )}
            </div>
        `;

    }

}


/* ============================================================
   SHOW PAGE
   ============================================================ */

function showPage(id){

    document
        .querySelectorAll(
            ".app > section"
        )
        .forEach(section => {

            section.classList.remove(
                "active"
            );

            section.style.display = "";

        });

    const page =
        document.getElementById(id);

    if(id === "homePage"){

        page.style.display =
            "block";

    }else{

        page.classList.add(
            "active"
        );

    }

}

   OPEN ACCOUNTS
   ============================================================ */

function openAccounts(){

        "accountsPage"
    );

    loadCustomers();

}


/* ============================================================
   RENDER CUSTOMERS
   ============================================================ */

function renderCustomers(customers){

    const list =
        document.getElementById(
            "accountsList"
        );

    if(!customers.length){

        list.innerHTML =
            `<div class="empty">
                No loyalty accounts found.
            </div>`;

        return;

    }

    list.innerHTML =
        customers
        .map(customer => {

            const name =
                customer.name ||
                "Unnamed Customer";

            const phone =
                customer.phone ||
                "No phone";

            const stats =
                calculateStats(
                    customer._purchases || []
                );

            return `

                <button
                    class="account"
                    type="button"
                    onclick="openCustomer('${escapeAttr(customer.id)}')"
                >

                    <div class="avatar">
                        ${escapeHtml(
                            name
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </div>

                    <div class="account-info">

                        <div class="account-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="account-phone">
                            ${escapeHtml(phone)}
                        </div>

                    </div>

                    ${
                        customer.phone
                        ? `

                            <div class="account-actions">

                                <button
                                    class="whatsapp-btn"
                                    type="button"
                                    onclick="
                                        event.stopPropagation();
                                        sendLoyaltyWhatsApp(
                                            '${escapeAttr(customer.phone)}',
                                            '${escapeAttr(name)}',
                                            ${stats.points}
                                        )
                                    "
                                >
                                    WhatsApp
                                </button>

                            </div>

                        `
                        : ""
                    }

                </button>

            `;

        })
        .join("");

}


/* ============================================================
   FILTER ACCOUNTS
   ============================================================ */

function filterAccounts(){

    const query =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();

    const filtered =
        allCustomers.filter(
            customer => {

                const name =
                    String(
                        customer.name || ""
                    )
                    .toLowerCase();

                const phone =
                    String(
                        customer.phone || ""
                    )
                    .toLowerCase();

                return (
                    name.includes(query) ||
                    phone.includes(query)
                );

            }
        );

    renderCustomers(
        filtered
    );

}

/* ============================================================
   RENDER PURCHASE
   ============================================================ */

function renderPurchase(purchase){

    const date =
        new Date(
            purchase.created_at
        );

    const dateText =
        date.toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );

    const timeText =
        date.toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    const amount =
        Number(
            purchase.amount || 0
        );

    const calculatedPoints =
        Math.floor(
            amount / 50
        );

    return `

        <div class="purchase">

            <div class="purchase-top">

                <div class="purchase-date">
                    ${dateText} • ${timeText}
                </div>

                <div class="purchase-total">
                    ₹${amount.toFixed(2)}
                </div>

            </div>

            <div class="items">
                ${formatDescription(
                    purchase.description
                )}
            </div>

            <div class="points">
                +${calculatedPoints} points
            </div>

        </div>

    `;

}


/* ============================================================
   CALCULATE STATS
   ============================================================ */

function calculateStats(purchases){

    const history =
        Array.isArray(purchases)
        ? purchases
        : [];

    let lifetimeSpend = 0;

    let points = 0;

    history.forEach(
        purchase => {

            const amount =
                Number(
                    purchase.amount || 0
                );

            lifetimeSpend +=
                amount;

            points +=
                Math.floor(
                    amount / 50
                );

        }
    );

    return {

        points:
            points,

        visits:
            history.length,

        lifetimeSpend:
            lifetimeSpend

    };

}


/* ============================================================
   WHATSAPP
   ============================================================ */

function sendLoyaltyWhatsApp(
    phone,
    name,
    points
){

    let number =
        String(phone || "")
        .replace(/\D/g,"");

    if(
        number.startsWith("00")
    ){

        number =
            number.substring(2);

    }

    if(
        number.length === 10
    ){

        number =
            "91" + number;

    }

    const message =
        `Hi ${name}! 🎉 You currently have ${points} loyalty points with Chaatarra. Thank you for being our valued customer! ❤️`;

    window.open(
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(
            message
        ),
        "_blank"
    );

}


/* ============================================================
   FORMAT DESCRIPTION
   ============================================================ */

function formatDescription(
    description
){

    if(!description){

        return "Purchase";

    }

    try{

        const parsed =
            typeof description ===
            "string"

            ? JSON.parse(
                description
            )

            : description;

        if(
            Array.isArray(parsed)
        ){

            return parsed
                .map(item => {

                    if(
                        typeof item ===
                        "string"
                    ){

                        return escapeHtml(
                            item
                        );

                    }

                    const name =
                        item.name ||
                        item.item ||
                        "Item";

                    const qty =
                        item.quantity ||
                        item.qty ||
                        1;

                    return `
                        ${escapeHtml(name)}
                        ×${escapeHtml(qty)}
                    `;

                })
                .join("<br>");

        }

    }catch(e){

        console.warn(
            "Could not parse purchase description:",
            e
        );

    }

    return escapeHtml(
        String(description)
    )
    .replace(
        /\n/g,
        "<br>"
    );

}


/* ============================================================
   EXPORT LOCAL LOYALTY BACKUP
   ============================================================ */

async function exportBackup(){

    const status =
        document.getElementById(
            "backupStatus"
        );

    try{

        status.textContent =
            "Preparing backup...";

        const customers =
            await getAllFromStore(
                "customers"
            );

        const orders =
            await getAllFromStore(
                "orders"
            );

        const backup = {

            backupType:
                "CHAATARRA_LOCAL_LOYALTY_BACKUP",

            version:
                1,

            exportedAt:
                new Date().toISOString(),

            database:
                LOCAL_DB_NAME,

            customers:
                customers,

            orders:
                orders

        };

        const json =
            JSON.stringify(
                backup,
                null,
                2
            );

        const date =
            new Date()
            .toISOString()
            .slice(0,10);

        const fileName =
            "chaatarra_loyalty_backup_" +
            date +
            ".json";

        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );

        if(
            navigator.share &&
            typeof File !== "undefined"
        ){

            try{

                const file =
                    new File(
                        [blob],
                        fileName,
                        {
                            type:
                                "application/json"
                        }
                    );

                let canShareFile =
                    true;

                if(
                    navigator.canShare
                ){

                    canShareFile =
                        navigator.canShare({
                            files:[
                                file
                            ]
                        });

                }

                if(
                    canShareFile
                ){

                    status.textContent =
                        "Opening share options...";

                    await navigator.share({

                        title:
                            "Chaatarra Loyalty Backup",

                        text:
                            "Chaatarra local loyalty database backup",

                        files:[
                            file
                        ]

                    });

                    status.textContent =
                        "Backup ready — " +
                        customers.length +
                        " customers and " +
                        orders.length +
                        " orders.";

                    return;

                }

            }catch(shareError){

                console.warn(
                    "Share method unavailable:",
                    shareError
                );

                if(
                    shareError &&
                    shareError.name ===
                    "AbortError"
                ){

                    status.textContent =
                        "Backup sharing cancelled.";

                    return;

                }

            }

        }

        const url =
            URL.createObjectURL(
                blob
            );

        const link =
            document.createElement(
                "a"
            );

        link.href =
            url;

        link.download =
            fileName;

        link.style.display =
            "none";

        document.body.appendChild(
            link
        );

        link.dispatchEvent(
            new MouseEvent(
                "click",
                {
                    bubbles:true,
                    cancelable:true,
                    view:window
                }
            )
        );

        link.remove();

        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            5000
        );

        status.textContent =
            "Backup exported — " +
            customers.length +
            " customers and " +
            orders.length +
            " orders.";

    }catch(error){

        console.error(
            "BACKUP EXPORT ERROR:",
            error
        );

        try{

            const customers =
                await getAllFromStore(
                    "customers"
                );

            const orders =
                await getAllFromStore(
                    "orders"
                );

            const backup = {

                backupType:
                    "CHAATARRA_LOCAL_LOYALTY_BACKUP",

                version:
                    1,

                exportedAt:
                    new Date().toISOString(),

                database:
                    LOCAL_DB_NAME,

                customers:
                    customers,

                orders:
                    orders

            };

            const json =
                JSON.stringify(
                    backup,
                    null,
                    2
                );

            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const newWindow =
                window.open(
                    url,
                    "_blank"
                );

            if(!newWindow){

                throw new Error(
                    "The browser blocked the backup window."
                );

            }

            status.textContent =
                "Download was blocked. The backup JSON was opened in a new tab. Save it from there.";

        }catch(fallbackError){

            console.error(
                "BACKUP FALLBACK ERROR:",
                fallbackError
            );

            status.textContent =
                "Export failed: " +
                (
                    fallbackError.message ||
                    String(fallbackError)
                );

        }

    }

}


/* ============================================================
   IMPORT LOCAL LOYALTY BACKUP
   ============================================================ */

async function importBackup(event){

    const file =
        event.target.files &&
        event.target.files[0];

    const status =
        document.getElementById(
            "backupStatus"
        );

    if(!file){

        return;

    }

    try{

        status.textContent =
            "Reading backup...";

        const text =
            await file.text();

        const backup =
            JSON.parse(
                text
            );

        if(
            !backup ||
            backup.backupType !==
            "CHAATARRA_LOCAL_LOYALTY_BACKUP"
        ){

            throw new Error(
                "This is not a valid Chaatarra Loyalty backup file."
            );

        }

        if(
            !Array.isArray(
                backup.customers
            )
        ){

            throw new Error(
                "Backup does not contain customer data."
            );

        }

        if(
            !Array.isArray(
                backup.orders
            )
        ){

            throw new Error(
                "Backup does not contain order data."
            );

        }

        const db =
            await openLocalDB();

        const transaction =
            db.transaction(
                [
                    "customers",
                    "orders"
                ],
                "readwrite"
            );

        const customersStore =
            transaction.objectStore(
                "customers"
            );

        const ordersStore =
            transaction.objectStore(
                "orders"
            );

        backup.customers.forEach(
            customer => {

                if(
                    customer &&
                    customer.id
                ){

                    customersStore.put(
                        customer
                    );

                }

            }
        );

        backup.orders.forEach(
            order => {

                if(
                    order &&
                    order.id
                ){

                    ordersStore.put(
                        order
                    );

                }

            }
        );

        await new Promise(
            (resolve,reject) => {

                transaction.oncomplete =
                    () => {

                        resolve();

                    };

                transaction.onerror =
                    () => {

                        reject(
                            transaction.error
                        );

                    };

                transaction.onabort =
                    () => {

                        reject(
                            transaction.error ||
                            new Error(
                                "Import transaction aborted."
                            )
                        );

                    };

            }
        );

        status.textContent =
            "Backup imported successfully — " +
            backup.customers.length +
            " customers and " +
            backup.orders.length +
            " orders restored.";

        await loadCustomers();

    }catch(error){

        console.error(
            "BACKUP IMPORT ERROR:",
            error
        );

        status.textContent =
            "Import failed: " +
            (
                error.message ||
                String(error)
            );

    }finally{

        event.target.value = "";

    }

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   ESCAPE ATTRIBUTE
   ============================================================ */

function escapeAttr(value){

    return escapeHtml(
        value
    )
    .replace(
        /`/g,
        "&#096;"
    );

}
