```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin - KOT System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}


/* ================================
   HEADER
================================ */

header {
    background: #650028;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 6px 0 0;
    color: #ffd700;
}


/* ================================
   MAIN
================================ */

#orders {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}


/* ================================
   ORDER CARD
================================ */

.order {
    background: #222;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    border-left: 6px solid #d88a00;
}

.order.ready-order {
    border-left-color: #16803c;
}


/* ================================
   ORDER HEADER
================================ */

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.order-number {
    font-size: 24px;
    font-weight: bold;
}

.table {
    margin-top: 5px;
    color: #ffd700;
    font-weight: bold;
}

.time {
    color: #aaa;
    font-size: 14px;
}


/* ================================
   COUNTER GRID
================================ */

.counter-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.counter {
    background: #181818;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
}

.counter-name {
    font-weight: bold;
    margin-bottom: 10px;
}


/* ================================
   STATUS
================================ */

.status {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 7px;
    font-weight: bold;
    font-size: 14px;
}

.status-ready {
    background: #16803c;
}

.status-preparing {
    background: #d88a00;
}

.status-pending {
    background: #555;
}

.status-none {
    background: #333;
    color: #888;
}


/* ================================
   OVERALL STATUS
================================ */

.overall {
    border-top: 1px solid #333;
    padding-top: 15px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
    flex-wrap: wrap;
}

.overall-label {
    font-size: 18px;
    font-weight: bold;
}

.overall-status {
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
}

.waiting {
    background: #d88a00;
}

.all-ready {
    background: #16803c;
}


/* ================================
   EMPTY
================================ */

.empty {
    text-align: center;
    padding: 70px 20px;
    color: #888;
    font-size: 20px;
}


/* ================================
   NOTIFICATION
================================ */

#notification {
    position: fixed;

    top: 20px;
    right: 20px;

    background: #16803c;
    color: white;

    padding: 18px 24px;

    border-radius: 12px;

    font-size: 18px;
    font-weight: bold;

    box-shadow: 0 5px 25px rgba(0,0,0,0.5);

    display: none;

    z-index: 9999;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

    .counter-grid {
        grid-template-columns: 1fr;
    }

    .order-header {
        align-items: flex-start;
    }

}

</style>

</head>


<body>


<header>

    <h1>ADMIN / BILLING</h1>

    <p>Order Preparation Monitor</p>

</header>


<div id="notification">
    ORDER READY
</div>


<div id="orders">

    <div class="empty">
        Loading orders...
    </div>

</div>


<script>


/* =========================================
   PREVIOUS READY ORDERS
========================================= */

let previouslyReady = new Set();


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

    const container = document.getElementById("orders");


    const { data: orders, error } = await supabaseClient

        .from("orders")

        .select(`
            id,
            order_number,
            customer_name,
            table_number,
            created_at
        `)

        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Failed to load orders
            </div>
        `;

        return;
    }


    if (!orders || orders.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No orders yet
            </div>
        `;

        return;
    }


    /* =====================================
       GET ALL COUNTER KOTS
    ===================================== */

    const { data: kots, error: kotError } = await supabaseClient

        .from("counter_kot")

        .select(`
            id,
            order_id,
            counter,
            status,
            created_at,
            ready_at
        `);


    if (kotError) {

        console.error(kotError);

        container.innerHTML = `
            <div class="empty">
                Failed to load counter status
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    /* =====================================
       CREATE ORDER CARDS
    ===================================== */

    orders.forEach(order => {


        const orderKots = (kots || []).filter(
            kot => kot.order_id === order.id
        );


        const chaatKot = orderKots.find(
            kot => kot.counter === "chaats"
        );


        const drinksKot = orderKots.find(
            kot => kot.counter === "drinks"
        );


        const burgerKot = orderKots.find(
            kot => kot.counter === "burgers"
        );


        /* =================================
           OVERALL READINESS
        ================================= */

        const requiredKots = orderKots;


        const allReady =
            requiredKots.length > 0 &&
            requiredKots.every(
                kot => kot.status === "Ready"
            );


        /* =================================
           STATUS HTML
        ================================= */

        function getStatusHTML(kot) {

            if (!kot) {

                return `
                    <span class="status status-none">
                        —
                    </span>
                `;

            }


            if (kot.status === "Ready") {

                return `
                    <span class="status status-ready">
                        READY
                    </span>
                `;

            }


            if (kot.status === "Preparing") {

                return `
                    <span class="status status-preparing">
                        PREPARING
                    </span>
                `;

            }


            return `
                <span class="status status-pending">
                    PENDING
                </span>
            `;

        }


        const createdTime =
            new Date(order.created_at)
            .toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });


        /* =================================
           ORDER CARD
        ================================= */

        const card = document.createElement("div");

        card.className =
            "order " +
            (allReady ? "ready-order" : "");


        card.innerHTML = `

            <div class="order-header">

                <div>

                    <div class="order-number">
                        Order #${order.order_number}
                    </div>

                    <div class="table">
                        Table: ${order.table_number || "-"}
                    </div>

                </div>


                <div class="time">
                    ${createdTime}
                </div>

            </div>


            <div class="counter-grid">


                <div class="counter">

                    <div class="counter-name">
                        🥗 CHAATS
                    </div>

                    ${getStatusHTML(chaatKot)}

                </div>


                <div class="counter">

                    <div class="counter-name">
                        🥤 DRINKS
                    </div>

                    ${getStatusHTML(drinksKot)}

                </div>


                <div class="counter">

                    <div class="counter-name">
                        🍔 BURGERS
                    </div>

                    ${getStatusHTML(burgerKot)}

                </div>


            </div>


            <div class="overall">


                <div class="overall-label">
                    Overall Status
                </div>


                ${
                    allReady

                    ?

                    `
                    <div class="overall-status all-ready">
                        ✓ ALL READY
                    </div>
                    `

                    :

                    `
                    <div class="overall-status waiting">
                        WAITING
                    </div>
                    `
                }


            </div>

        `;


        container.appendChild(card);


        /* =================================
           READY NOTIFICATION
        ================================= */

        if (
            allReady &&
            !previouslyReady.has(order.id)
        ) {

            showReadyNotification(
                order.order_number
            );

        }


    });


    /* =====================================
       UPDATE READY MEMORY
    ===================================== */

    previouslyReady = new Set(

        orders
            .filter(order => {

                const orderKots =
                    (kots || []).filter(
                        kot => kot.order_id === order.id
                    );

                return (
                    orderKots.length > 0 &&
                    orderKots.every(
                        kot => kot.status === "Ready"
                    )
                );

            })
            .map(order => order.id)

    );

}


/* =========================================
   NOTIFICATION
========================================= */

function showReadyNotification(orderNumber) {

    const notification =
        document.getElementById("notification");


    notification.innerHTML =
        `🔔 ORDER #${orderNumber} READY`;


    notification.style.display = "block";


    /* ================================
       SOUND
    ================================= */

    try {

        const audio =
            new Audio("sounds/new-order.mp3");

        audio.play().catch(() => {});

    } catch (error) {

        console.log("Sound unavailable");

    }


    /* ================================
       BROWSER NOTIFICATION
    ================================= */

    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {

        new Notification(
            `Order #${orderNumber} Ready`,
            {
                body: "All required counters have completed the order."
            }
        );

    }


    /* ================================
       HIDE AFTER 5 SECONDS
    ================================= */

    setTimeout(() => {

        notification.style.display = "none";

    }, 5000);

}


/* =========================================
   REQUEST BROWSER NOTIFICATION
========================================= */

if (
    "Notification" in window &&
    Notification.permission === "default"
) {

    Notification.requestPermission();

}


/* =========================================
   REALTIME
========================================= */

supabaseClient

    .channel("admin-orders")

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "orders"
        },
        () => {

            loadOrders();

        }
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "counter_kot"
        },
        () => {

            loadOrders();

        }
    )

    .subscribe();


/* =========================================
   INITIAL LOAD
========================================= */

loadOrders();


</script>

</body>

</html>
