.ai-orb {

    display: grid;

    position: relative;

    z-index: 5;

    transition: .3s;

    animation: breathe 3s infinite;

}


.ai-orb span {

.ai-orb:active {

}


@keyframes breathe {

    0%,100% {

            rgba(215,181,109,.4),

}


/* =========================
   RINGS
========================= */

.orb-ring {

    border-radius: 50%;

}


.ring1 {

    width: 190px;

.ring2 {

.ring3 {

<script>


/* =========================
   SUPABASE FUNCTION
========================= */

const SUPABASE_FUNCTION_URL =
    "https://ucqeyhcycwksiubmlilg.supabase.co/functions/v1/restaurant-ai";


/* =========================
   ELEMENTS
========================= */

const voiceButton =
    document.getElementById("voiceButton");

const voiceStatus =
    document.getElementById("voiceStatus");

const voiceHint =
    document.getElementById("voiceHint");


/* =========================
   RECORDER
========================= */

let recorder = null;

let audioChunks = [];

let microphoneStream = null;


/* =========================
   VOICE BUTTON
========================= */

voiceButton.addEventListener(
    "click",
    startRecording
);


/* =========================
   START RECORDING
========================= */

async function startRecording() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        showError(
            "Microphone unavailable",
            "Open this website using HTTPS."
        );

        return;

    }


    try {

        microphoneStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        recorder =
            new MediaRecorder(
                microphoneStream
            );


        audioChunks = [];


        recorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {

                    audioChunks.push(
                        event.data
                    );

                }

            };


        recorder.onstop =
            async function() {

                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder.mimeType
                        }
                    );


                console.log(
                    "Audio captured:",
                    audioBlob
                );


                voiceStatus.textContent =
                    "Connecting to Gemini...";


                voiceHint.textContent =
                    "Please wait";


                stopMicrophone();


                /*
                   TEMPORARY GEMINI TEST

                   Our current Supabase function
                   accepts text.

                   The next step will make
                   Gemini understand the actual
                   recorded audio.
                */

                await sendMessageToGemini(
                    "Hello! I am speaking to you from my restaurant AI assistant. Please introduce yourself."
                );

            };


        recorder.start();


        voiceStatus.textContent =
            "Listening...";


        voiceHint.textContent =
            "Speak now";


        voiceButton.style.transform =
            "scale(1.12)";


        setTimeout(
            stopRecording,
            5000
        );


    }

    catch(error) {

        console.error(error);


        showError(
            "Microphone blocked",
            "Please allow microphone access."
        );

    }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording() {

    if (
        recorder &&
        recorder.state === "recording"
    ) {

        recorder.stop();

    }

}


/* =========================
   STOP MICROPHONE
========================= */

function stopMicrophone() {

    if (microphoneStream) {

        microphoneStream
            .getTracks()
            .forEach(
                track => track.stop()
            );


        microphoneStream = null;

    }


    voiceButton.style.transform =
        "scale(1)";

}


/* =========================
   SEND MESSAGE TO GEMINI
========================= */

async function sendMessageToGemini(message) {

    try {

        if (
            SUPABASE_FUNCTION_URL ===
            "PASTE_YOUR_SUPABASE_FUNCTION_URL_HERE"
        ) {

            throw new Error(
                "Supabase Function URL has not been added yet."
            );

        }


        const response =
            await fetch(
                SUPABASE_FUNCTION_URL,
                {

                    method: "POST",

                    headers: {

    "Content-Type":
        "application/json",

    "Authorization":
        "Bearer sb_publishable_YdIvl7IqdpT0UZOHBumEiw_ZThYEsgV"

},

                    body:
                        JSON.stringify({

                            message: message

                        })

                }
            );


        const data =
            await response.json();


        console.log(
            "Gemini response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Gemini request failed."
            );

        }


        const reply =
    data.answer ||
    "Gemini returned no response.";


        voiceStatus.textContent =
            "Gemini is connected ✓";


        voiceHint.textContent =
            reply;


        /*
           Also speak the response
           using the tablet's built-in
           text-to-speech engine.
        */

        speakReply(reply);


    }

    catch(error) {

        console.error(error);


        showError(
            "Connection error",
            error.message
        );

    }

}


/* =========================
   TEXT TO SPEECH
========================= */

function speakReply(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.rate = 0.95;

    speech.pitch = 1;

    speech.volume = 1;


    window.speechSynthesis.speak(
        speech
    );

}


/* =========================
   ERROR
========================= */

function showError(
    title,
    message
) {

    voiceStatus.textContent =
        title;


    voiceHint.textContent =
        message;


    voiceButton.style.transform =
        "scale(1)";


    console.error(
        title,
        message
    );

}


/* =========================
   SETTINGS BUTTON
========================= */

document
    .getElementById("settingsButton")
    .addEventListener(
        "click",
        function() {

            alert(
                "Restaurant AI settings will be added here."
            );

        }
    );


</script>
