<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nexa Table AI</title>

<link rel="stylesheet" href="style.css">

</head><body><div class="app">

    <!-- HEADER -->
    <header class="topbar">
        <div class="brand">
            <div class="logo">N</div>

            <div>
                <h1>NEXA TABLE</h1>
                <span>AI RESTAURANT ASSISTANT</span>
            </div>
        </div>

        <button class="settings">⚙</button>
    </header>


    <!-- MAIN -->
    <main>

        <section class="welcome">
            <span class="status">● SYSTEM ONLINE</span>

            <h2>Good evening.</h2>
            <p>How can I help you today?</p>
        </section>


        <!-- AI VOICE CORE -->
        <section class="ai-core">

            <div class="orb-ring ring-1"></div>
            <div class="orb-ring ring-2"></div>
            <div class="orb-ring ring-3"></div>

            <button class="ai-orb" id="voiceButton">
                <span>⌁</span>
            </button>

            <div class="voice-text">
                <strong>Talk to your AI</strong>
                <small>Tap to speak</small>
            </div>

        </section>


        <!-- QUICK ACTIONS -->
        <section class="quick-actions">

            <button class="action-card">
                <span class="icon">₹</span>
                <div>
                    <strong>Today's Sales</strong>
                    <small>View revenue</small>
                </div>
            </button>

            <button class="action-card">
                <span class="icon">▣</span>
                <div>
                    <strong>Orders</strong>
                    <small>Live orders</small>
                </div>
            </button>

            <button class="action-card">
                <span class="icon">◈</span>
                <div>
                    <strong>Inventory</strong>
                    <small>Check stock</small>
                </div>
            </button>

            <button class="action-card">
                <span class="icon">⌁</span>
                <div>
                    <strong>Reports</strong>
                    <small>Business insights</small>
                </div>
            </button>

        </section>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button class="nav-item active">
            <span>⌂</span>
            Home
        </button>

        <button class="nav-item">
            <span>▣</span>
            Orders
        </button>

        <button class="nav-item">
            <span>◈</span>
            Stock
        </button>

        <button class="nav-item">
            <span>▤</span>
            Reports
        </button>

    </nav>

</div>

<script src="app.js"></script>

</body>
</html>
