* {

.ai-core {
    height: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

.ai-orb {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #fff5d6 0%,
            #d7b56d 15%,
            #8e6c36 45%,
            #17130c 72%
        );
    box-shadow:
        0 0 25px rgba(215,181,109,.45),
        0 0 80px rgba(215,181,109,.18),
        inset 0 0 30px rgba(255,255,255,.15);
    display: grid;
    place-items: center;
    position: relative;
    z-index: 5;
    transition: .3s;
    animation: breathe 3s infinite;
}

.ai-orb span {
    font-size: 45px;
}

.ai-orb:active {
    transform: scale(.92);
}

@keyframes breathe {

    0%,100% {
        box-shadow:
            0 0 25px rgba(215,181,109,.4),
            0 0 60px rgba(215,181,109,.15);
    }

    50% {
        box-shadow:
            0 0 40px rgba(215,181,109,.7),
            0 0 110px rgba(215,181,109,.25);
    }

}

.orb-ring {
    position: absolute;
    border:
        1px solid
        rgba(215,181,109,.18);
    border-radius: 50%;
}

.ring1 {

    height: 190px;

.ring2 {

.ring3 {

        </span>

        </small>

<script>

/* =========================
   AI FUNCTION
========================= */

const SUPABASE_FUNCTION_URL =
    "https://ucqeyhcycwksiubmlilg.supabase.co/functions/v1/restaurant-ai";


/* =========================
   ELEMENTS
========================= */

const voiceButton =
    document.getElementById("voiceButton");

const voiceStatus =
    document.getElementById("voiceStatus");

const voiceHint =
    document.getElementById("voiceHint");


/* =========================
   RECORDER
========================= */

let recorder = null;

let audioChunks = [];

let microphoneStream = null;


/* =========================
   VOICE BUTTON
========================= */

voiceButton.addEventListener(
    "click",
    startRecording
);


/* =========================
   START RECORDING
========================= */

async function startRecording() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        showError(
            "Microphone unavailable",
            "Open this website using HTTPS."
        );

        return;

    }

    try {

        microphoneStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        recorder =
            new MediaRecorder(
                microphoneStream
            );


        audioChunks = [];


        recorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {

                    audioChunks.push(
                        event.data
                    );

                }

            };


        recorder.onstop =
            async function() {

                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder.mimeType
                        }
                    );


                console.log(
                    "Audio captured:",
                    audioBlob
                );


                voiceStatus.textContent =
                    "Processing...";

                voiceHint.textContent =
                    "Please wait";


                stopMicrophone();


                /*
                   TEMPORARY VOICE TEST

                   The audio is captured,
                   but actual speech-to-text
                   will be connected next.
                */

                await sendMessageToAI(
                    "Hello! Please introduce yourself as the restaurant AI assistant."
                );

            };


        recorder.start();


        voiceStatus.textContent =
            "Listening...";

        voiceHint.textContent =
            "Speak now";


        voiceButton.style.transform =
            "scale(1.12)";


        setTimeout(
            stopRecording,
            5000
        );

    }

    catch(error) {

        console.error(error);

        showError(
            "Microphone blocked",
            "Please allow microphone access."
        );

    }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording() {

    if (
        recorder &&
        recorder.state === "recording"
    ) {

        recorder.stop();

    }

}


/* =========================
   STOP MICROPHONE
========================= */

function stopMicrophone() {

    if (microphoneStream) {

        microphoneStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        microphoneStream = null;

    }

    voiceButton.style.transform =
        "scale(1)";

}


/* =========================
   SEND MESSAGE TO AI
========================= */

async function sendMessageToAI(message) {

    try {

        const response =
            await fetch(
                SUPABASE_FUNCTION_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer sb_publishable_YdIvl7IqdpT0UZOHBumEiw_ZThYEsgV"

                    },

                    body:
                        JSON.stringify({
                            message: message
                        })

                }
            );


        const data =
            await response.json();


        console.log(
            "AI response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI request failed."
            );

        }


        const reply =
            data.answer ||
            "The assistant did not return a response.";


        voiceStatus.textContent =
            "Reemy AI ✓";

        voiceHint.textContent =
            reply;


        speakReply(reply);

    }

    catch(error) {

        console.error(error);

        showError(
            "Connection error",
            error.message
        );

    }

}


/* =========================
   TEXT TO SPEECH
========================= */

function speakReply(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }

    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.rate = 0.95;

    speech.pitch = 1;

    speech.volume = 1;


    window.speechSynthesis.speak(
        speech
    );

}


/* =========================
   ERROR
========================= */

function showError(
    title,
    message
) {

    voiceStatus.textContent =
        title;

    voiceHint.textContent =
        message;

    voiceButton.style.transform =
        "scale(1)";

    console.error(
        title,
        message
    );

}


/* =========================
   QUICK ACTIONS
========================= */

const actionCards =
    document.querySelectorAll(".action-card");


/* TODAY'S SALES */

actionCards[0].addEventListener(
    "click",
    function() {

        voiceStatus.textContent =
            "Checking today's sales...";

        voiceHint.textContent =
            "Reading restaurant data...";

        sendMessageToAI(
            "How much were today's sales? Calculate the total sales from today's orders using the order total field."
        );

    }
);


/* ORDERS */

actionCards[1].addEventListener(
    "click",
    function() {

        sendMessageToAI(
            "How many orders do we have today?"
        );

    }
);


/* INVENTORY */

actionCards[2].addEventListener(
    "click",
    function() {

        sendMessageToAI(
            "Give me an overview of the restaurant inventory."
        );

    }
);


/* REPORTS */

actionCards[3].addEventListener(
    "click",
    function() {

        sendMessageToAI(
            "Give me a brief business report based on the restaurant data available to you."
        );

    }
);


/* =========================
   SETTINGS BUTTON
========================= */

document
    .getElementById("settingsButton")
    .addEventListener(
        "click",
        function() {

            alert(
                "NEXA AI settings will be added here."
            );

        }
    );

</script>

</body>
