<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Billing</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=4"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #4b001f;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 15px;
        }

        .section {
            background: white;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-top: 0;
            color: #4b001f;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            background: #fff;
        }

        .item-name {
            font-weight: bold;
            font-size: 17px;
        }

        .item-price {
            color: #4b001f;
            font-weight: bold;
            margin-top: 5px;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .quantity-row button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 6px;
            background: #4b001f;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity {
            font-size: 18px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .customer-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .customer-box input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .cart {
            margin-top: 10px;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            text-align: right;
            font-size: 24px;
            font-weight: bold;
            color: #4b001f;
            margin-top: 15px;
        }

        .place-order {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: #4b001f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            min-height: 24px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<header>
    <h1>Cafe Billing</h1>
    <p>Main Billing Counter</p>
</header>

<div class="container">

    <!-- CUSTOMER -->
    <div class="section">

        <h2>Customer</h2>

        <div class="customer-box">

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
            >

        </div>

    </div>


    <!-- CHAATS -->
    <div class="section">

        <h2>Chaats</h2>

        <div class="menu-grid" id="chaatsMenu"></div>

    </div>


    <!-- DRINKS -->
    <div class="section">

        <h2>Drinks</h2>

        <div class="menu-grid" id="drinksMenu"></div>

    </div>


    <!-- BURGERS -->
    <div class="section">

        <h2>Burgers</h2>

        <div class="menu-grid" id="burgersMenu"></div>

    </div>


    <!-- CART -->
    <div class="section">

        <h2>Order</h2>

        <div id="cart" class="cart">
            No items selected.
        </div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <button
            class="place-order"
            id="placeOrder"
            onclick="placeOrder()"
        >
            PLACE ORDER
        </button>

        <div id="message"></div>

    </div>

</div>


<script>

    const menu = {

        // CHAATS
        "Pani Puri": {
            price: 50,
            counter: "chaats"
        },

        "Masala Puri": {
            price: 60,
            counter: "chaats"
        },

        "Samosa Chaat": {
            price: 80,
            counter: "chaats"
        },

        "Dahi Puri": {
            price: 80,
            counter: "chaats"
        },


        // DRINKS
        "Mango Shake": {
            price: 90,
            counter: "drinks"
        },

        "Oreo Shake": {
            price: 80,
            counter: "drinks"
        },

        "Strawberry Shake": {
            price: 90,
            counter: "drinks"
        },

        "Mint Lime": {
            price: 35,
            counter: "drinks"
        },


        // BURGERS
        "Classic Burger": {
            price: 120,
            counter: "burgers"
        },

        "Chicken Burger": {
            price: 150,
            counter: "burgers"
        },

        "Cheese Burger": {
            price: 140,
            counter: "burgers"
        },

        "Double Burger": {
            price: 180,
            counter: "burgers"
        }

    };


    const quantities = {};


    // CREATE MENU
    function createMenu(containerId, counter) {

        const container = document.getElementById(containerId);

        container.innerHTML = "";

        Object.keys(menu).forEach(item => {

            if (menu[item].counter !== counter) {
                return;
            }

            quantities[item] = 0;

            const div = document.createElement("div");

            div.className = "item";

            div.innerHTML = `

                <div class="item-name">
                    ${item}
                </div>

                <div class="item-price">
                    ₹${menu[item].price}
                </div>

                <div class="quantity-row">

                    <button onclick="changeQuantity('${item}', -1)">
                        −
                    </button>

                    <span
                        class="quantity"
                        id="qty-${item.replace(/[^a-zA-Z0-9]/g, '')}"
                    >
                        0
                    </span>

                    <button onclick="changeQuantity('${item}', 1)">
                        +
                    </button>

                </div>

            `;

            container.appendChild(div);

        });

    }


    createMenu("chaatsMenu", "chaats");

    createMenu("drinksMenu", "drinks");

    createMenu("burgersMenu", "burgers");


    // CHANGE QUANTITY
    function changeQuantity(item, change) {

        quantities[item] += change;

        if (quantities[item] < 0) {
            quantities[item] = 0;
        }

        const id =
            "qty-" +
            item.replace(/[^a-zA-Z0-9]/g, "");

        document.getElementById(id).textContent =
            quantities[item];

        updateCart();

    }


    // UPDATE CART
    function updateCart() {

        const cart = document.getElementById("cart");

        let total = 0;

        let html = "";

        let hasItems = false;


        Object.keys(menu).forEach(item => {

            const qty = quantities[item];

            if (qty > 0) {

                hasItems = true;

                const amount =
                    menu[item].price * qty;

                total += amount;

                html += `

                    <div class="cart-row">

                        <span>
                            ${item} × ${qty}
                        </span>

                        <span>
                            ₹${amount}
                        </span>

                    </div>

                `;

            }

        });


        if (!hasItems) {

            cart.innerHTML =
                "No items selected.";

        } else {

            cart.innerHTML = html;

        }


        document.getElementById("total").textContent =
            total;

    }


    // PLACE ORDER
    async function placeOrder() {

        const button =
            document.getElementById("placeOrder");

        const message =
            document.getElementById("message");

        const customerName =
            document.getElementById("customerName").value.trim();


        const selectedItems = [];

        let total = 0;


        Object.keys(menu).forEach(item => {

            if (quantities[item] > 0) {

                const itemTotal =
                    menu[item].price *
                    quantities[item];

                selectedItems.push({

                    name: item,

                    price: menu[item].price,

                    quantity: quantities[item],

                    counter: menu[item].counter

                });

                total += itemTotal;

            }

        });


        if (selectedItems.length === 0) {

            message.className = "error";

            message.textContent =
                "Please select at least one item.";

            return;

        }


        button.disabled = true;

        button.textContent =
            "PLACING ORDER...";

        message.textContent = "";


        try {

            // INSERT MAIN ORDER
            const { data: order, error: orderError } =
                await supabaseClient

                    .from("orders")

                    .insert({

                        customer_name:
                            customerName || null,

                        items:
                            selectedItems,

                        total:
                            total,

                        status:
                            "Pending"

                    })

                    .select()

                    .single();


            if (orderError) {

                throw orderError;

            }


            // GROUP ITEMS BY COUNTER

            const counterItems = {

                chaats: [],

                drinks: [],

                burgers: []

            };


            selectedItems.forEach(item => {

                if (counterItems[item.counter]) {

                    counterItems[item.counter].push(item);

                }

            });


            // CREATE KOTs

            const kotRows = [];


            Object.keys(counterItems).forEach(counter => {

                if (counterItems[counter].length > 0) {

                    kotRows.push({

                        order_id:
                            order.id,

                        counter:
                            counter,

                        items:
                            counterItems[counter],

                        status:
                            "Pending"

                    });

                }

            });


            if (kotRows.length > 0) {

                const { error: kotError } =
                    await supabaseClient

                        .from("counter_kot")

                        .insert(kotRows);


                if (kotError) {

                    throw kotError;

                }

            }


            // SUCCESS

            message.className = "success";

            message.textContent =
                "Order #" +
                order.order_number +
                " sent to counters!";


            /*
             * Automatically reload the billing page
             * after a short delay.
             */

            setTimeout(() => {

                window.location.reload();

            }, 1200);


        } catch (error) {

            console.error(error);

            message.className = "error";

            message.textContent =
                "Order failed. Please try again.";

            button.disabled = false;

            button.textContent =
                "PLACE ORDER";

        }

    }

</script>

</body>
</html>
