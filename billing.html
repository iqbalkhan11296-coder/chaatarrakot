<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Billing</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=4"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #4b001f;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 15px;
        }

        .section {
            background: white;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-top: 0;
            color: #4b001f;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            background: #fff;
        }

        .item-name {
            font-weight: bold;
            font-size: 17px;
        }

        .item-price {
            color: #4b001f;
            font-weight: bold;
            margin-top: 5px;
        }

        .combo-label {
            display: inline-block;
            margin-top: 5px;
            padding: 3px 7px;
            border-radius: 4px;
            background: #4b001f;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .quantity-row button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 6px;
            background: #4b001f;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity {
            font-size: 18px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .customer-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .cart {
            margin-top: 10px;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }

        .cart-left {
            flex: 1;
        }

        .cart-right {
            white-space: nowrap;
            font-weight: bold;
        }

        .total {
            text-align: right;
            font-size: 24px;
            font-weight: bold;
            color: #4b001f;
            margin-top: 15px;
        }

        /* PAYMENT */

        .payment-title {
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4b001f;
        }

        .payment-options {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .payment-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #4b001f;
            border-radius: 8px;
            background: white;
            color: #4b001f;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .payment-btn.selected {
            background: #4b001f;
            color: white;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .buttons button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #placeOrder {
            background: #4b001f;
            color: white;
        }

        #printBill {
            background: #222;
            color: white;
            display: none;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            min-height: 24px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        #receipt {
            display: none;
        }

        /* ==========================================
           LOADING MENU
           ========================================== */

        .menu-loading {
            text-align: center;
            padding: 20px;
            color: #777;
            font-weight: bold;
        }

        .menu-error {
            text-align: center;
            padding: 20px;
            color: red;
            font-weight: bold;
        }

        /* ==========================================
           PRINT
           ========================================== */

        @media print {

            @page {
                size: 58mm auto;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: white;
            }

            body * {
                visibility: hidden;
            }

            #receipt,
            #receipt * {
                visibility: visible;
            }

            #receipt {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm;
                padding: 3mm;
                font-family: "Courier New", monospace;
                font-size: 11px;
                line-height: 1.3;
                color: black;
            }

            .receipt-header {
                text-align: center;
            }

            .receipt-title {
                font-size: 18px;
                font-weight: bold;
            }

            .receipt-subtitle {
                font-size: 10px;
            }

            .receipt-line {
                border-top: 1px dashed black;
                margin: 5px 0;
            }

            .receipt-info {
                font-size: 10px;
            }

            .receipt-item {
                margin: 5px 0;
            }

            .receipt-item-line {
                display: flex;
                justify-content: space-between;
                gap: 5px;
            }

            .receipt-item-name {
                width: 36mm;
                word-wrap: break-word;
            }

            .receipt-item-price {
                width: 13mm;
                text-align: right;
                white-space: nowrap;
            }

            .receipt-qty {
                font-size: 10px;
            }

            .receipt-payment {
                display: flex;
                justify-content: space-between;
                font-size: 11px;
                font-weight: bold;
            }

            .receipt-total {
                display: flex;
                justify-content: space-between;
                font-size: 14px;
                font-weight: bold;
            }

            .receipt-footer {
                text-align: center;
                margin-top: 8px;
                font-size: 10px;
            }
        }

        @media (max-width: 600px) {

            .payment-options {
                flex-direction: row;
            }

            .payment-btn {
                font-size: 15px;
                padding: 13px 8px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>Cafe Billing</h1>

    <p>Main Billing Counter</p>

</header>


<div class="container">


    <!-- CUSTOMER -->

    <div class="section">

        <h2>Customer</h2>

        <div class="customer-box">

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
            >

            <input
                type="tel"
                id="customerPhone"
                list="savedCustomerPhones"
                placeholder="Customer Phone Number"
                autocomplete="off"
            >

            <datalist id="savedCustomerPhones"></datalist>

        </div>

    </div>


    <!-- CHAATS -->

    <div class="section">

        <h2>Chaats</h2>

        <div
            class="menu-grid"
            id="chaatsMenu"
        >
            <div class="menu-loading">
                Loading menu...
            </div>
        </div>

    </div>


    <!-- DRINKS -->

    <div class="section">

        <h2>Drinks</h2>

        <div
            class="menu-grid"
            id="drinksMenu"
        >
            <div class="menu-loading">
                Loading menu...
            </div>
        </div>

    </div>


    <!-- BURGERS -->

    <div class="section">

        <h2>Burgers</h2>

        <div
            class="menu-grid"
            id="burgersMenu"
        >
            <div class="menu-loading">
                Loading menu...
            </div>
        </div>

    </div>


    <!-- COMBOS -->

    <div class="section">

        <h2>Combos</h2>

        <div
            class="menu-grid"
            id="combosMenu"
        ></div>

    </div>


    <!-- ORDER -->

    <div class="section">

        <h2>Order</h2>

        <div
            id="cart"
            class="cart"
        >
            No items selected.
        </div>

        <div class="total">

            Total: ₹<span id="total">0</span>

        </div>


        <!-- PAYMENT -->

        <div class="payment-title">
            Payment Method
        </div>

        <div class="payment-options">

            <button
                type="button"
                class="payment-btn selected"
                id="cashPayment"
                onclick="selectPayment('Cash')"
            >
                CASH
            </button>

            <button
                type="button"
                class="payment-btn"
                id="upiPayment"
                onclick="selectPayment('UPI')"
            >
                UPI
            </button>

        </div>


        <div class="buttons">

            <button
                id="placeOrder"
                onclick="placeOrder()"
            >
                PLACE ORDER
            </button>

            <button
                id="printBill"
                onclick="printBill()"
            >
                PRINT BILL
            </button>

        </div>

        <div id="message"></div>

    </div>

</div>


<!-- ========================= -->
<!-- 58MM THERMAL RECEIPT -->
<!-- ========================= -->

<div id="receipt">

    <div class="receipt-header">

        <div class="receipt-title">
            CHAATARRA
        </div>

        <div class="receipt-subtitle">
            The House of Chaats
        </div>

    </div>


    <div class="receipt-line"></div>


    <div class="receipt-info">

        <div>

            Order No:
            <span id="receiptOrderNumber"></span>

        </div>

        <div>

            Date:
            <span id="receiptDate"></span>

        </div>

        <div id="receiptCustomerRow">

            Customer:
            <span id="receiptCustomer"></span>

        </div>

        <div>

            Payment:
            <span id="receiptPayment"></span>

        </div>

    </div>


    <div class="receipt-line"></div>


    <div id="receiptItems"></div>


    <div class="receipt-line"></div>


    <div class="receipt-total">

        <span>TOTAL</span>

        <span>

            ₹<span id="receiptTotal"></span>

        </span>

    </div>


    <div class="receipt-line"></div>


    <div class="receipt-footer">

        Thank you!

        <br>

        Please visit again.

    </div>

</div>



<script>


/*
==================================================
SUPABASE
==================================================
*/

/*
supabase.js?v=4 creates:

supabaseClient

The existing Billing page continues using
the same Supabase connection.
*/


/*
==================================================
DYNAMIC MENU
==================================================
*/

const menu = {};


/*
==================================================
COMBOS
==================================================
*/

const combos = {

    "Pani Puri + Mint Lime": {

        price: 80,

        items: [

            {
                name: "Pani Puri",
                counter: "chaats"
            },

            {
                name: "Mint Lime",
                counter: "drinks"
            }

        ]

    },


    "Masala Puri + Mango Shake": {

        price: 140,

        items: [

            {
                name: "Masala Puri",
                counter: "chaats"
            },

            {
                name: "Mango Shake",
                counter: "drinks"
            }

        ]

    },


    "Classic Burger + Mango Shake": {

        price: 190,

        items: [

            {
                name: "Classic Burger",
                counter: "burgers"
            },

            {
                name: "Mango Shake",
                counter: "drinks"
            }

        ]

    },


    "Chicken Burger + Oreo Shake": {

        price: 210,

        items: [

            {
                name: "Chicken Burger",
                counter: "burgers"
            },

            {
                name: "Oreo Shake",
                counter: "drinks"
            }

        ]

    }

};


/*
==================================================
QUANTITIES
==================================================
*/

const quantities = {};

const comboQuantities = {};

let lastOrder = null;

let selectedPayment = "Cash";


/*
==================================================
SAVED CUSTOMERS
==================================================
*/

let savedCustomers = [];


/*
==================================================
PAYMENT SELECTION
==================================================
*/

function selectPayment(method) {

    selectedPayment = method;

    const cashButton =
        document.getElementById("cashPayment");

    const upiButton =
        document.getElementById("upiPayment");


    cashButton.classList.remove("selected");

    upiButton.classList.remove("selected");


    if (method === "Cash") {

        cashButton.classList.add("selected");

    }


    if (method === "UPI") {

        upiButton.classList.add("selected");

    }

}


/*
==================================================
CATEGORY → BILLING COUNTER
==================================================

IMPORTANT:

The category stored in Supabase is NOT changed.

This function only decides which existing Billing
section should display the item.

Examples:

Chaat       → chaats
Drinks      → drinks
Burgers     → burgers

It also supports category names containing
Chaat / Drink / Burger / Smash / Blend.
==================================================
*/

function getBillingCounter(category) {

    const value =
        String(category || "")
            .trim()
            .toLowerCase();


    /*
    CHAAT
    */

    if (
        value.includes("chaat")
    ) {

        return "chaats";

    }


    /*
    DRINKS / BLENDER
    */

    if (
        value.includes("drink") ||
        value.includes("beverage") ||
        value.includes("blend")
    ) {

        return "drinks";

    }


    /*
    BURGERS / SMASH
    */

    if (
        value.includes("burger") ||
        value.includes("smash")
    ) {

        return "burgers";

    }


    /*
    Exact common alternatives
    */

    if (
        value === "chaats"
    ) {

        return "chaats";

    }


    if (
        value === "drinks"
    ) {

        return "drinks";

    }


    if (
        value === "burgers"
    ) {

        return "burgers";

    }


    return null;

}


/*
==================================================
LOAD MENU FROM SUPABASE
==================================================
*/

async function loadMenu() {

    const chaatContainer =
        document.getElementById("chaatsMenu");

    const drinksContainer =
        document.getElementById("drinksMenu");

    const burgersContainer =
        document.getElementById("burgersMenu");


    chaatContainer.innerHTML =
        `<div class="menu-loading">Loading menu...</div>`;

    drinksContainer.innerHTML =
        `<div class="menu-loading">Loading menu...</div>`;

    burgersContainer.innerHTML =
        `<div class="menu-loading">Loading menu...</div>`;


    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from("chaat_products")

                .select(
                    "id, name, category, price, available"
                )

                .eq(
                    "available",
                    true
                )

                .order(
                    "id",
                    {
                        ascending: true
                    }
                );


        if (error) {

            throw error;

        }


        /*
        Clear the current menu
        */

        Object.keys(menu).forEach(item => {

            delete menu[item];

        });


        /*
        Reset quantities
        */

        Object.keys(quantities).forEach(item => {

            delete quantities[item];

        });


        /*
        Build menu from database
        */

        (data || []).forEach(product => {

            if (!product.name) {
                return;
            }


            const counter =
                getBillingCounter(
                    product.category
                );


            /*
            Unknown categories are not placed
            into a wrong counter.
            */

            if (!counter) {

                console.warn(
                    "Menu item category could not be mapped:",
                    product
                );

                return;

            }


            const price =
                Number(product.price || 0);


            menu[product.name] = {

                id:
                    product.id,

                price:
                    price,

                counter:
                    counter,

                category:
                    product.category

            };


            quantities[product.name] = 0;

        });


        /*
        Render menus
        */

        createMenu(
            "chaatsMenu",
            "chaats"
        );


        createMenu(
            "drinksMenu",
            "drinks"
        );


        createMenu(
            "burgersMenu",
            "burgers"
        );


    } catch (error) {

        console.error(
            "Menu loading failed:",
            error
        );


        chaatContainer.innerHTML =
            `<div class="menu-error">
                Could not load menu.
            </div>`;


        drinksContainer.innerHTML =
            `<div class="menu-error">
                Could not load menu.
            </div>`;


        burgersContainer.innerHTML =
            `<div class="menu-error">
                Could not load menu.
            </div>`;

    }

}


/*
==================================================
CREATE NORMAL MENU
==================================================
*/

function createMenu(containerId, counter) {

    const container =
        document.getElementById(
            containerId
        );


    container.innerHTML = "";


    let itemCount = 0;


    Object.keys(menu).forEach(item => {

        if (
            menu[item].counter !== counter
        ) {

            return;

        }


        itemCount++;


        quantities[item] = 0;


        const div =
            document.createElement("div");


        div.className =
            "item";


        /*
        Create safe DOM instead of putting
        item names directly into onclick HTML.
        */

        const itemName =
            document.createElement("div");

        itemName.className =
            "item-name";

        itemName.textContent =
            item;


        const itemPrice =
            document.createElement("div");

        itemPrice.className =
            "item-price";

        itemPrice.textContent =
            "₹" + menu[item].price;


        const quantityRow =
            document.createElement("div");

        quantityRow.className =
            "quantity-row";


        const minusButton =
            document.createElement("button");

        minusButton.type =
            "button";

        minusButton.textContent =
            "−";


        const quantity =
            document.createElement("span");

        quantity.className =
            "quantity";

        quantity.id =
            "qty-" +
            item.replace(
                /[^a-zA-Z0-9]/g,
                ""
            );

        quantity.textContent =
            "0";


        const plusButton =
            document.createElement("button");

        plusButton.type =
            "button";

        plusButton.textContent =
            "+";


        minusButton.addEventListener(
            "click",
            function() {

                changeQuantity(
                    item,
                    -1
                );

            }
        );


        plusButton.addEventListener(
            "click",
            function() {

                changeQuantity(
                    item,
                    1
                );

            }
        );


        quantityRow.appendChild(
            minusButton
        );

        quantityRow.appendChild(
            quantity
        );

        quantityRow.appendChild(
            plusButton
        );


        div.appendChild(
            itemName
        );

        div.appendChild(
            itemPrice
        );

        div.appendChild(
            quantityRow
        );


        container.appendChild(
            div
        );

    });


    if (itemCount === 0) {

        container.innerHTML =
            `<div class="menu-loading">
                No items available.
            </div>`;

    }

}


/*
==================================================
CREATE COMBO MENU
==================================================
*/

function createComboMenu() {

    const container =
        document.getElementById(
            "combosMenu"
        );


    container.innerHTML = "";


    Object.keys(combos).forEach(combo => {

        comboQuantities[combo] = 0;


        const div =
            document.createElement("div");


        div.className =
            "item";


        const itemName =
            document.createElement("div");

        itemName.className =
            "item-name";

        itemName.textContent =
            combo;


        const label =
            document.createElement("span");

        label.className =
            "combo-label";

        label.textContent =
            "COMBO";


        const itemPrice =
            document.createElement("div");

        itemPrice.className =
            "item-price";

        itemPrice.textContent =
            "₹" +
            combos[combo].price;


        const quantityRow =
            document.createElement("div");

        quantityRow.className =
            "quantity-row";


        const minusButton =
            document.createElement("button");

        minusButton.type =
            "button";

        minusButton.textContent =
            "−";


        const quantity =
            document.createElement("span");

        quantity.className =
            "quantity";

        quantity.id =
            "comboQty-" +
            combo.replace(
                /[^a-zA-Z0-9]/g,
                ""
            );

        quantity.textContent =
            "0";


        const plusButton =
            document.createElement("button");

        plusButton.type =
            "button";

        plusButton.textContent =
            "+";


        minusButton.addEventListener(
            "click",
            function() {

                changeComboQuantity(
                    combo,
                    -1
                );

            }
        );


        plusButton.addEventListener(
            "click",
            function() {

                changeComboQuantity(
                    combo,
                    1
                );

            }
        );


        quantityRow.appendChild(
            minusButton
        );

        quantityRow.appendChild(
            quantity
        );

        quantityRow.appendChild(
            plusButton
        );


        div.appendChild(
            itemName
        );

        div.appendChild(
            label
        );

        div.appendChild(
            itemPrice
        );

        div.appendChild(
            quantityRow
        );


        container.appendChild(
            div
        );

    });

}


/*
==================================================
NORMAL ITEM QUANTITY
==================================================
*/

function changeQuantity(item, change) {

    if (
        typeof quantities[item] !== "number"
    ) {

        quantities[item] = 0;

    }


    quantities[item] += change;


    if (
        quantities[item] < 0
    ) {

        quantities[item] = 0;

    }


    const id =
        "qty-" +
        item.replace(
            /[^a-zA-Z0-9]/g,
            ""
        );


    const element =
        document.getElementById(id);


    if (element) {

        element.textContent =
            quantities[item];

    }


    updateCart();

}


/*
==================================================
COMBO QUANTITY
==================================================
*/

function changeComboQuantity(
    combo,
    change
) {

    comboQuantities[combo] +=
        change;


    if (
        comboQuantities[combo] < 0
    ) {

        comboQuantities[combo] = 0;

    }


    const id =
        "comboQty-" +
        combo.replace(
            /[^a-zA-Z0-9]/g,
            ""
        );


    const element =
        document.getElementById(id);


    if (element) {

        element.textContent =
            comboQuantities[combo];

    }


    updateCart();

}


/*
==================================================
UPDATE CART
==================================================
*/

function updateCart() {

    const cart =
        document.getElementById(
            "cart"
        );


    let total = 0;

    let html = "";

    let hasItems = false;


    /*
    NORMAL ITEMS
    */

    Object.keys(menu).forEach(item => {

        const qty =
            quantities[item];


        if (qty > 0) {

            hasItems = true;


            const amount =
                menu[item].price *
                qty;


            total += amount;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "cart-row";


            const left =
                document.createElement(
                    "div"
                );

            left.className =
                "cart-left";

            left.textContent =
                item +
                " × " +
                qty;


            const right =
                document.createElement(
                    "div"
                );

            right.className =
                "cart-right";

            right.textContent =
                "₹" +
                amount;


            row.appendChild(left);

            row.appendChild(right);


            cart.innerHTML = "";

            /*
            The actual cart is rebuilt below.
            */

        }

    });


    /*
    Build cart safely.
    */

    const cartFragment =
        document.createDocumentFragment();


    /*
    NORMAL ITEMS
    */

    Object.keys(menu).forEach(item => {

        const qty =
            quantities[item];


        if (qty > 0) {

            hasItems = true;


            const amount =
                menu[item].price *
                qty;


            total += 0;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "cart-row";


            const left =
                document.createElement(
                    "div"
                );

            left.className =
                "cart-left";

            left.textContent =
                item +
                " × " +
                qty;


            const right =
                document.createElement(
                    "div"
                );

            right.className =
                "cart-right";

            right.textContent =
                "₹" +
                amount;


            row.appendChild(left);

            row.appendChild(right);


            cartFragment.appendChild(
                row
            );

        }

    });


    /*
    COMBOS
    */

    Object.keys(combos).forEach(combo => {

        const qty =
            comboQuantities[combo];


        if (qty > 0) {

            hasItems = true;


            const amount =
                combos[combo].price *
                qty;


            total += amount;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "cart-row";


            const left =
                document.createElement(
                    "div"
                );

            left.className =
                "cart-left";

            left.textContent =
                combo +
                " × " +
                qty;


            const right =
                document.createElement(
                    "div"
                );

            right.className =
                "cart-right";

            right.textContent =
                "₹" +
                amount;


            row.appendChild(left);

            row.appendChild(right);


            cartFragment.appendChild(
                row
            );

        }

    });


    cart.innerHTML = "";


    if (!hasItems) {

        cart.textContent =
            "No items selected.";

    } else {

        cart.appendChild(
            cartFragment
        );

    }


    document.getElementById(
        "total"
    ).textContent =
        total;

}


/*
==================================================
LOAD SAVED CUSTOMER NUMBERS
==================================================
*/

async function loadSavedCustomers() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from("loyalty_customers")

                .select(
                    "phone, name"
                )

                .not(
                    "phone",
                    "is",
                    null
                )

                .order(
                    "name",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                "Could not load saved customer numbers:",
                error
            );

            return;

        }


        savedCustomers =
            data || [];


        const datalist =
            document.getElementById(
                "savedCustomerPhones"
            );


        datalist.innerHTML =
            "";


        savedCustomers.forEach(
            customer => {

                if (!customer.phone) {
                    return;
                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    customer.phone;


                if (customer.name) {

                    option.label =
                        customer.name;

                }


                datalist.appendChild(
                    option
                );

            }
        );

    } catch (error) {

        console.error(
            "Saved customer loading failed:",
            error
        );

    }

}


/*
==================================================
FIND SAVED CUSTOMER BY PHONE
==================================================
*/

function normalizePhone(phone) {

    let digits =
        String(phone || "")
            .replace(
                /\D/g,
                ""
            );


    if (
        digits.length === 12 &&
        digits.startsWith("91")
    ) {

        digits =
            digits.substring(2);

    }


    return digits;

}


function findSavedCustomer() {

    const phoneInput =
        document.getElementById(
            "customerPhone"
        );


    const nameInput =
        document.getElementById(
            "customerName"
        );


    if (
        !phoneInput ||
        !nameInput
    ) {

        return;

    }


    const phone =
        normalizePhone(
            phoneInput.value
        );


    if (!phone) {
        return;
    }


    const customer =
        savedCustomers.find(
            item => {

                const savedPhone =
                    normalizePhone(
                        item.phone
                    );


                return (
                    savedPhone ===
                    phone
                );

            }
        );


    if (
        customer &&
        customer.name
    ) {

        nameInput.value =
            customer.name;

    }

}


document
    .getElementById(
        "customerPhone"
    )
    .addEventListener(
        "input",
        findSavedCustomer
    );


document
    .getElementById(
        "customerPhone"
    )
    .addEventListener(
        "change",
        findSavedCustomer
    );


/*
==================================================
PLACE ORDER
==================================================
*/

async function placeOrder() {

    const button =
        document.getElementById(
            "placeOrder"
        );


    const printButton =
        document.getElementById(
            "printBill"
        );


    const message =
        document.getElementById(
            "message"
        );


    const customerName =
        document.getElementById(
            "customerName"
        )
        .value
        .trim();


    const customerPhone =
        document.getElementById(
            "customerPhone"
        )
        .value
        .trim();


    const selectedItems = [];

    let total = 0;


    /*
    NORMAL ITEMS
    */

    Object.keys(menu).forEach(item => {

        const qty =
            quantities[item];


        if (qty > 0) {

            const amount =
                menu[item].price *
                qty;


            selectedItems.push({

                name:
                    item,

                price:
                    menu[item].price,

                quantity:
                    qty,

                counter:
                    menu[item].counter,

                type:
                    "single"

            });


            total += amount;

        }

    });


    /*
    COMBOS
    */

    Object.keys(combos).forEach(combo => {

        const qty =
            comboQuantities[combo];


        if (qty > 0) {

            const amount =
                combos[combo].price *
                qty;


            selectedItems.push({

                name:
                    combo,

                price:
                    combos[combo].price,

                quantity:
                    qty,

                type:
                    "combo",

                components:
                    combos[combo].items

            });


            total += amount;

        }

    });


    /*
    CHECK ORDER
    */

    if (
        selectedItems.length === 0
    ) {

        message.className =
            "error";

        message.textContent =
            "Please select at least one item.";

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "PLACING ORDER...";


    printButton.style.display =
        "none";


    message.textContent =
        "";


    try {


        /*
        ==================================
        CREATE MAIN ORDER
        ==================================
        */

        const {
            data: order,
            error: orderError
        } =
            await supabaseClient

                .from("orders")

                .insert({

                    customer_name:
                        customerName ||
                        null,

                    customer_phone:
                        customerPhone ||
                        null,

                    items:
                        selectedItems,

                    total:
                        total,

                    payment_method:
                        selectedPayment,

                    status:
                        "Pending"

                })

                .select()

                .single();


        if (orderError) {

            throw orderError;

        }


        /*
        ==================================
        CREATE COUNTER ITEM GROUPS
        ==================================
        */

        const counterItems = {

            chaats: [],

            drinks: [],

            burgers: []

        };


        /*
        SPLIT NORMAL ITEMS
        */

        selectedItems.forEach(item => {

            if (
                item.type ===
                "single"
            ) {

                if (
                    counterItems[
                        item.counter
                    ]
                ) {

                    counterItems[
                        item.counter
                    ].push({

                        name:
                            item.name,

                        quantity:
                            item.quantity

                    });

                }

            }

        });


        /*
        SPLIT COMBOS
        */

        selectedItems.forEach(item => {

            if (
                item.type === "combo" &&
                item.components
            ) {

                item.components.forEach(
                    component => {

                        if (
                            counterItems[
                                component.counter
                            ]
                        ) {

                            counterItems[
                                component.counter
                            ].push({

                                name:
                                    component.name,

                                quantity:
                                    item.quantity

                            });

                        }

                    }
                );

            }

        });


        /*
        ==================================
        CREATE KOT ROWS
        ==================================
        */

        const kotRows = [];


        Object.keys(
            counterItems
        ).forEach(counter => {

            if (
                counterItems[
                    counter
                ].length > 0
            ) {

                kotRows.push({

                    order_id:
                        order.id,

                    counter:
                        counter,

                    items:
                        counterItems[
                            counter
                        ],

                    status:
                        "Pending"

                });

            }

        });


        /*
        ==================================
        INSERT KOTS
        ==================================
        */

        if (
            kotRows.length > 0
        ) {

            const {
                error: kotError
            } =
                await supabaseClient

                    .from(
                        "counter_kot"
                    )

                    .insert(
                        kotRows
                    );


            if (kotError) {

                throw kotError;

            }

        }


        /*
        ==================================
        SAVE CUSTOMER LOYALTY DATA
        ==================================
        */

        if (
            customerPhone ||
            customerName
        ) {

            try {

                let customer = null;


                const {
                    data:
                        existingCustomer,
                    error:
                        customerFindError
                } =
                    customerPhone

                        ? await supabaseClient

                            .from(
                                "loyalty_customers"
                            )

                            .select("*")

                            .eq(
                                "phone",
                                customerPhone
                            )

                            .maybeSingle()

                        : {
                            data: null,
                            error: null
                        };


                if (
                    customerFindError
                ) {

                    console.error(
                        "Loyalty customer lookup failed:",
                        customerFindError
                    );

                }


                if (
                    existingCustomer
                ) {

                    customer =
                        existingCustomer;


                    if (
                        customerName &&
                        existingCustomer.name !==
                            customerName
                    ) {

                        const {
                            data:
                                updatedCustomer,
                            error:
                                updateError
                        } =
                            await supabaseClient

                                .from(
                                    "loyalty_customers"
                                )

                                .update({

                                    name:
                                        customerName,

                                    updated_at:
                                        new Date()
                                            .toISOString()

                                })

                                .eq(
                                    "id",
                                    existingCustomer.id
                                )

                                .select()
                                .single();


                        if (
                            !updateError
                        ) {

                            customer =
                                updatedCustomer;

                        }

                    }

                } else {

                    const {
                        data:
                            newCustomer,
                        error:
                            createError
                    } =
                        await supabaseClient

                            .from(
                                "loyalty_customers"
                            )

                            .insert({

                                phone:
                                    customerPhone ||
                                    null,

                                name:
                                    customerName ||
                                    null

                            })

                            .select()
                            .single();


                    if (
                        !createError
                    ) {

                        customer =
                            newCustomer;

                    } else {

                        console.error(
                            "Loyalty customer creation failed:",
                            createError
                        );

                    }

                }


                if (customer) {

                    const {
                        error:
                            loyaltyError
                    } =
                        await supabaseClient

                            .from(
                                "loyalty_transactions"
                            )

                            .insert({

                                customer_id:
                                    customer.id,

                                order_id:
                                    order.id,

                                type:
                                    "purchase",

                                points:
                                    0,

                                amount:
                                    total,

                                description:
                                    JSON.stringify(
                                        selectedItems
                                    ),

                                created_at:
                                    new Date()
                                        .toISOString()

                            });


                    if (
                        loyaltyError
                    ) {

                        console.error(
                            "Loyalty transaction save failed:",
                            loyaltyError
                        );

                    }

                }

            } catch (
                loyaltyError
            ) {

                console.error(
                    "Loyalty connection failed:",
                    loyaltyError
                );

            }

        }


        /*
        ==================================
        SAVE FOR PRINTING
        ==================================
        */

        lastOrder = {

            orderNumber:
                order.order_number,

            customerName:
                customerName,

            customerPhone:
                customerPhone,

            paymentMethod:
                selectedPayment,

            items:
                selectedItems,

            total:
                total

        };


        prepareReceipt(
            lastOrder
        );


        message.className =
            "success";


        message.textContent =
            "Order #" +
            order.order_number +
            " sent to counters.";


        button.style.display =
            "none";


        printButton.style.display =
            "block";


    } catch (error) {

        console.error(
            error
        );


        message.className =
            "error";


        message.textContent =
            "Order failed. Please try again.";


        button.disabled =
            false;


        button.textContent =
            "PLACE ORDER";

    }

}


/*
==================================================
PREPARE RECEIPT
==================================================
*/

function prepareReceipt(order) {

    document.getElementById(
        "receiptOrderNumber"
    ).textContent =
        order.orderNumber;


    const now =
        new Date();


    document.getElementById(
        "receiptDate"
    ).textContent =
        now.toLocaleString();


    const customerRow =
        document.getElementById(
            "receiptCustomerRow"
        );


    if (
        order.customerName
    ) {

        document.getElementById(
            "receiptCustomer"
        ).textContent =
            order.customerName;


        customerRow.style.display =
            "block";

    } else {

        customerRow.style.display =
            "none";

    }


    document.getElementById(
        "receiptPayment"
    ).textContent =
        order.paymentMethod ||
        "Cash";


    const receiptItems =
        document.getElementById(
            "receiptItems"
        );


    receiptItems.innerHTML =
        "";


    order.items.forEach(item => {

        const amount =
            item.price *
            item.quantity;


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "receipt-item";


        const line =
            document.createElement(
                "div"
            );

        line.className =
            "receipt-item-line";


        const name =
            document.createElement(
                "span"
            );

        name.className =
            "receipt-item-name";

        name.textContent =
            item.name;


        const price =
            document.createElement(
                "span"
            );

        price.className =
            "receipt-item-price";

        price.textContent =
            "₹" + amount;


        line.appendChild(
            name
        );

        line.appendChild(
            price
        );


        const qty =
            document.createElement(
                "div"
            );

        qty.className =
            "receipt-qty";

        qty.textContent =
            item.quantity +
            " × ₹" +
            item.price;


        row.appendChild(
            line
        );

        row.appendChild(
            qty
        );


        receiptItems.appendChild(
            row
        );

    });


    document.getElementById(
        "receiptTotal"
    ).textContent =
        order.total;

}


/*
==================================================
PRINT
==================================================
*/

function printBill() {

    if (!lastOrder) {

        return;

    }


    prepareReceipt(
        lastOrder
    );


    setTimeout(
        () => {

            window.print();

        },
        200
    );

}

AFTER PRINT
==================================================
*/

window.onafterprint =
    function() {

        setTimeout(
            () => {

                window.location.reload();

            },
            500
        );

    };
