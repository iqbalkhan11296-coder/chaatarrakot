<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cafe Billing</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js?v=4"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f4f4;

            color: #222;

        }


        header {

            background: #4b001f;

            color: white;

            padding: 18px;

            text-align: center;

        }


        header h1 {

            margin: 0;

            font-size: 28px;

        }


        header p {

            margin: 5px 0 0;

            font-size: 14px;

        }


        .container {

            max-width: 1000px;

            margin: auto;

            padding: 15px;

        }


        .section {

            background: white;

            margin-bottom: 15px;

            padding: 15px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);

        }


        .section h2 {

            margin-top: 0;

            color: #4b001f;

            border-bottom: 2px solid #eee;

            padding-bottom: 8px;

        }


        .menu-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 10px;

        }


        .item {

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 12px;

            background: #fff;

        }


        .item-name {

            font-weight: bold;

            font-size: 17px;

        }


        .item-description {

            font-size: 13px;

            color: #777;

            margin-top: 4px;

        }


        .item-price {

            color: #4b001f;

            font-weight: bold;

            margin-top: 5px;

        }


        .combo-label {

            display: inline-block;

            margin-top: 5px;

            padding: 3px 7px;

            border-radius: 4px;

            background: #4b001f;

            color: white;

            font-size: 11px;

            font-weight: bold;

        }


        .quantity-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 10px;

        }


        .quantity-row button {

            width: 35px;

            height: 35px;

            border: none;

            border-radius: 6px;

            background: #4b001f;

            color: white;

            font-size: 20px;

            cursor: pointer;

        }


        .quantity {

            font-size: 18px;

            font-weight: bold;

            min-width: 30px;

            text-align: center;

        }


        .customer-box input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;

            margin-bottom: 8px;

        }


        .cart {

            margin-top: 10px;

        }


        .cart-row {

            display: flex;

            justify-content: space-between;

            padding: 8px 0;

            border-bottom: 1px solid #eee;

            gap: 10px;

        }


        .cart-left {

            flex: 1;

        }


        .cart-right {

            white-space: nowrap;

            font-weight: bold;

        }


        .total {

            text-align: right;

            font-size: 24px;

            font-weight: bold;

            color: #4b001f;

            margin-top: 15px;

        }


        /* PAYMENT */


        .payment-title {

            margin-top: 18px;

            margin-bottom: 8px;

            font-weight: bold;

            color: #4b001f;

        }


        .payment-options {

            display: flex;

            gap: 10px;

            margin-top: 8px;

        }


        .payment-btn {

            flex: 1;

            padding: 14px;

            border: 2px solid #4b001f;

            border-radius: 8px;

            background: white;

            color: #4b001f;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        .payment-btn.selected {

            background: #4b001f;

            color: white;

        }


        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 15px;

        }


        .buttons button {

            flex: 1;

            padding: 16px;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        #placeOrder {

            background: #4b001f;

            color: white;

        }


        #printBill {

            background: #222;

            color: white;

            display: none;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #message {

            text-align: center;

            font-weight: bold;

            margin-top: 15px;

            min-height: 24px;

        }


        .success {

            color: green;

        }


        .error {

            color: red;

        }


        #receipt {

            display: none;

        }


        /* PRINT */


        @media print {

            @page {

                size: 58mm auto;

                margin: 0;

            }


            body {

                margin: 0;

                padding: 0;

                background: white;

            }


            body * {

                visibility: hidden;

            }


            #receipt,
            #receipt * {

                visibility: visible;

            }


            #receipt {

                display: block;

                position: absolute;

                left: 0;

                top: 0;

                width: 58mm;

                padding: 3mm;

                font-family:
                    "Courier New",
                    monospace;

                font-size: 11px;

                line-height: 1.3;

                color: black;

            }


            .receipt-header {

                text-align: center;

            }


            .receipt-title {

                font-size: 18px;

                font-weight: bold;

            }


            .receipt-subtitle {

                font-size: 10px;

            }


            .receipt-line {

                border-top:
                    1px dashed black;

                margin: 5px 0;

            }


            .receipt-info {

                font-size: 10px;

            }


            .receipt-item {

                margin: 5px 0;

            }


            .receipt-item-line {

                display: flex;

                justify-content:
                    space-between;

                gap: 5px;

            }


            .receipt-item-name {

                width: 36mm;

                word-wrap: break-word;

            }


            .receipt-item-price {

                width: 13mm;

                text-align: right;

                white-space: nowrap;

            }


            .receipt-qty {

                font-size: 10px;

            }


            .receipt-payment {

                display: flex;

                justify-content:
                    space-between;

                font-size: 11px;

                font-weight: bold;

            }


            .receipt-total {

                display: flex;

                justify-content:
                    space-between;

                font-size: 14px;

                font-weight: bold;

            }


            .receipt-footer {

                text-align: center;

                margin-top: 8px;

                font-size: 10px;

            }

        }


        @media (max-width: 600px) {

            .payment-options {

                flex-direction: row;

            }


            .payment-btn {

                font-size: 15px;

                padding: 13px 8px;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>Cafe Billing</h1>

    <p>Main Billing Counter</p>

</header>


<div class="container">


    <!-- CUSTOMER -->

    <div class="section">

        <h2>Customer</h2>

        <div class="customer-box">

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
            >

            <input
                type="tel"
                id="customerPhone"
                list="savedCustomerPhones"
                placeholder="Customer Phone Number"
                autocomplete="off"
            >

            <datalist
                id="savedCustomerPhones"
            ></datalist>

        </div>

    </div>


    <!-- CHAATS -->

    <div class="section">

        <h2>Chaats</h2>

        <div
            class="menu-grid"
            id="chaatsMenu"
        ></div>

    </div>


    <!-- DRINKS -->

    <div class="section">

        <h2>Drinks</h2>

        <div
            class="menu-grid"
            id="drinksMenu"
        ></div>

    </div>


    <!-- BURGERS -->

    <div class="section">

        <h2>Burgers</h2>

        <div
            class="menu-grid"
            id="burgersMenu"
        ></div>

    </div>


    <!-- COMBOS -->

    <div class="section">

        <h2>Combos</h2>

        <div
            class="menu-grid"
            id="combosMenu"
        ></div>

    </div>


    <!-- ORDER -->

    <div class="section">

        <h2>Order</h2>

        <div
            id="cart"
            class="cart"
        >
            No items selected.
        </div>


        <div class="total">

            Total:
            ₹<span id="total">0</span>

        </div>


        <!-- PAYMENT -->

        <div class="payment-title">

            Payment Method

        </div>


        <div class="payment-options">

            <button
                type="button"
                class="payment-btn selected"
                id="cashPayment"
                onclick="selectPayment('Cash')"
            >
                CASH
            </button>


            <button
                type="button"
                class="payment-btn"
                id="upiPayment"
                onclick="selectPayment('UPI')"
            >
                UPI
            </button>

        </div>


        <div class="buttons">

            <button
                id="placeOrder"
                onclick="placeOrder()"
            >
                PLACE ORDER
            </button>


            <button
                id="printBill"
                onclick="printBill()"
            >
                PRINT BILL
            </button>

        </div>


        <div id="message"></div>

    </div>

</div>


<!-- ========================= -->
<!-- 58MM THERMAL RECEIPT -->
<!-- ========================= -->

<div id="receipt">

    <div class="receipt-header">

        <div class="receipt-title">

            CHAATARRA

        </div>


        <div class="receipt-subtitle">

            The House of Chaats

        </div>

    </div>


    <div class="receipt-line"></div>


    <div class="receipt-info">

        <div>

            Order No:
            <span id="receiptOrderNumber"></span>

        </div>


        <div>

            Date:
            <span id="receiptDate"></span>

        </div>


        <div id="receiptCustomerRow">

            Customer:
            <span id="receiptCustomer"></span>

        </div>


        <div>

            Payment:
            <span id="receiptPayment"></span>

        </div>

    </div>


    <div class="receipt-line"></div>


    <div id="receiptItems"></div>


    <div class="receipt-line"></div>


    <div class="receipt-total">

        <span>TOTAL</span>

        <span>

            ₹<span id="receiptTotal"></span>

        </span>

    </div>


    <div class="receipt-line"></div>


    <div class="receipt-footer">

        Thank you!

        <br>

        Please visit again.

    </div>

</div>


<script>


/*
==================================================
MENU DATA
==================================================
*/

let menuItems = [];

let comboItems = [];


/*
==================================================
QUANTITIES
==================================================
*/

const quantities = {};

const comboQuantities = {};


let lastOrder = null;

let selectedPayment = "Cash";


/*
==================================================
LOCAL LOYALTY DATABASE
==================================================

Database:

    ChaatarraLoyaltyDB

Stores:

    customers
    transactions

This is completely separate from:

    orders
    counter_kot

Those Supabase tables remain unchanged.
*/

const LOYALTY_DB_NAME =
    "ChaatarraLoyaltyDB";

const LOYALTY_CUSTOMERS_STORE =
    "customers";

const LOYALTY_TRANSACTIONS_STORE =
    "transactions";

let loyaltyDB = null;


/*
==================================================
OPEN LOCAL LOYALTY DATABASE
==================================================
*/

function openLoyaltyDatabase() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    LOYALTY_DB_NAME
                );


            request.onupgradeneeded =
                function(event) {

                    const database =
                        event.target.result;


                    /*
                    ==========================
                    CUSTOMERS
                    ==========================
                    */

                    if (
                        !database.objectStoreNames
                            .contains(
                                LOYALTY_CUSTOMERS_STORE
                            )
                    ) {

                        const customerStore =
                            database.createObjectStore(
                                LOYALTY_CUSTOMERS_STORE,
                                {
                                    keyPath: "id"
                                }
                            );


                        customerStore.createIndex(
                            "phone",
                            "phone",
                            {
                                unique: false
                            }
                        );

                    }


                    /*
                    ==========================
                    TRANSACTIONS
                    ==========================
                    */

                    if (
                        !database.objectStoreNames
                            .contains(
                                LOYALTY_TRANSACTIONS_STORE
                            )
                    ) {

                        const transactionStore =
                            database.createObjectStore(
                                LOYALTY_TRANSACTIONS_STORE,
                                {
                                    keyPath: "id"
                                }
                            );


                        transactionStore.createIndex(
                            "customerId",
                            "customerId",
                            {
                                unique: false
                            }
                        );


                        transactionStore.createIndex(
                            "createdAt",
                            "createdAt",
                            {
                                unique: false
                            }
                        );

                    }

                };


            request.onsuccess =
                function(event) {

                    loyaltyDB =
                        event.target.result;


                    loyaltyDB.onversionchange =
                        function() {

                            loyaltyDB.close();

                        };


                    resolve(
                        loyaltyDB
                    );

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/*
==================================================
NORMALIZE PHONE
==================================================
*/

function normalizePhone(phone) {

    let digits =
        String(phone || "")
            .replace(
                /\D/g,
                ""
            );


    if (
        digits.length === 12 &&
        digits.startsWith("91")
    ) {

        digits =
            digits.substring(2);

    }


    return digits;

}


/*
==================================================
GET ALL LOYALTY CUSTOMERS
==================================================
*/

function getLoyaltyCustomers() {

    return new Promise(
        (resolve, reject) => {

            if (!loyaltyDB) {

                reject(
                    new Error(
                        "Loyalty database not open"
                    )
                );

                return;

            }


            const transaction =
                loyaltyDB.transaction(
                    LOYALTY_CUSTOMERS_STORE,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    LOYALTY_CUSTOMERS_STORE
                );


            const request =
                store.getAll();


            request.onsuccess =
                function() {

                    resolve(
                        request.result || []
                    );

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/*
==================================================
GET CUSTOMER BY PHONE
==================================================
*/

function getCustomerByPhone(phone) {

    return new Promise(
        (resolve, reject) => {

            if (!loyaltyDB) {

                reject(
                    new Error(
                        "Loyalty database not open"
                    )
                );

                return;

            }


            const normalizedPhone =
                normalizePhone(phone);


            if (!normalizedPhone) {

                resolve(null);

                return;

            }


            const transaction =
                loyaltyDB.transaction(
                    LOYALTY_CUSTOMERS_STORE,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    LOYALTY_CUSTOMERS_STORE
                );


            const request =
                store.getAll();


            request.onsuccess =
                function() {

                    const customers =
                        request.result || [];


                    const customer =
                        customers.find(
                            item =>
                                normalizePhone(
                                    item.phone
                                ) ===
                                normalizedPhone
                        );


                    resolve(
                        customer || null
                    );

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/*
==================================================
SAVE LOYALTY CUSTOMER
==================================================
*/

function saveLoyaltyCustomer(
    customer
) {

    return new Promise(
        (resolve, reject) => {

            if (!loyaltyDB) {

                reject(
                    new Error(
                        "Loyalty database not open"
                    )
                );

                return;

            }


            const transaction =
                loyaltyDB.transaction(
                    LOYALTY_CUSTOMERS_STORE,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    LOYALTY_CUSTOMERS_STORE
                );


            const request =
                store.put(
                    customer
                );


            request.onsuccess =
                function() {

                    resolve(
                        customer
                    );

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/*
==================================================
SAVE LOYALTY TRANSACTION
==================================================
*/

function saveLoyaltyTransaction(
    transactionData
) {

    return new Promise(
        (resolve, reject) => {

            if (!loyaltyDB) {

                reject(
                    new Error(
                        "Loyalty database not open"
                    )
                );

                return;

            }


            const transaction =
                loyaltyDB.transaction(
                    LOYALTY_TRANSACTIONS_STORE,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    LOYALTY_TRANSACTIONS_STORE
                );


            const request =
                store.put(
                    transactionData
                );


            request.onsuccess =
                function() {

                    resolve(
                        transactionData
                    );

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/*
==================================================
LOAD SAVED CUSTOMER NUMBERS
==================================================
*/

async function loadSavedCustomers() {

    try {

        if (!loyaltyDB) {

            await openLoyaltyDatabase();

        }


        const data =
            await getLoyaltyCustomers();


        const savedCustomers =
            data || [];


        savedCustomers.sort(
            (a, b) =>
                String(
                    a.name || ""
                )
                .localeCompare(
                    String(
                        b.name || ""
                    )
                )
        );


        const datalist =
            document.getElementById(
                "savedCustomerPhones"
            );


        datalist.innerHTML = "";


        savedCustomers.forEach(
            customer => {

                if (!customer.phone) {

                    return;

                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    customer.phone;


                if (customer.name) {

                    option.label =
                        customer.name;

                }


                datalist.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        console.error(
            "Saved customer loading failed:",
            error
        );

    }

}


/*
==================================================
FIND SAVED CUSTOMER
==================================================
*/

async function findSavedCustomer() {

    const phoneInput =
        document.getElementById(
            "customerPhone"
        );


    const nameInput =
        document.getElementById(
            "customerName"
        );


    if (
        !phoneInput ||
        !nameInput
    ) {

        return;

    }


    const phone =
        normalizePhone(
            phoneInput.value
        );


    if (!phone) {

        return;

    }


    try {

        const customer =
            await getCustomerByPhone(
                phone
            );


        if (
            customer &&
            customer.name
        ) {

            nameInput.value =
                customer.name;

        }

    } catch (error) {

        console.error(
            "Customer lookup failed:",
            error
        );

    }

}


document
    .getElementById(
        "customerPhone"
    )
    .addEventListener(
        "input",
        findSavedCustomer
    );


document
    .getElementById(
        "customerPhone"
    )
    .addEventListener(
        "change",
        findSavedCustomer
    );


/*
==================================================
PAYMENT SELECTION
==================================================
*/

function selectPayment(method) {

    selectedPayment = method;


    const cashButton =
        document.getElementById(
            "cashPayment"
        );


    const upiButton =
        document.getElementById(
            "upiPayment"
        );


    cashButton.classList.remove(
        "selected"
    );


    upiButton.classList.remove(
        "selected"
    );


    if (method === "Cash") {

        cashButton.classList.add(
            "selected"
        );

    }


    if (method === "UPI") {

        upiButton.classList.add(
            "selected"
        );

    }

}


/*
==================================================
LOAD MENU FROM SUPABASE
==================================================
*/

async function loadBillingMenu() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from("billing_menu")

                .select(`
                    id,
                    name,
                    price,
                    category,
                    counter,
                    item_type,
                    description,
                    active,
                    sort_order
                `)

                .eq(
                    "active",
                    true
                )

                .order(
                    "sort_order",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                "Billing menu loading failed:",
                error
            );


            showMenuError(
                "Could not load menu. Please refresh."
            );


            return;

        }


        menuItems = (data || [])
            .filter(item =>
                item.item_type === "single"
            );


        comboItems = (data || [])
            .filter(item =>
                item.item_type === "combo"
            );


        Object.keys(
            quantities
        ).forEach(key => {

            delete quantities[key];

        });


        Object.keys(
            comboQuantities
        ).forEach(key => {

            delete comboQuantities[key];

        });


        createMenu(
            "chaatsMenu",
            "chaats"
        );


        createMenu(
            "drinksMenu",
            "drinks"
        );


        createMenu(
            "burgersMenu",
            "burgers"
        );


        createComboMenu();


        updateCart();


    } catch (error) {

        console.error(
            "Menu loading error:",
            error
        );


        showMenuError(
            "Could not load menu. Please refresh."
        );

    }

}


/*
==================================================
MENU ERROR
==================================================
*/

function showMenuError(message) {

    const containers = [

        "chaatsMenu",
        "drinksMenu",
        "burgersMenu",
        "combosMenu"

    ];


    containers.forEach(id => {

        const element =
            document.getElementById(id);


        if (element) {

            element.innerHTML = `

                <div
                    style="
                        color:red;
                        font-weight:bold;
                        padding:15px;
                    "
                >
                    ${message}
                </div>

            `;

        }

    });

}


/*
==================================================
CREATE NORMAL MENU
==================================================
*/

function createMenu(
    containerId,
    counter
) {

    const container =
        document.getElementById(
            containerId
        );


    container.innerHTML = "";


    const items =
        menuItems.filter(
            item =>
                item.counter === counter
        );


    if (items.length === 0) {

        container.innerHTML = `

            <div
                style="
                    color:#777;
                    padding:10px;
                "
            >
                No items available.
            </div>

        `;


        return;

    }


    items.forEach(
        item => {

            quantities[item.id] =
                0;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "item";


            const safeId =
                String(item.id)
                    .replace(
                        /[^a-zA-Z0-9]/g,
                        ""
                    );


            div.innerHTML = `

                <div class="item-name">

                    ${escapeHtml(
                        item.name
                    )}

                </div>

                ${
                    item.description
                        ? `
                            <div
                                class="item-description"
                            >
                                ${escapeHtml(
                                    item.description
                                )}
                            </div>
                          `
                        : ""
                }

                <div class="item-price">

                    ₹${Number(
                        item.price
                    )}

                </div>


                <div class="quantity-row">

                    <button
                        onclick="changeQuantity(
                            '${escapeJs(item.id)}',
                            -1
                        )"
                    >
                        −
                    </button>


                    <span
                        class="quantity"
                        id="qty-${safeId}"
                    >
                        0
                    </span>


                    <button
                        onclick="changeQuantity(
                            '${escapeJs(item.id)}',
                            1
                        )"
                    >
                        +
                    </button>

                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}

CREATE COMBO MENU

/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/*
==================================================
ESCAPE JAVASCRIPT
==================================================
*/

function escapeJs(value) {

    return String(
        value ?? ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/*
==================================================
NORMAL ITEM QUANTITY
==================================================
*/

function changeQuantity(
    itemId,
    change
) {

    if (
        quantities[itemId] === undefined
    ) {

        quantities[itemId] =
            0;

    }


    quantities[itemId] +=
        change;


    if (
        quantities[itemId] < 0
    ) {

        quantities[itemId] =
            0;

    }


    const id =
        "qty-" +
        String(itemId)
            .replace(
                /[^a-zA-Z0-9]/g,
                ""
            );


    const element =
        document.getElementById(
            id
        );


    if (element) {

        element.textContent =
            quantities[itemId];

    }


    updateCart();

}


/*
==================================================
COMBO QUANTITY
==================================================
*/

function changeComboQuantity(
    comboId,
    change
) {

    if (
        comboQuantities[
            comboId
        ] === undefined
    ) {

        comboQuantities[
            comboId
        ] = 0;

    }


    comboQuantities[
        comboId
    ] += change;


    if (
        comboQuantities[
            comboId
        ] < 0
    ) {

        comboQuantities[
            comboId
        ] = 0;

    }


    const id =
        "comboQty-" +
        String(comboId)
            .replace(
                /[^a-zA-Z0-9]/g,
                ""
            );


    const element =
        document.getElementById(
            id
        );


    if (element) {

        element.textContent =
            comboQuantities[
                comboId
            ];

    }


    updateCart();

}


/*
==================================================
UPDATE CART
==================================================
*/

function updateCart() {

    const cart =
        document.getElementById(
            "cart"
        );


    let total = 0;

    let html = "";

    let hasItems = false;


    menuItems.forEach(
        item => {

            const qty =
                quantities[item.id] ||
                0;


            if (qty > 0) {

                hasItems = true;


                const amount =
                    Number(
                        item.price
                    ) * qty;


                total += amount;


                html += `

                    <div class="cart-row">

                        <div class="cart-left">

                            ${escapeHtml(
                                item.name
                            )}

                            × ${qty}

                        </div>


                        <div class="cart-right">

                            ₹${amount}

                        </div>

                    </div>

                `;

            }

        }
    );


    comboItems.forEach(
        combo => {

            const qty =
                comboQuantities[
                    combo.id
                ] || 0;


            if (qty > 0) {

                hasItems = true;


                const amount =
                    Number(
                        combo.price
                    ) * qty;


                total += amount;


                html += `

                    <div class="cart-row">

                        <div class="cart-left">

                            ${escapeHtml(
                                combo.name
                            )}

                            × ${qty}

                        </div>


                        <div class="cart-right">

                            ₹${amount}

                        </div>

                    </div>

                `;

            }

        }
    );


    if (!hasItems) {

        cart.innerHTML =
            "No items selected.";

    } else {

        cart.innerHTML =
            html;

    }


    document.getElementById(
        "total"
    ).textContent =
        total;

}


/*
==================================================
FIND COMBO COMPONENTS
==================================================
*/

function getComboComponents(
    combo
) {

    const components = [];


    const parts =
        String(
            combo.name || ""
        )
        .split("+")
        .map(
            part =>
                part.trim()
        )
        .filter(
            part =>
                part.length > 0
        );


    parts.forEach(
        part => {

            const matchingItem =
                menuItems.find(
                    item =>
                        String(
                            item.name
                        )
                        .trim()
                        .toLowerCase() ===
                        part.toLowerCase()
                );


            if (matchingItem) {

                components.push({

                    name:
                        matchingItem.name,

                    counter:
                        matchingItem.counter

                });

            }

        }
    );


    return components;

}


/*
==================================================
SAVE LOYALTY DATA TO INDEXEDDB
==================================================

This is the ONLY loyalty write.

No Supabase loyalty tables are used.

The order itself is still saved to:

    Supabase orders

and KOT is still saved to:

    Supabase counter_kot
==================================================
*/

async function saveOrderToLocalLoyalty(
    order,
    customerName,
    customerPhone,
    selectedItems,
    total
) {

    /*
    No customer information entered.
    Nothing to save.
    */

    if (
        !customerName &&
        !customerPhone
    ) {

        return;

    }


    try {

        if (!loyaltyDB) {

            await openLoyaltyDatabase();

        }


        let customer =
            null;


        /*
        ======================================
        FIND CUSTOMER BY PHONE
        ======================================
        */

        if (customerPhone) {

            customer =
                await getCustomerByPhone(
                    customerPhone
                );

        }


        /*
        ======================================
        IF CUSTOMER DOES NOT EXIST
        ======================================
        */

        if (!customer) {

            customer = {

                id:
                    crypto.randomUUID(),

                name:
                    customerName ||
                    "Customer",

                phone:
                    customerPhone ||
                    null

            };

        } else {

            /*
            Update name if the customer
            entered a new name.
            */

            if (
                customerName &&
                customer.name !==
                    customerName
            ) {

                customer.name =
                    customerName;

            }


            /*
            Keep latest phone formatting.
            */

            if (
                customerPhone
            ) {

                customer.phone =
                    customerPhone;

            }

        }


        /*
        ======================================
        SAVE CUSTOMER
        ======================================
        */

        await saveLoyaltyCustomer(
            customer
        );


        /*
        ======================================
        SAVE TRANSACTION
        ======================================
        */

        const transactionData = {

            id:
                crypto.randomUUID(),

            customerId:
                customer.id,

            amount:
                Number(total),

            items:
                selectedItems,

            createdAt:
                new Date().toISOString()

        };


        await saveLoyaltyTransaction(
            transactionData
        );


        console.log(
            "Loyalty saved locally:",
            {
                customer,
                transaction:
                    transactionData
            }
        );


    } catch (error) {

        /*
        Loyalty failure must NOT
        cancel a successful restaurant order.

        The main order and KOT have already
        been saved to Supabase.
        */

        console.error(
            "Local loyalty save failed:",
            error
        );

    }

}


/*
==================================================
PLACE ORDER
==================================================
*/

async function placeOrder() {

    const button =
        document.getElementById(
            "placeOrder"
        );


    const printButton =
        document.getElementById(
            "printBill"
        );


    const message =
        document.getElementById(
            "message"
        );


    const customerName =
        document.getElementById(
            "customerName"
        )
        .value
        .trim();


    const customerPhone =
        document.getElementById(
            "customerPhone"
        )
        .value
        .trim();


    const selectedItems = [];

    let total = 0;


    /*
    ==========================================
    NORMAL ITEMS
    ==========================================
    */

    menuItems.forEach(
        item => {

            const qty =
                quantities[item.id] ||
                0;


            if (qty > 0) {

                const amount =
                    Number(
                        item.price
                    ) * qty;


                selectedItems.push({

                    name:
                        item.name,

                    price:
                        Number(
                            item.price
                        ),

                    quantity:
                        qty,

                    counter:
                        item.counter,

                    type:
                        "single"

                });


                total += amount;

            }

        }
    );


    /*
    ==========================================
    COMBOS
    ==========================================
    */

    comboItems.forEach(
        combo => {

            const qty =
                comboQuantities[
                    combo.id
                ] || 0;


            if (qty > 0) {

                const amount =
                    Number(
                        combo.price
                    ) * qty;


                const components =
                    getComboComponents(
                        combo
                    );


                selectedItems.push({

                    name:
                        combo.name,

                    price:
                        Number(
                            combo.price
                        ),

                    quantity:
                        qty,

                    type:
                        "combo",

                    counter:
                        combo.counter,

                    components:
                        components

                });


                total += amount;

            }

        }
    );


    /*
    ==========================================
    CHECK ORDER
    ==========================================
    */

    if (
        selectedItems.length === 0
    ) {

        message.className =
            "error";


        message.textContent =
            "Please select at least one item.";


        return;

    }


    button.disabled =
        true;


    button.textContent =
        "PLACING ORDER...";


    printButton.style.display =
        "none";


    message.textContent =
        "";


    try {

        /*
        ======================================
        CREATE MAIN ORDER
        ======================================
        */

        const {
            data: order,
            error: orderError
        } =
            await supabaseClient

                .from("orders")

                .insert({

                    customer_name:
                        customerName ||
                        null,

                    customer_phone:
                        customerPhone ||
                        null,

                    items:
                        selectedItems,

                    total:
                        total,

                    payment_method:
                        selectedPayment,

                    status:
                        "Pending"

                })

                .select()

                .single();


        if (orderError) {

            throw orderError;

        }


        /*
        ======================================
        CREATE COUNTER ITEM GROUPS
        ======================================
        */

        const counterItems = {

            chaats: [],

            drinks: [],

            burgers: []

        };


        /*
        ======================================
        NORMAL ITEMS
        ======================================
        */

        selectedItems.forEach(
            item => {

                if (
                    item.type ===
                    "single"
                ) {

                    if (
                        counterItems[
                            item.counter
                        ]
                    ) {

                        counterItems[
                            item.counter
                        ].push({

                            name:
                                item.name,

                            quantity:
                                item.quantity

                        });

                    }

                }

            }
        );


        /*
        ======================================
        COMBOS
        ======================================
        */

        selectedItems.forEach(
            item => {

                if (
                    item.type ===
                        "combo" &&
                    item.components &&
                    item.components.length >
                        0
                ) {

                    item.components.forEach(
                        component => {

                            if (
                                counterItems[
                                    component.counter
                                ]
                            ) {

                                counterItems[
                                    component.counter
                                ].push({

                                    name:
                                        component.name,

                                    quantity:
                                        item.quantity

                                });

                            }

                        }
                    );


                } else if (
                    item.type ===
                        "combo"
                ) {

                    /*
                    FALLBACK
                    */

                    if (
                        item.counter &&
                        counterItems[
                            item.counter
                        ]
                    ) {

                        counterItems[
                            item.counter
                        ].push({

                            name:
                                item.name,

                            quantity:
                                item.quantity

                        });

                    }

                }

            }
        );


        /*
        ======================================
        CREATE KOT ROWS
        ======================================
        */

        const kotRows = [];


        Object.keys(
            counterItems
        ).forEach(
            counter => {

                if (
                    counterItems[
                        counter
                    ].length > 0
                ) {

                    kotRows.push({

                        order_id:
                            order.id,

                        counter:
                            counter,

                        items:
                            counterItems[
                                counter
                            ],

                        status:
                            "Pending"

                    });

                }

            }
        );


        /*
        ======================================
        INSERT KOTS
        ======================================
        */

        if (
            kotRows.length > 0
        ) {

            const {
                error: kotError
            } =
                await supabaseClient

                    .from(
                        "counter_kot"
                    )

                    .insert(
                        kotRows
                    );


            if (kotError) {

                throw kotError;

            }

        }


        /*
        ======================================
        LOCAL LOYALTY
        ======================================

        IMPORTANT:

        The old Supabase loyalty code has
        been removed.

        Loyalty is now stored locally in:

            ChaatarraLoyaltyDB

        Stores:

            customers
            transactions
        ======================================
        */

        await saveOrderToLocalLoyalty(

            order,

            customerName,

            customerPhone,

            selectedItems,

            total

        );


        /*
        ======================================
        SAVE FOR PRINTING
        ======================================
        */

        lastOrder = {

            orderNumber:
                order.order_number,

            customerName:
                customerName,

            customerPhone:
                customerPhone,

            paymentMethod:
                selectedPayment,

            items:
                selectedItems,

            total:
                total

        };


        prepareReceipt(
            lastOrder
        );


        message.className =
            "success";


        message.textContent =
            "Order #" +
            order.order_number +
            " sent to counters.";


        button.style.display =
            "none";


        printButton.style.display =
            "block";


    } catch (error) {

        console.error(
            error
        );


        message.className =
            "error";


        message.textContent =
            "Order failed. Please try again.";


        button.disabled =
            false;


        button.textContent =
            "PLACE ORDER";

    }

}


/*
==================================================
PREPARE RECEIPT
==================================================
*/

function prepareReceipt(
    order
) {

    document.getElementById(
        "receiptOrderNumber"
    ).textContent =
        order.orderNumber;


    const now =
        new Date();


    document.getElementById(
        "receiptDate"
    ).textContent =
        now.toLocaleString();


    const customerRow =
        document.getElementById(
            "receiptCustomerRow"
        );


    if (
        order.customerName
    ) {

        document.getElementById(
            "receiptCustomer"
        ).textContent =
            order.customerName;


        customerRow.style.display =
            "block";

    } else {

        customerRow.style.display =
            "none";

    }


    document.getElementById(
        "receiptPayment"
    ).textContent =
        order.paymentMethod ||
        "Cash";


    const receiptItems =
        document.getElementById(
            "receiptItems"
        );


    receiptItems.innerHTML =
        "";


    order.items.forEach(
        item => {

            const amount =
                item.price *
                item.quantity;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "receipt-item";


            row.innerHTML = `

                <div
                    class="receipt-item-line"
                >

                    <span
                        class="receipt-item-name"
                    >

                        ${escapeHtml(
                            item.name
                        )}

                    </span>


                    <span
                        class="receipt-item-price"
                    >

                        ₹${amount}

                    </span>

                </div>


                <div
                    class="receipt-qty"
                >

                    ${item.quantity}
                    × ₹${item.price}

                </div>

            `;


            receiptItems.appendChild(
                row
            );

        }
    );


    document.getElementById(
        "receiptTotal"
    ).textContent =
        order.total;

}


/*
==================================================
PRINT
==================================================
*/

function printBill() {

    if (!lastOrder) {

        return;

    }


    prepareReceipt(
        lastOrder
    );


    setTimeout(
        () => {

            window.print();

        },
        200
    );

}

AFTER PRINT
==================================================
*/

window.onafterprint =

        );
