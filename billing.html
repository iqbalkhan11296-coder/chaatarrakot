<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Billing</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=4"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #4b001f;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 15px;
        }

        .section {
            background: white;
            margin-bottom: 15px;

            border-radius: 10px;

        }

        .section h2 {
            margin-top: 0;
            color: #4b001f;
            border-bottom: 2px solid #eee;

        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .item {
            border: 1px solid #ddd;

            padding: 12px;

        }

        .item-name {
            font-weight: bold;
            font-size: 17px;
        }

        .item-price {
            color: #4b001f;
            font-weight: bold;

        }

        .combo-label {
            display: inline-block;
            margin-top: 5px;

        .quantity-row {
            display: flex;

            margin-top: 10px;
        }

        .quantity-row button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 6px;
            background: #4b001f;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity {
            font-size: 18px;

            min-width: 30px;

            width: 100%;

        .cart {
            margin-top: 10px;

        .cart-row {
            display: flex;

        .total {

        @media print {

            #receipt {

                position: absolute;

                font-family: "Courier New", monospace;

            .receipt-header {
                text-align: center;
            }

            .receipt-title {
                font-size: 18px;

            .receipt-subtitle {
                font-size: 10px;
            }

            .receipt-line {
                border-top: 1px dashed black;
                margin: 5px 0;
            }

            .receipt-info {
                font-size: 10px;
            }

            .receipt-item {
                margin: 5px 0;
            }

            .receipt-item-line {
                display: flex;

            .receipt-item-name {
                width: 36mm;

            }

            .receipt-item-price {
                width: 13mm;
                text-align: right;

            }

            }

            .receipt-total {

                justify-content: space-between;

            }

            .receipt-footer {
                text-align: center;
                margin-top: 8px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Cafe Billing</h1>
    <p>Main Billing Counter</p>
</header>

<div class="container">

    <!-- CUSTOMER -->

    <div class="section">

        <h2>Customer</h2>

        <div class="customer-box">

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
            >

        </div>

    </div>


    <!-- CHAATS -->

    <div class="section">

        <h2>Chaats</h2>

        <div
            class="menu-grid"
            id="chaatsMenu"
        ></div>

    </div>


    <!-- DRINKS -->

    <div class="section">

        <h2>Drinks</h2>

        <div
            class="menu-grid"
            id="drinksMenu"
        ></div>

    </div>


    <!-- BURGERS -->

    <div class="section">

        <h2>Burgers</h2>

        <div
            class="menu-grid"
            id="burgersMenu"
        ></div>

    </div>


    <!-- COMBOS -->

    <div class="section">

        <h2>Combos</h2>

        <div
            class="menu-grid"
            id="combosMenu"
        ></div>

    </div>


    <!-- ORDER -->

    <div class="section">

        <h2>Order</h2>

        <div
            id="cart"
            class="cart"
        >
            No items selected.
        </div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <div class="buttons">

            <button
                id="placeOrder"
                onclick="placeOrder()"
            >
                PLACE ORDER
            </button>

            <button
                id="printBill"
                onclick="printBill()"
            >
                PRINT BILL
            </button>

        </div>

        <div id="message"></div>

    </div>

</div>


<!-- ========================= -->
<!-- 58MM THERMAL RECEIPT -->
<!-- ========================= -->

<div id="receipt">

    <div class="receipt-header">

        <div class="receipt-title">
            CHAATARRA
        </div>

        <div class="receipt-subtitle">
            The House of Chaats
        </div>

    </div>

    <div class="receipt-line"></div>

    <div class="receipt-info">

        <div>
            Order No:
            <span id="receiptOrderNumber"></span>
        </div>

        <div>
            Date:
            <span id="receiptDate"></span>
        </div>

        <div id="receiptCustomerRow">

            Customer:
            <span id="receiptCustomer"></span>

        </div>

    </div>

    <div class="receipt-line"></div>

    <div id="receiptItems"></div>

    <div class="receipt-line"></div>

    <div class="receipt-total">

        <span>TOTAL</span>

        <span>
            ₹<span id="receiptTotal"></span>
        </span>

    </div>

    <div class="receipt-line"></div>

    <div class="receipt-footer">

        Thank you!

        <br>

        Please visit again.

    </div>

</div>


<script>

    /*
    ==========================================
    NORMAL MENU ITEMS
    ==========================================
    */

    const menu = {

        // CHAATS

        "Pani Puri": {
            price: 50,
            counter: "chaats"
        },

        "Masala Puri": {
            price: 60,
            counter: "chaats"
        },

        "Samosa Chaat": {
            price: 80,
            counter: "chaats"
        },

        "Dahi Puri": {
            price: 80,
            counter: "chaats"
        },


        // DRINKS

        "Mango Shake": {
            price: 90,
            counter: "drinks"
        },

        "Oreo Shake": {
            price: 80,
            counter: "drinks"
        },

        "Strawberry Shake": {
            price: 90,
            counter: "drinks"
        },

        "Mint Lime": {
            price: 35,
            counter: "drinks"
        },


        // BURGERS

        "Classic Burger": {
            price: 120,
            counter: "burgers"
        },

        "Chicken Burger": {
            price: 150,
            counter: "burgers"
        },

        "Cheese Burger": {
            price: 140,
            counter: "burgers"
        },

        "Double Burger": {
            price: 180,
            counter: "burgers"
        }

    };


    /*
    ==========================================
    DUMMY COMBOS
    ==========================================
    */

    const combos = {

        "Pani Puri + Mint Lime": {

            price: 80,

            items: [

                {
                    name: "Pani Puri",
                    counter: "chaats"
                },

                {
                    name: "Mint Lime",
                    counter: "drinks"
                }

            ]

        },


        "Masala Puri + Mango Shake": {

            price: 140,

            items: [

                {
                    name: "Masala Puri",
                    counter: "chaats"
                },

                {
                    name: "Mango Shake",
                    counter: "drinks"
                }

            ]

        },


        "Classic Burger + Mango Shake": {

            price: 190,

            items: [

                {
                    name: "Classic Burger",
                    counter: "burgers"
                },

                {
                    name: "Mango Shake",
                    counter: "drinks"
                }

            ]

        },


        "Chicken Burger + Oreo Shake": {

            price: 210,

            items: [

                {
                    name: "Chicken Burger",
                    counter: "burgers"
                },

                {
                    name: "Oreo Shake",
                    counter: "drinks"
                }

            ]

        }

    };


    /*
    ==========================================
    QUANTITIES
    ==========================================
    */

    const quantities = {};

    const comboQuantities = {};

    let lastOrder = null;


    /*
    ==========================================
    CREATE NORMAL MENU
    ==========================================
    */

    function createMenu(containerId, counter) {

        const container =
            document.getElementById(containerId);

        container.innerHTML = "";


        Object.keys(menu).forEach(item => {

            if (menu[item].counter !== counter) {
                return;
            }


            quantities[item] = 0;


            const div =
                document.createElement("div");

            div.className = "item";


            div.innerHTML = `

                <div class="item-name">
                    ${item}
                </div>

                <div class="item-price">
                    ₹${menu[item].price}
                </div>

                <div class="quantity-row">

                    <button
                        onclick="changeQuantity('${item}', -1)"
                    >
                        −
                    </button>

                    <span
                        class="quantity"
                        id="qty-${item.replace(/[^a-zA-Z0-9]/g, '')}"
                    >
                        0
                    </span>

                    <button
                        onclick="changeQuantity('${item}', 1)"
                    >
                        +
                    </button>

                </div>

            `;


            container.appendChild(div);

        });

    }


    /*
    ==========================================
    CREATE COMBO MENU
    ==========================================
    */

    function createComboMenu() {

        const container =
            document.getElementById("combosMenu");

        container.innerHTML = "";


        Object.keys(combos).forEach(combo => {

            comboQuantities[combo] = 0;


            const div =
                document.createElement("div");

            div.className = "item";


            div.innerHTML = `

                <div class="item-name">
                    ${combo}
                </div>

                <span class="combo-label">
                    COMBO
                </span>

                <div class="item-price">
                    ₹${combos[combo].price}
                </div>

                <div class="quantity-row">

                    <button
                        onclick="changeComboQuantity('${combo}', -1)"
                    >
                        −
                    </button>

                    <span
                        class="quantity"
                        id="comboQty-${combo.replace(/[^a-zA-Z0-9]/g, '')}"
                    >
                        0
                    </span>

                    <button
                        onclick="changeComboQuantity('${combo}', 1)"
                    >
                        +
                    </button>

                </div>

            `;


            container.appendChild(div);

        });

    }


    createMenu(
        "chaatsMenu",
        "chaats"
    );

    createMenu(
        "drinksMenu",
        "drinks"
    );

    createMenu(
        "burgersMenu",
        "burgers"
    );

    createComboMenu();


    /*
    ==========================================
    NORMAL ITEM QUANTITY
    ==========================================
    */

    function changeQuantity(item, change) {

        quantities[item] += change;


        if (quantities[item] < 0) {
            quantities[item] = 0;
        }


        const id =
            "qty-" +
            item.replace(/[^a-zA-Z0-9]/g, "");


        document.getElementById(id).textContent =
            quantities[item];


        updateCart();

    }


    /*
    ==========================================
    COMBO QUANTITY
    ==========================================
    */

    function changeComboQuantity(combo, change) {

        comboQuantities[combo] += change;


        if (comboQuantities[combo] < 0) {
            comboQuantities[combo] = 0;
        }


        const id =
            "comboQty-" +
            combo.replace(/[^a-zA-Z0-9]/g, "");


        document.getElementById(id).textContent =
            comboQuantities[combo];


        updateCart();

    }


    /*
    ==========================================
    UPDATE CART
    ==========================================
    */

    function updateCart() {

        const cart =
            document.getElementById("cart");

        let total = 0;

        let html = "";

        let hasItems = false;


        /*
        NORMAL ITEMS
        */

        Object.keys(menu).forEach(item => {

            const qty =
                quantities[item];


            if (qty > 0) {

                hasItems = true;


                const amount =
                    menu[item].price * qty;


                total += amount;


                html += `

                    <div class="cart-row">

                        <div class="cart-left">

                            ${item}
                            × ${qty}

                        </div>

                        <div class="cart-right">

                            ₹${amount}

                        </div>

                    </div>

                `;

            }

        });


        /*
        COMBOS
        */

        Object.keys(combos).forEach(combo => {

            const qty =
                comboQuantities[combo];


            if (qty > 0) {

                hasItems = true;


                const amount =
                    combos[combo].price * qty;


                total += amount;


                html += `

                    <div class="cart-row">

                        <div class="cart-left">

                            ${combo}
                            × ${qty}

                        </div>

                        <div class="cart-right">

                            ₹${amount}

                        </div>

                    </div>

                `;

            }

        });


        if (!hasItems) {

            cart.innerHTML =
                "No items selected.";

        } else {

            cart.innerHTML =
                html;

        }


        document.getElementById("total").textContent =
            total;

    }


    /*
    ==========================================
    PLACE ORDER
    ==========================================
    */

    async function placeOrder() {

        const button =
            document.getElementById("placeOrder");

        const printButton =
            document.getElementById("printBill");

        const message =
            document.getElementById("message");

        const customerName =
            document.getElementById("customerName")
                .value
                .trim();


        const selectedItems = [];

        let total = 0;


        /*
        ======================================
        NORMAL ITEMS
        ======================================
        */

        Object.keys(menu).forEach(item => {

            const qty =
                quantities[item];


            if (qty > 0) {

                const amount =
                    menu[item].price * qty;


                selectedItems.push({

                    name: item,

                    price: menu[item].price,

                    quantity: qty,

                    counter: menu[item].counter,

                    type: "single"

                });


                total += amount;

            }

        });


        /*
        ======================================
        COMBOS
        ======================================
        */

        Object.keys(combos).forEach(combo => {

            const qty =
                comboQuantities[combo];


            if (qty > 0) {

                const amount =
                    combos[combo].price * qty;


                selectedItems.push({

                    name: combo,

                    price: combos[combo].price,

                    quantity: qty,

                    type: "combo",

                    components:
                        combos[combo].items

                });


                total += amount;

            }

        });


        /*
        ======================================
        CHECK ORDER
        ======================================
        */

        if (selectedItems.length === 0) {

            message.className =
                "error";

            message.textContent =
                "Please select at least one item.";

            return;

        }


        button.disabled = true;

        button.textContent =
            "PLACING ORDER...";

        printButton.style.display =
            "none";

        message.textContent =
            "";


        try {

            /*
            ==================================
            CREATE MAIN ORDER
            ==================================
            */

            const { data: order, error: orderError } =
                await supabaseClient

                    .from("orders")

                    .insert({

                        customer_name:
                            customerName || null,

                        items:
                            selectedItems,

                        total:
                            total,

                        status:
                            "Pending"

                    })

                    .select()

                    .single();


            if (orderError) {
                throw orderError;
            }


            /*
            ==================================
            CREATE COUNTER ITEM GROUPS
            ==================================
            */

            const counterItems = {

                chaats: [],

                drinks: [],

                burgers: []

            };


            /*
            ==================================
            SPLIT NORMAL ITEMS
            ==================================
            */

            selectedItems.forEach(item => {

                if (item.type === "single") {

                    if (counterItems[item.counter]) {

                        counterItems[item.counter].push({

                            name:
                                item.name,

                            quantity:
                                item.quantity

                        });

                    }

                }

            });


            /*
            ==================================
            SPLIT COMBOS
            ==================================
            */

            selectedItems.forEach(item => {

                if (
                    item.type === "combo" &&
                    item.components
                ) {

                    item.components.forEach(component => {

                        if (
                            counterItems[
                                component.counter
                            ]
                        ) {

                            counterItems[
                                component.counter
                            ].push({

                                name:
                                    component.name,

                                quantity:
                                    item.quantity

                            });

                        }

                    });

                }

            });


            /*
            ==================================
            CREATE KOT ROWS
            ==================================
            */

            const kotRows = [];


            Object.keys(counterItems).forEach(counter => {

                if (
                    counterItems[counter].length > 0
                ) {

                    kotRows.push({

                        order_id:
                            order.id,

                        counter:
                            counter,

                        items:
                            counterItems[counter],

                        status:
                            "Pending"

                    });

                }

            });


            /*
            ==================================
            INSERT KOTS
            ==================================
            */

            if (kotRows.length > 0) {

                const { error: kotError } =
                    await supabaseClient

                        .from("counter_kot")

                        .insert(kotRows);


                if (kotError) {
                    throw kotError;
                }

            }


            /*
            ==================================
            SAVE FOR PRINTING
            ==================================
            */

            lastOrder = {

                orderNumber:
                    order.order_number,

                customerName:
                    customerName,

                items:
                    selectedItems,

                total:
                    total

            };


            prepareReceipt(lastOrder);


            message.className =
                "success";

            message.textContent =
                "Order #" +
                order.order_number +
                " sent to counters.";


            button.style.display =
                "none";

            printButton.style.display =
                "block";

        } catch (error) {

            console.error(error);

            message.className =
                "error";

            message.textContent =
                "Order failed. Please try again.";

            button.disabled = false;

            button.textContent =
                "PLACE ORDER";

        }

    }


    /*
    ==========================================
    PREPARE RECEIPT
    ==========================================
    */

    function prepareReceipt(order) {

        document.getElementById(
            "receiptOrderNumber"
        ).textContent =
            order.orderNumber;


        const now =
            new Date();


        document.getElementById(
            "receiptDate"
        ).textContent =
            now.toLocaleString();


        const customerRow =
            document.getElementById(
                "receiptCustomerRow"
            );


        if (order.customerName) {

            document.getElementById(
                "receiptCustomer"
            ).textContent =
                order.customerName;

            customerRow.style.display =
                "block";

        } else {

            customerRow.style.display =
                "none";

        }


        const receiptItems =
            document.getElementById(
                "receiptItems"
            );


        receiptItems.innerHTML =
            "";


        order.items.forEach(item => {

            const amount =
                item.price *
                item.quantity;


            const row =
                document.createElement("div");


            row.className =
                "receipt-item";


            row.innerHTML = `

                <div class="receipt-item-line">

                    <span class="receipt-item-name">

                        ${item.name}

                    </span>

                    <span class="receipt-item-price">

                        ₹${amount}

                    </span>

                </div>

                <div class="receipt-qty">

                    ${item.quantity}
                    × ₹${item.price}

                </div>

            `;


            receiptItems.appendChild(row);

        });


        document.getElementById(
            "receiptTotal"
        ).textContent =
            order.total;

    }


    /*
    ==========================================
    PRINT
    ==========================================
    */

    function printBill() {

        if (!lastOrder) {
            return;
        }


        prepareReceipt(lastOrder);


        setTimeout(() => {

            window.print();

        }, 200);

    }


    /*
    ==========================================
    AFTER PRINT
    ==========================================
    */

    window.onafterprint = function() {

        setTimeout(() => {

            window.location.reload();

        }, 500);

    };

</script>

</body>
</html>
