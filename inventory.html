<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Management</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f5f2ec;
        color: #202020;
        min-height: 100vh;
    }

    /* HEADER */
    header {
        background: #171717;
        color: white;
        padding: 28px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .shop-name {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    .heading {
        font-size: 17px;
        color: #d6d6d6;
        margin-top: 5px;
    }

    /* MAIN */
    main {
        max-width: 1400px;
        margin: auto;
        padding: 35px;
    }

    .dashboard-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        margin-bottom: 30px;
    }

    .dashboard-btn {
        border: none;
        background: white;
        border-radius: 16px;
        padding: 25px 20px;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 5px 22px rgba(0,0,0,0.07);
        transition: 0.25s ease;
        border: 1px solid #e5e1d9;
    }

    .dashboard-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 28px rgba(0,0,0,0.11);
    }

    .dashboard-btn .icon {
        font-size: 28px;
        margin-bottom: 12px;
    }

    .dashboard-btn h3 {
        font-size: 17px;
        margin-bottom: 5px;
    }

    .dashboard-btn p {
        font-size: 13px;
        color: #777;
    }

    /* CONTENT CARD */
    .content-card {
        background: white;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 6px 25px rgba(0,0,0,0.07);
        border: 1px solid #e5e1d9;
    }

    .content-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
        gap: 15px;
    }

    .content-header h2 {
        font-size: 24px;
    }

    .search {
        padding: 11px 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        width: 240px;
        outline: none;
    }

    /* TABLE */
    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
    }

    th {
        background: #f4f1eb;
        padding: 14px;
        text-align: left;
        font-size: 13px;
        color: #555;
        font-weight: 700;
    }

    td {
        padding: 15px 14px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }

    tr:hover td {
        background: #faf9f6;
    }

    /* STATUS */
    .status {
        display: inline-block;
        padding: 6px 11px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
    }

    .green {
        background: #e6f5e9;
        color: #21833a;
    }

    .orange {
        background: #fff0d5;
        color: #a96300;
    }

    .red {
        background: #ffe3e3;
        color: #bd2222;
    }

    /* BUTTONS */
    .btn {
        border: none;
        border-radius: 9px;
        padding: 9px 13px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        margin-right: 5px;
    }

    .btn-stock {
        background: #202020;
        color: white;
    }

    .btn-edit {
        background: #eeeae3;
        color: #222;
    }

    .btn-delete {
        background: #ffe3e3;
        color: #a51f1f;
    }

    .btn:hover {
        opacity: 0.82;
    }

    /* MODAL */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.48);
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 1000;
    }

    .modal-box {
        background: white;
        width: 100%;
        max-width: 600px;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal-box h2 {
        margin-bottom: 22px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        margin-bottom: 5px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 7px;
        color: #444;
    }

    input, select {
        width: 100%;
        padding: 12px;
        border: 1px solid #d8d5cf;
        border-radius: 9px;
        outline: none;
        font-size: 14px;
        background: #fff;
    }

    input:focus, select:focus {
        border-color: #777;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
    }

    .cancel-btn {
        background: #eee;
        color: #222;
    }

    .save-btn {
        background: #171717;
        color: white;
    }

    /* STOCK OUT */
    .current-stock {
        background: #f5f2ec;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-size: 14px;
    }

    .current-stock strong {
        font-size: 20px;
    }

    /* HISTORY */
    .history-in {
        color: #21833a;
        font-weight: 700;
    }

    .history-out {
        color: #bd2222;
        font-weight: 700;
    }

    .empty {
        text-align: center;
        padding: 50px 20px;
        color: #888;
    }

    /* MOBILE */
    @media (max-width: 900px) {
        .dashboard-buttons {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        header {
            padding: 22px;
        }

        main {
            padding: 20px;
        }

        .dashboard-buttons {
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .dashboard-btn {
            padding: 18px 14px;
        }

        .content-card {
            padding: 18px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: auto;
        }

        .content-header {
            align-items: flex-start;
            flex-direction: column;
        }

        .search {
            width: 100%;
        }
    }
</style>
</head>

<body>

<header>
    <div>
        <div class="shop-name">YOUR SHOP NAME</div>
        <div class="heading">Inventory Management</div>
    </div>
</header>

<main>

    <div class="dashboard-buttons">

        <button class="dashboard-btn" onclick="openAddInventory()">
            <div class="icon">➕</div>
            <h3>Add Inventory</h3>
            <p>Add and manage inventory items</p>
        </button>

        <button class="dashboard-btn" onclick="showInventory()">
            <div class="icon">📦</div>
            <h3>Inventory</h3>
            <p>View current stock</p>
        </button>

        <button class="dashboard-btn" onclick="showHistory()">
            <div class="icon">📜</div>
            <h3>History</h3>
            <p>View stock movements</p>
        </button>

        <button class="dashboard-btn" onclick="showLowStock()">
            <div class="icon">🔔</div>
            <h3>Low Stock</h3>
            <p>Items needing attention</p>
        </button>

    </div>

    <div class="content-card">

        <div class="content-header">
            <h2 id="sectionTitle">Inventory</h2>
            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="Search inventory..."
                oninput="renderCurrentSection()"
            >
        </div>

        <div id="content"></div>

    </div>

</main>


<!-- ADD / EDIT INVENTORY MODAL -->

<div class="modal" id="inventoryModal">

    <div class="modal-box">

        <h2 id="inventoryModalTitle">Add Inventory</h2>

        <form id="inventoryForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Item Name</label>
                    <input id="itemName" required>
                </div>

                <div class="form-group">
                    <label>Type</label>
                    <input id="itemType" placeholder="Vegetable, Dairy, etc." required>
                </div>

                <div class="form-group">
                    <label>Unit</label>
                    <select id="itemUnit" required>
                        <option value="">Select Unit</option>
                        <option>kg</option>
                        <option>g</option>
                        <option>litre</option>
                        <option>ml</option>
                        <option>piece</option>
                        <option>packet</option>
                        <option>box</option>
                        <option>dozen</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Vendor</label>
                    <input id="itemVendor" required>
                </div>

                <div class="form-group">
                    <label>Current Stock</label>
                    <input id="itemStock" type="number" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Alert Level</label>
                    <input id="itemAlert" type="number" min="0" step="0.01" required>
                </div>

            </div>

            <div class="modal-actions">
                <button type="button" class="btn cancel-btn" onclick="closeModal('inventoryModal')">
                    Cancel
                </button>

                <button type="submit" class="btn save-btn">
                    Save Item
                </button>
            </div>

        </form>

    </div>

</div>


<!-- STOCK OUT MODAL -->

<div class="modal" id="stockOutModal">

    <div class="modal-box">

        <h2>Stock Out</h2>

        <div class="current-stock">
            Item: <strong id="stockOutItemName"></strong><br>
            Current Stock:
            <strong id="stockOutCurrent"></strong>
        </div>

        <div class="form-group">
            <label>Quantity Used</label>
            <input id="stockOutQuantity" type="number" min="0.01" step="0.01">
        </div>

        <div class="form-group" style="margin-top:15px;">
            <label>Reason</label>
            <select id="stockOutReason">
                <option>Kitchen use</option>
                <option>Sold</option>
                <option>Damaged</option>
                <option>Expired</option>
                <option>Other</option>
            </select>
        </div>

        <div class="modal-actions">

            <button
                class="btn cancel-btn"
                onclick="closeModal('stockOutModal')">
                Cancel
            </button>

            <button
                class="btn save-btn"
                onclick="confirmStockOut()">
                Confirm Stock Out
            </button>

        </div>

    </div>

</div>


<script>

let inventory = JSON.parse(localStorage.getItem("inventoryData")) || [];
let history = JSON.parse(localStorage.getItem("inventoryHistory")) || [];

let editingId = null;
let stockOutId = null;
let currentSection = "inventory";


/* SAVE DATA */

function saveData() {
    localStorage.setItem("inventoryData", JSON.stringify(inventory));
    localStorage.setItem("inventoryHistory", JSON.stringify(history));
}


/* ADD INVENTORY */

function openAddInventory() {

    editingId = null;

    document.getElementById("inventoryModalTitle").textContent =
        "Add Inventory";

    document.getElementById("inventoryForm").reset();

    document.getElementById("inventoryModal").style.display = "flex";
}


/* EDIT INVENTORY */

function editInventory(id) {

    const item = inventory.find(i => i.id === id);

    if (!item) return;

    editingId = id;

    document.getElementById("inventoryModalTitle").textContent =
        "Edit Inventory";

    document.getElementById("itemName").value = item.name;
    document.getElementById("itemType").value = item.type;
    document.getElementById("itemUnit").value = item.unit;
    document.getElementById("itemVendor").value = item.vendor;
    document.getElementById("itemStock").value = item.stock;
    document.getElementById("itemAlert").value = item.alert;

    document.getElementById("inventoryModal").style.display = "flex";
}


/* SAVE INVENTORY */

document.getElementById("inventoryForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("itemName").value.trim();
    const type = document.getElementById("itemType").value.trim();
    const unit = document.getElementById("itemUnit").value;
    const vendor = document.getElementById("itemVendor").value.trim();
    const stock = Number(document.getElementById("itemStock").value);
    const alert = Number(document.getElementById("itemAlert").value);

    if (editingId) {

        const item = inventory.find(i => i.id === editingId);

        if (item) {
            item.name = name;
            item.type = type;
            item.unit = unit;
            item.vendor = vendor;
            item.stock = stock;
            item.alert = alert;
        }

    } else {

        const newItem = {
            id: Date.now(),
            name,
            type,
            unit,
            vendor,
            stock,
            alert
        };

        inventory.push(newItem);

        history.push({
            id: Date.now(),
            date: new Date().toLocaleString(),
            item: name,
            movement: "Stock In",
            quantity: stock,
            unit: unit,
            balance: stock,
            reason: "Initial stock"
        });

    }

    saveData();

    closeModal("inventoryModal");

    showInventory();
});


/* DELETE */

function deleteInventory(id) {

    const item = inventory.find(i => i.id === id);

    if (!item) return;

    if (!confirm(`Delete ${item.name}?`)) return;

    inventory = inventory.filter(i => i.id !== id);

    saveData();

    renderCurrentSection();
}


/* STOCK STATUS */

function getStatus(item) {

    if (item.stock <= 0) {
        return {
            text: "Out of Stock",
            class: "red"
        };
    }

    if (item.stock < item.alert) {
        return {
            text: "Low Stock",
            class: "red"
        };
    }

    if (item.stock === item.alert) {
        return {
            text: "Alert Level",
            class: "orange"
        };
    }

    return {
        text: "In Stock",
        class: "green"
    };
}


/* INVENTORY */

function showInventory() {

    currentSection = "inventory";

    document.getElementById("sectionTitle").textContent =
        "Inventory";

    renderInventory();
}


/* LOW STOCK */

function showLowStock() {

    currentSection = "lowstock";

    document.getElementById("sectionTitle").textContent =
        "Low Stock";

    renderLowStock();
}


/* HISTORY */

function showHistory() {

    currentSection = "history";

    document.getElementById("sectionTitle").textContent =
        "Stock History";

    renderHistory();
}


/* SEARCH */

function renderCurrentSection() {

    if (currentSection === "inventory") {
        renderInventory();
    }

    if (currentSection === "lowstock") {
        renderLowStock();
    }

    if (currentSection === "history") {
        renderHistory();
    }
}


/* INVENTORY TABLE */

function renderInventory() {

    const search =
        document.getElementById("searchInput").value.toLowerCase();

    const items = inventory.filter(item =>
        item.name.toLowerCase().includes(search) ||
        item.type.toLowerCase().includes(search) ||
        item.vendor.toLowerCase().includes(search)
    );

    if (items.length === 0) {

        document.getElementById("content").innerHTML = `
            <div class="empty">
                No inventory items found.
            </div>
        `;

        return;
    }

    let html = `
        <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Item</th>
                    <th>Type</th>
                    <th>Unit</th>
                    <th>Vendor</th>
                    <th>Current Stock</th>
                    <th>Alert Level</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
    `;

    items.forEach(item => {

        const status = getStatus(item);

        html += `
            <tr>

                <td><strong>${escapeHtml(item.name)}</strong></td>

                <td>${escapeHtml(item.type)}</td>

                <td>${escapeHtml(item.unit)}</td>

                <td>${escapeHtml(item.vendor)}</td>

                <td><strong>${item.stock} ${item.unit}</strong></td>

                <td>${item.alert} ${item.unit}</td>

                <td>
                    <span class="status ${status.class}">
                        ${status.text}
                    </span>
                </td>

                <td>

                    <button
                        class="btn btn-stock"
                        onclick="openStockOut(${item.id})">
                        Stock Out
                    </button>

                    <button
                        class="btn btn-edit"
                        onclick="editInventory(${item.id})">
                        Edit
                    </button>

                    <button
                        class="btn btn-delete"
                        onclick="deleteInventory(${item.id})">
                        Delete
                    </button>

                </td>

            </tr>
        `;
    });

    html += `
            </tbody>
        </table>

        </div>
    `;

    document.getElementById("content").innerHTML = html;
}


/* LOW STOCK TABLE */

function renderLowStock() {

    const items = inventory.filter(item =>
        item.stock <= item.alert
    );

    if (items.length === 0) {

        document.getElementById("content").innerHTML = `
            <div class="empty">
                🎉 No items are currently at the alert level.
            </div>
        `;

        return;
    }

    let html = `
        <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Item</th>
                    <th>Current Stock</th>
                    <th>Alert Level</th>
                    <th>Vendor</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
    `;

    items.forEach(item => {

        const status = getStatus(item);

        html += `
            <tr>

                <td><strong>${escapeHtml(item.name)}</strong></td>

                <td>${item.stock} ${item.unit}</td>

                <td>${item.alert} ${item.unit}</td>

                <td>${escapeHtml(item.vendor)}</td>

                <td>
                    <span class="status ${status.class}">
                        ${status.text}
                    </span>
                </td>

            </tr>
        `;
    });

    html += `
            </tbody>
        </table>

        </div>
    `;

    document.getElementById("content").innerHTML = html;
}


/* HISTORY TABLE */

function renderHistory() {

    const search =
        document.getElementById("searchInput").value.toLowerCase();

    const records = history
        .filter(record =>
            record.item.toLowerCase().includes(search) ||
            record.reason.toLowerCase().includes(search)
        )
        .reverse();

    if (records.length === 0) {

        document.getElementById("content").innerHTML = `
            <div class="empty">
                No stock history available.
            </div>
        `;

        return;
    }

    let html = `
        <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Item</th>
                    <th>Movement</th>
                    <th>Quantity</th>
                    <th>Balance</th>
                    <th>Reason</th>
                </tr>
            </thead>

            <tbody>
    `;

    records.forEach(record => {

        const movementClass =
            record.movement === "Stock Out"
            ? "history-out"
            : "history-in";

        const sign =
            record.movement === "Stock Out"
            ? "−"
            : "+";

        html += `
            <tr>

                <td>${escapeHtml(record.date)}</td>

                <td><strong>${escapeHtml(record.item)}</strong></td>

                <td class="${movementClass}">
                    ${record.movement}
                </td>

                <td class="${movementClass}">
                    ${sign}${record.quantity} ${record.unit}
                </td>

                <td>
                    <strong>
                        ${record.balance} ${record.unit}
                    </strong>
                </td>

                <td>${escapeHtml(record.reason)}</td>

            </tr>
        `;
    });

    html += `
            </tbody>
        </table>

        </div>
    `;

    document.getElementById("content").innerHTML = html;
}


/* STOCK OUT */

function openStockOut(id) {

    const item = inventory.find(i => i.id === id);

    if (!item) return;

    stockOutId = id;

    document.getElementById("stockOutItemName").textContent =
        item.name;

    document.getElementById("stockOutCurrent").textContent =
        `${item.stock} ${item.unit}`;

    document.getElementById("stockOutQuantity").value = "";

    document.getElementById("stockOutModal").style.display = "flex";
}


/* CONFIRM STOCK OUT */

function confirmStockOut() {

    const item = inventory.find(i => i.id === stockOutId);

    if (!item) return;

    const quantity =
        Number(document.getElementById("stockOutQuantity").value);

    const reason =
        document.getElementById("stockOutReason").value;

    if (!quantity || quantity <= 0) {

        alert("Please enter a valid quantity.");

        return;
    }

    if (quantity > item.stock) {

        alert("Stock Out quantity cannot be greater than current stock.");

        return;
    }

    item.stock =
        Number((item.stock - quantity).toFixed(2));

    history.push({

        id: Date.now(),

        date: new Date().toLocaleString(),

        item: item.name,

        movement: "Stock Out",

        quantity: quantity,

        unit: item.unit,

        balance: item.stock,

        reason: reason

    });

    saveData();

    closeModal("stockOutModal");

    showInventory();
}


/* CLOSE MODAL */

function closeModal(id) {

    document.getElementById(id).style.display = "none";
}


/* ESCAPE HTML */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* CLOSE MODAL WHEN CLICKING OUTSIDE */

window.addEventListener("click", function(e) {

    if (e.target.classList.contains("modal")) {
        e.target.style.display = "none";
    }

});


/* INITIAL LOAD */

showInventory();

</script>

</body>
</html>
```
