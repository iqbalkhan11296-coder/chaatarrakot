<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Management</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f2ec;
    color: #202020;
    min-height: 100vh;
}

header {
    background: #171717;
    color: white;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}

.shop-name {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
}

.heading {
    font-size: 17px;
    color: #d6d6d6;
    margin-top: 5px;
}

main {
    max-width: 1400px;
    margin: auto;
    padding: 35px;
}

.dashboard-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.dashboard-btn {
    border: none;
    background: white;
    border-radius: 16px;
    padding: 25px 20px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 5px 22px rgba(0,0,0,0.07);
    transition: 0.25s ease;
    border: 1px solid #e5e1d9;
}

.dashboard-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.11);
}

.dashboard-btn .icon {
    font-size: 28px;
    margin-bottom: 12px;
}

.dashboard-btn h3 {
    font-size: 17px;
    margin-bottom: 5px;
}

.dashboard-btn p {
    font-size: 13px;
    color: #777;
}

.content-card {
    background: white;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.07);
    border: 1px solid #e5e1d9;
}

.content-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    gap: 15px;
}

.content-header h2 {
    font-size: 24px;
}

.search {
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    width: 240px;
    outline: none;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1050px;
}

th {
    background: #f4f1eb;
    padding: 14px;
    text-align: left;
    font-size: 13px;
    color: #555;
    font-weight: 700;
}

td {
    padding: 15px 14px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

tr:hover td {
    background: #faf9f6;
}

.status {
    display: inline-block;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
}

.green {
    background: #e6f5e9;
    color: #21833a;
}

.orange {
    background: #fff0d5;
    color: #a96300;
}

.red {
    background: #ffe3e3;
    color: #bd2222;
}

.btn {
    border: none;
    border-radius: 9px;
    padding: 9px 13px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    margin-right: 5px;
    margin-bottom: 4px;
}

.btn-stock {
    background: #202020;
    color: white;
}

.btn-stock-in {
    background: #21833a;
    color: white;
}

.btn-edit {
    background: #eeeae3;
    color: #222;
}

.btn-delete {
    background: #ffe3e3;
    color: #a51f1f;
}

.btn-back {
    background: #eeeae3;
    color: #222;
    margin-bottom: 20px;
}

.btn-view {
    background: #171717;
    color: white;
}

.btn:hover {
    opacity: 0.82;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.48);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 600px;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    max-height: 90vh;
    overflow-y: auto;
}

.modal-box h2 {
    margin-bottom: 22px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.form-group {
    margin-bottom: 5px;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
    color: #444;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8d5cf;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
    background: #fff;
}

input:focus, select:focus {
    border-color: #777;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 25px;
}

.cancel-btn {
    background: #eee;
    color: #222;
}

.save-btn {
    background: #171717;
    color: white;
}

.current-stock {
    background: #f5f2ec;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 14px;
}

.current-stock strong {
    font-size: 20px;
}

.purchase-summary {
    background: #f5f2ec;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
}

.purchase-summary-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
}

.purchase-total {
    font-size: 19px;
    font-weight: 700;
    border-top: 1px solid #ddd;
    margin-top: 8px;
    padding-top: 10px;
}

.price-badge {
    display: inline-block;
    background: #f1eee7;
    padding: 6px 9px;
    border-radius: 7px;
    font-weight: 600;
}

.history-in {
    color: #21833a;
    font-weight: 700;
}

.history-out {
    color: #bd2222;
    font-weight: 700;
}

/* HISTORY ITEM CARDS */

.history-items {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.history-card {
    border: 1px solid #e5e1d9;
    border-radius: 15px;
    padding: 20px;
    background: #fff;
    transition: 0.25s ease;
}

.history-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.history-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.history-card h3 {
    font-size: 18px;
}

.history-icon {
    font-size: 25px;
}

.history-info {
    font-size: 13px;
    color: #777;
    line-height: 1.8;
}

.history-stock {
    font-size: 20px;
    font-weight: 700;
    color: #202020;
    margin: 5px 0;
}

.history-details {
    display: none;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #888;
}

@media (max-width: 1000px) {
    .history-items {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard-buttons {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {

    header {
        padding: 22px;
    }

    main {
        padding: 20px;
    }

    .dashboard-buttons {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .dashboard-btn {
        padding: 18px 14px;
    }

    .content-card {
        padding: 18px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .content-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .search {
        width: 100%;
    }

    .history-items {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <div class="shop-name">CHAATARRA</div>
        <div class="heading">Inventory Management</div>
    </div>
</header>

<main>

    <div class="dashboard-buttons">

        <button class="dashboard-btn" onclick="openAddInventory()">
            <div class="icon">➕</div>
            <h3>Add Inventory</h3>
            <p>Add and manage inventory items</p>
        </button>

        <button class="dashboard-btn" onclick="showInventory()">
            <div class="icon">📦</div>
            <h3>Inventory</h3>
            <p>View current stock</p>
        </button>

        <button class="dashboard-btn" onclick="showHistory()">
            <div class="icon">📜</div>
            <h3>History</h3>
            <p>View stock movements by item</p>
        </button>

        <button class="dashboard-btn" onclick="showLowStock()">
            <div class="icon">🔔</div>
            <h3>Low Stock</h3>
            <p>Items needing attention</p>
        </button>

    </div>

    <div class="content-card">

        <div class="content-header">
            <h2 id="sectionTitle">Inventory</h2>

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="Search..."
                oninput="renderCurrentSection()"
            >
        </div>

        <div id="content"></div>

    </div>

</main>


<!-- ADD / EDIT INVENTORY -->

<div class="modal" id="inventoryModal">

    <div class="modal-box">

        <h2 id="inventoryModalTitle">Add Inventory</h2>

        <form id="inventoryForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Item Name</label>
                    <input id="itemName" required>
                </div>

                <div class="form-group">
                    <label>Type</label>
                    <input id="itemType"
                           placeholder="Vegetable, Dairy, etc."
                           required>
                </div>

                <div class="form-group">
                    <label>Unit</label>

                    <select id="itemUnit" required>
                        <option value="">Select Unit</option>
                        <option>kg</option>
                        <option>g</option>
                        <option>litre</option>
                        <option>ml</option>
                        <option>piece</option>
                        <option>packet</option>
                        <option>box</option>
                        <option>dozen</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Vendor</label>
                    <input id="itemVendor" required>
                </div>

                <div class="form-group">
                    <label>Current Stock</label>
                    <input
                        id="itemStock"
                        type="number"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Purchase Price / Unit (₹)</label>
                    <input
                        id="itemPrice"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="Example: 40"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Alert Level</label>
                    <input
                        id="itemAlert"
                        type="number"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

            </div>

            <div class="purchase-summary">

                <div class="purchase-summary-row">
                    <span>Initial Quantity</span>
                    <strong id="initialQuantityDisplay">0</strong>
                </div>

                <div class="purchase-summary-row">
                    <span>Price / Unit</span>
                    <strong id="initialPriceDisplay">₹0.00</strong>
                </div>

                <div class="purchase-summary-row purchase-total">
                    <span>Total Purchase Cost</span>
                    <strong id="initialTotalDisplay">₹0.00</strong>
                </div>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn cancel-btn"
                    onclick="closeModal('inventoryModal')">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn save-btn">
                    Save Item
                </button>

            </div>

        </form>

    </div>

</div>


<!-- STOCK IN -->

<div class="modal" id="stockInModal">

    <div class="modal-box">

        <h2>Stock In / Purchase</h2>

        <div class="current-stock">

            Item:
            <strong id="stockInItemName"></strong>

            <br>

            Current Stock:
            <strong id="stockInCurrent"></strong>

            <br>

            Latest Purchase Price:
            <strong id="stockInLatestPrice"></strong>

        </div>

        <div class="form-group">

            <label>Quantity Purchased</label>

            <input
                id="stockInQuantity"
                type="number"
                min="0.01"
                step="0.01"
                oninput="calculatePurchaseTotal()"
            >

        </div>

        <div class="form-group" style="margin-top:15px;">

            <label>Purchase Price / Unit (₹)</label>

            <input
                id="stockInPrice"
                type="number"
                min="0"
                step="0.01"
                oninput="calculatePurchaseTotal()"
            >

        </div>

        <div class="form-group" style="margin-top:15px;">

            <label>Vendor</label>

            <input id="stockInVendor">

        </div>

        <div class="form-group" style="margin-top:15px;">

            <label>Reason</label>

            <select id="stockInReason">

                <option>Purchase</option>
                <option>Restock</option>
                <option>Return from supplier</option>
                <option>Other</option>

            </select>

        </div>

        <div class="purchase-summary">

            <div class="purchase-summary-row purchase-total">

                <span>Total Purchase Cost</span>

                <strong id="stockInTotal">
                    ₹0.00
                </strong>

            </div>

        </div>

        <div class="modal-actions">

            <button
                class="btn cancel-btn"
                onclick="closeModal('stockInModal')">
                Cancel
            </button>

            <button
                class="btn save-btn"
                onclick="confirmStockIn()">
                Confirm Stock In
            </button>

        </div>

    </div>

</div>


<!-- STOCK OUT -->

<div class="modal" id="stockOutModal">

    <div class="modal-box">

        <h2>Stock Out</h2>

        <div class="current-stock">

            Item:
            <strong id="stockOutItemName"></strong>

            <br>

            Current Stock:
            <strong id="stockOutCurrent"></strong>

        </div>

        <div class="form-group">

            <label>Quantity Used</label>

            <input
                id="stockOutQuantity"
                type="number"
                min="0.01"
                step="0.01"
            >

        </div>

        <div class="form-group" style="margin-top:15px;">

            <label>Reason</label>

            <select id="stockOutReason">

                <option>Kitchen use</option>
                <option>Sold</option>
                <option>Damaged</option>
                <option>Expired</option>
                <option>Other</option>

            </select>

        </div>

        <div class="modal-actions">

            <button
                class="btn cancel-btn"
                onclick="closeModal('stockOutModal')">
                Cancel
            </button>

            <button
                class="btn save-btn"
                onclick="confirmStockOut()">
                Confirm Stock Out
            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
/* =========================
   SUPABASE INVENTORY APP
========================= */

let inventory = [];
let history = [];

let editingId = null;
let stockOutId = null;
let stockInId = null;

let currentSection = "inventory";
let selectedHistoryItem = null;

let loadingData = false;

/* =========================
   LOAD DATA FROM SUPABASE
========================= */

async function loadData() {
    loadingData = true;

    try {
        const { data: items, error: itemError } = await supabaseClient
            .from("inventory_items")
            .select("*")
            .order("name", { ascending: true });

        if (itemError) throw itemError;

        const { data: records, error: historyError } = await supabaseClient
            .from("inventory_history")
            .select("*")
            .order("created_at", { ascending: true });

        if (historyError) throw historyError;

        inventory = (items || []).map(item => ({
            id: item.id,
            name: item.name,
            type: item.type,
            unit: item.unit,
            vendor: item.vendor || "",
            stock: Number(item.current_stock || 0),
            purchasePrice: Number(item.purchase_price || 0),
            alert: Number(item.alert_level || 0)
        }));

        history = (records || []).map(record => ({
            id: record.id,
            inventoryItemId: record.inventory_item_id,
            date: record.created_at,
            item: record.item_name || "",
            movement: record.movement,
            quantity: Number(record.quantity || 0),
            unit: record.unit || "",
            balance: Number(record.balance || 0),
            reason: record.reason || "",
            pricePerUnit: record.price_per_unit == null ? null : Number(record.price_per_unit),
            totalCost: record.total_cost == null ? null : Number(record.total_cost),
            vendor: record.vendor || ""
        }));

        renderCurrentSection();
    } catch (error) {
        console.error("Supabase load error:", error);
        document.getElementById("content").innerHTML = `
            <div class="empty">
                <strong>Unable to load inventory.</strong><br><br>
                ${escapeHtml(error.message || "Please check your Supabase connection.")}
            </div>
        `;
    } finally {
        loadingData = false;
    }
}

/* =========================
   ADD / EDIT INVENTORY
========================= */

function openAddInventory() {
    editingId = null;

    document.getElementById("inventoryModalTitle").textContent = "Add Inventory";
    document.getElementById("inventoryForm").reset();
    updateInitialPurchaseTotal();
    document.getElementById("inventoryModal").style.display = "flex";
}

function editInventory(id) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    editingId = id;

    document.getElementById("inventoryModalTitle").textContent = "Edit Inventory";
    document.getElementById("itemName").value = item.name;
    document.getElementById("itemType").value = item.type;
    document.getElementById("itemUnit").value = item.unit;
    document.getElementById("itemVendor").value = item.vendor;
    document.getElementById("itemStock").value = item.stock;
    document.getElementById("itemPrice").value = item.purchasePrice || 0;
    document.getElementById("itemAlert").value = item.alert;

    updateInitialPurchaseTotal();
    document.getElementById("inventoryModal").style.display = "flex";
}

function updateInitialPurchaseTotal() {
    const quantity = Number(document.getElementById("itemStock").value) || 0;
    const price = Number(document.getElementById("itemPrice").value) || 0;
    const total = quantity * price;

    document.getElementById("initialQuantityDisplay").textContent = quantity;
    document.getElementById("initialPriceDisplay").textContent = `₹${price.toFixed(2)}`;
    document.getElementById("initialTotalDisplay").textContent = `₹${total.toFixed(2)}`;
}

/* =========================
   SAVE INVENTORY
========================= */

document.getElementById("inventoryForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const name = document.getElementById("itemName").value.trim();
    const type = document.getElementById("itemType").value.trim();
    const unit = document.getElementById("itemUnit").value;
    const vendor = document.getElementById("itemVendor").value.trim();
    const stock = Number(document.getElementById("itemStock").value);
    const purchasePrice = Number(document.getElementById("itemPrice").value);
    const alertLevel = Number(document.getElementById("itemAlert").value);

    if (!name || !type || !unit || !vendor || stock < 0 || purchasePrice < 0 || alertLevel < 0) {
        alert("Please enter valid inventory details.");
        return;
    }

    const saveButton = document.querySelector("#inventoryForm .save-btn");
    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {
        if (editingId) {
            const { data, error } = await supabaseClient
                .from("inventory_items")
                .update({
                    name,
                    type,
                    unit,
                    vendor,
                    current_stock: stock,
                    purchase_price: purchasePrice,
                    alert_level: alertLevel
                })
                .eq("id", editingId)
                .select()
                .single();

            if (error) throw error;

            const item = inventory.find(i => i.id === editingId);
            if (item) {
                item.name = data.name;
                item.type = data.type;
                item.unit = data.unit;
                item.vendor = data.vendor || "";
                item.stock = Number(data.current_stock || 0);
                item.purchasePrice = Number(data.purchase_price || 0);
                item.alert = Number(data.alert_level || 0);
            }
        } else {
            const { data: newItem, error: insertError } = await supabaseClient
                .from("inventory_items")
                .insert({
                    name,
                    type,
                    unit,
                    vendor,
                    current_stock: stock,
                    purchase_price: purchasePrice,
                    alert_level: alertLevel
                })
                .select()
                .single();

            if (insertError) throw insertError;

            const { data: newHistory, error: historyError } = await supabaseClient
                .from("inventory_history")
                .insert({
                    inventory_item_id: newItem.id,
                    item_name: newItem.name,
                    movement: "Stock In",
                    quantity: stock,
                    unit,
                    balance: stock,
                    reason: "Initial stock",
                    price_per_unit: purchasePrice,
                    total_cost: Number((stock * purchasePrice).toFixed(2)),
                    vendor
                })
                .select()
                .single();

            if (historyError) {
                await supabaseClient.from("inventory_items").delete().eq("id", newItem.id);
                throw historyError;
            }

            inventory.push({
                id: newItem.id,
                name: newItem.name,
                type: newItem.type,
                unit: newItem.unit,
                vendor: newItem.vendor || "",
                stock: Number(newItem.current_stock || 0),
                purchasePrice: Number(newItem.purchase_price || 0),
                alert: Number(newItem.alert_level || 0)
            });

            history.push({
                id: newHistory.id,
                inventoryItemId: newHistory.inventory_item_id,
                date: newHistory.created_at,
                item: newHistory.item_name,
                movement: newHistory.movement,
                quantity: Number(newHistory.quantity),
                unit: newHistory.unit,
                balance: Number(newHistory.balance),
                reason: newHistory.reason || "",
                pricePerUnit: Number(newHistory.price_per_unit || 0),
                totalCost: Number(newHistory.total_cost || 0),
                vendor: newHistory.vendor || ""
            });
        }

        closeModal("inventoryModal");
        showInventory();
    } catch (error) {
        console.error("Save inventory error:", error);
        alert("Could not save inventory.\n\n" + (error.message || "Unknown error"));
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save Item";
    }
});

/* =========================
   DELETE
========================= */

async function deleteInventory(id) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    if (!confirm(`Delete ${item.name}?\n\nThis will also delete its stock history.`)) return;

    try {
        const { error } = await supabaseClient
            .from("inventory_items")
            .delete()
            .eq("id", id);

        if (error) throw error;

        inventory = inventory.filter(i => i.id !== id);
        history = history.filter(record => record.inventoryItemId !== id);

        if (selectedHistoryItem === id) selectedHistoryItem = null;
        renderCurrentSection();
    } catch (error) {
        console.error("Delete error:", error);
        alert("Could not delete item.\n\n" + (error.message || "Unknown error"));
    }
}

/* =========================
   STATUS
========================= */

function getStatus(item) {
    if (item.stock <= 0) {
        return { text: "Out of Stock", class: "red" };
    }

    if (item.stock < item.alert) {
        return { text: "Low Stock", class: "red" };
    }

    if (item.stock === item.alert) {
        return { text: "Alert Level", class: "orange" };
    }

    return { text: "In Stock", class: "green" };
}

/* =========================
   SECTIONS
========================= */

function showInventory() {
    currentSection = "inventory";
    selectedHistoryItem = null;
    document.getElementById("sectionTitle").textContent = "Inventory";
    renderInventory();
}

function showLowStock() {
    currentSection = "lowstock";
    selectedHistoryItem = null;
    document.getElementById("sectionTitle").textContent = "Low Stock";
    renderLowStock();
}

function showHistory() {
    currentSection = "history";
    selectedHistoryItem = null;
    document.getElementById("sectionTitle").textContent = "Stock History";
    renderHistoryItems();
}

function renderCurrentSection() {
    if (currentSection === "inventory") renderInventory();
    if (currentSection === "lowstock") renderLowStock();

    if (currentSection === "history") {
        if (selectedHistoryItem) renderItemHistory(selectedHistoryItem);
        else renderHistoryItems();
    }
}

/* =========================
   INVENTORY TABLE
========================= */

function renderInventory() {
    const search = document.getElementById("searchInput").value.toLowerCase();

    const items = inventory.filter(item =>
        item.name.toLowerCase().includes(search) ||
        item.type.toLowerCase().includes(search) ||
        item.vendor.toLowerCase().includes(search)
    );

    if (items.length === 0) {
        document.getElementById("content").innerHTML = `
            <div class="empty">No inventory items found.</div>
        `;
        return;
    }

    let html = `
        <div class="table-wrapper">
        <table>
        <thead>
        <tr>
            <th>Item</th>
            <th>Type</th>
            <th>Unit</th>
            <th>Vendor</th>
            <th>Current Stock</th>
            <th>Purchase Price</th>
            <th>Alert Level</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
    `;

    items.forEach(item => {
        const status = getStatus(item);
        const price = Number(item.purchasePrice || 0);

        html += `
        <tr>
            <td><strong>${escapeHtml(item.name)}</strong></td>
            <td>${escapeHtml(item.type)}</td>
            <td>${escapeHtml(item.unit)}</td>
            <td>${escapeHtml(item.vendor)}</td>
            <td><strong>${formatNumber(item.stock)} ${escapeHtml(item.unit)}</strong></td>
            <td><span class="price-badge">₹${price.toFixed(2)} / ${escapeHtml(item.unit)}</span></td>
            <td>${formatNumber(item.alert)} ${escapeHtml(item.unit)}</td>
            <td><span class="status ${status.class}">${status.text}</span></td>
            <td>
                <button class="btn btn-stock-in" onclick="openStockIn(${item.id})">Stock In</button>
                <button class="btn btn-stock" onclick="openStockOut(${item.id})">Stock Out</button>
                <button class="btn btn-edit" onclick="editInventory(${item.id})">Edit</button>
                <button class="btn btn-delete" onclick="deleteInventory(${item.id})">Delete</button>
            </td>
        </tr>
        `;
    });

    html += `</tbody></table></div>`;
    document.getElementById("content").innerHTML = html;
}

/* =========================
   HISTORY ITEM LIST
========================= */

function renderHistoryItems() {
    const search = document.getElementById("searchInput").value.toLowerCase();

    const items = inventory.filter(item =>
        item.name.toLowerCase().includes(search) ||
        item.type.toLowerCase().includes(search) ||
        item.vendor.toLowerCase().includes(search)
    );

    if (items.length === 0) {
        document.getElementById("content").innerHTML = `
            <div class="empty">No inventory items available.</div>
        `;
        return;
    }

    let html = `<div class="history-items">`;

    items.forEach(item => {
        const itemHistory = history.filter(record => record.inventoryItemId === item.id);
        let lastMovement = "No movement yet";
        let lastMovementClass = "";

        if (itemHistory.length > 0) {
            const last = itemHistory[itemHistory.length - 1];

            if (last.movement === "Stock Out") {
                lastMovement = `−${formatNumber(last.quantity)} ${last.unit}`;
                lastMovementClass = "history-out";
            } else {
                lastMovement = `+${formatNumber(last.quantity)} ${last.unit}`;
                lastMovementClass = "history-in";
            }
        }

        html += `
            <div class="history-card">
                <div class="history-card-top">
                    <h3>${escapeHtml(item.name)}</h3>
                    <div class="history-icon">📦</div>
                </div>
                <div class="history-info">
                    Current Stock
                    <div class="history-stock">${formatNumber(item.stock)} ${escapeHtml(item.unit)}</div>
                    Latest Purchase Price
                    <div class="history-stock">₹${Number(item.purchasePrice || 0).toFixed(2)} / ${escapeHtml(item.unit)}</div>
                    Last Movement
                    <div class="${lastMovementClass}">${escapeHtml(lastMovement)}</div>
                </div>
                <br>
                <button class="btn btn-view" onclick="openItemHistory(${item.id})">View History →</button>
            </div>
        `;
    });

    html += `</div>`;
    document.getElementById("content").innerHTML = html;
}

/* =========================
   INDIVIDUAL HISTORY
========================= */

function openItemHistory(id) {
    selectedHistoryItem = id;
    renderItemHistory(id);
}

function formatHistoryDate(value) {
    if (!value) return "—";
    const date = new Date(value);
    if (isNaN(date.getTime())) return String(value);
    return date.toLocaleString();
}

function renderItemHistory(id) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    const search = document.getElementById("searchInput").value.toLowerCase();

    let records = history.filter(record => record.inventoryItemId === id);

    if (search) {
        records = records.filter(record =>
            String(record.reason || "").toLowerCase().includes(search) ||
            String(record.movement || "").toLowerCase().includes(search) ||
            String(record.vendor || "").toLowerCase().includes(search)
        );
    }

    document.getElementById("sectionTitle").textContent = `${item.name} — Stock History`;

    let html = `
        <button class="btn btn-back" onclick="showHistory()">← Back to History</button>
        <div class="current-stock">
            Current Stock:
            <strong>${formatNumber(item.stock)} ${escapeHtml(item.unit)}</strong>
            <br><br>
            Latest Purchase Price:
            <strong>₹${Number(item.purchasePrice || 0).toFixed(2)} / ${escapeHtml(item.unit)}</strong>
        </div>
    `;

    if (records.length === 0) {
        html += `<div class="empty">No history available for this item.</div>`;
        document.getElementById("content").innerHTML = html;
        return;
    }

    html += `
        <div class="table-wrapper">
        <table>
        <thead>
        <tr>
            <th>Date & Time</th>
            <th>Movement</th>
            <th>Quantity</th>
            <th>Balance</th>
            <th>Purchase Price</th>
            <th>Total Cost</th>
            <th>Vendor</th>
            <th>Reason</th>
        </tr>
        </thead>
        <tbody>
    `;

    records.slice().reverse().forEach(record => {
        const isOut = record.movement === "Stock Out";
        const movementClass = isOut ? "history-out" : "history-in";
        const sign = isOut ? "−" : "+";
        const price = Number(record.pricePerUnit || 0);
        const totalCost = Number(record.totalCost || 0);

        html += `
        <tr>
            <td>${escapeHtml(formatHistoryDate(record.date))}</td>
            <td class="${movementClass}">${escapeHtml(record.movement)}</td>
            <td class="${movementClass}">${sign}${formatNumber(record.quantity)} ${escapeHtml(record.unit)}</td>
            <td><strong>${formatNumber(record.balance)} ${escapeHtml(record.unit)}</strong></td>
            <td>${isOut ? "—" : `₹${price.toFixed(2)} / ${escapeHtml(record.unit)}`}</td>
            <td>${isOut ? "—" : `₹${totalCost.toFixed(2)}`}</td>
            <td>${record.vendor ? escapeHtml(record.vendor) : "—"}</td>
            <td>${escapeHtml(record.reason || "—")}</td>
        </tr>
        `;
    });

    html += `</tbody></table></div>`;
    document.getElementById("content").innerHTML = html;
}

/* =========================
   STOCK IN
========================= */

function openStockIn(id) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    stockInId = id;

    document.getElementById("stockInItemName").textContent = item.name;
    document.getElementById("stockInCurrent").textContent = `${formatNumber(item.stock)} ${item.unit}`;
    document.getElementById("stockInLatestPrice").textContent = `₹${Number(item.purchasePrice || 0).toFixed(2)} / ${item.unit}`;
    document.getElementById("stockInQuantity").value = "";
    document.getElementById("stockInPrice").value = item.purchasePrice || "";
    document.getElementById("stockInVendor").value = item.vendor || "";
    document.getElementById("stockInReason").value = "Purchase";

    calculatePurchaseTotal();
    document.getElementById("stockInModal").style.display = "flex";
}

function calculatePurchaseTotal() {
    const quantity = Number(document.getElementById("stockInQuantity").value) || 0;
    const price = Number(document.getElementById("stockInPrice").value) || 0;
    const total = quantity * price;
    document.getElementById("stockInTotal").textContent = `₹${total.toFixed(2)}`;
}

async function confirmStockIn() {
    const item = inventory.find(i => i.id === stockInId);
    if (!item) return;

    const quantity = Number(document.getElementById("stockInQuantity").value);
    const price = Number(document.getElementById("stockInPrice").value);
    const vendor = document.getElementById("stockInVendor").value.trim();
    const reason = document.getElementById("stockInReason").value;

    if (!quantity || quantity <= 0) {
        alert("Please enter a valid purchase quantity.");
        return;
    }

    if (isNaN(price) || price < 0) {
        alert("Please enter a valid purchase price.");
        return;
    }

    const newBalance = Number((item.stock + quantity).toFixed(2));
    const totalCost = Number((quantity * price).toFixed(2));

    const buttons = document.querySelectorAll("#stockInModal .modal-actions button");
    buttons.forEach(button => button.disabled = true);

    try {
        const updateFields = {
            current_stock: newBalance,
            purchase_price: price
        };

        if (vendor) updateFields.vendor = vendor;

        const { data: updatedItem, error: updateError } = await supabaseClient
            .from("inventory_items")
            .update(updateFields)
            .eq("id", item.id)
            .select()
            .single();

        if (updateError) throw updateError;

        const { data: newHistory, error: historyError } = await supabaseClient
            .from("inventory_history")
            .insert({
                inventory_item_id: item.id,
                item_name: updatedItem.name,
                movement: "Stock In",
                quantity,
                unit: updatedItem.unit,
                balance: newBalance,
                reason,
                price_per_unit: price,
                total_cost: totalCost,
                vendor: vendor || updatedItem.vendor || null
            })
            .select()
            .single();

        if (historyError) {
            await supabaseClient
                .from("inventory_items")
                .update({
                    current_stock: item.stock,
                    purchase_price: item.purchasePrice,
                    vendor: item.vendor
                })
                .eq("id", item.id);
            throw historyError;
        }

        item.stock = Number(updatedItem.current_stock || 0);
        item.purchasePrice = Number(updatedItem.purchase_price || 0);
        item.vendor = updatedItem.vendor || "";

        history.push({
            id: newHistory.id,
            inventoryItemId: newHistory.inventory_item_id,
            date: newHistory.created_at,
            item: newHistory.item_name,
            movement: newHistory.movement,
            quantity: Number(newHistory.quantity),
            unit: newHistory.unit,
            balance: Number(newHistory.balance),
            reason: newHistory.reason || "",
            pricePerUnit: Number(newHistory.price_per_unit || 0),
            totalCost: Number(newHistory.total_cost || 0),
            vendor: newHistory.vendor || ""
        });

        closeModal("stockInModal");
        showInventory();
    } catch (error) {
        console.error("Stock In error:", error);
        alert("Could not record Stock In.\n\n" + (error.message || "Unknown error"));
    } finally {
        buttons.forEach(button => button.disabled = false);
    }
}

/* =========================
   STOCK OUT
========================= */

function openStockOut(id) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    stockOutId = id;

    document.getElementById("stockOutItemName").textContent = item.name;
    document.getElementById("stockOutCurrent").textContent = `${formatNumber(item.stock)} ${item.unit}`;
    document.getElementById("stockOutQuantity").value = "";
    document.getElementById("stockOutReason").value = "Kitchen use";
    document.getElementById("stockOutModal").style.display = "flex";
}

async function confirmStockOut() {
    const item = inventory.find(i => i.id === stockOutId);
    if (!item) return;

    const quantity = Number(document.getElementById("stockOutQuantity").value);
    const reason = document.getElementById("stockOutReason").value;

    if (!quantity || quantity <= 0) {
        alert("Please enter a valid quantity.");
        return;
    }

    if (quantity > item.stock) {
        alert("Stock Out quantity cannot be greater than current stock.");
        return;
    }

    const newBalance = Number((item.stock - quantity).toFixed(2));
    const buttons = document.querySelectorAll("#stockOutModal .modal-actions button");
    buttons.forEach(button => button.disabled = true);

    try {
        const { data: updatedItem, error: updateError } = await supabaseClient
            .from("inventory_items")
            .update({ current_stock: newBalance })
            .eq("id", item.id)
            .select()
            .single();

        if (updateError) throw updateError;

        const { data: newHistory, error: historyError } = await supabaseClient
            .from("inventory_history")
            .insert({
                inventory_item_id: item.id,
                item_name: updatedItem.name,
                movement: "Stock Out",
                quantity,
                unit: updatedItem.unit,
                balance: newBalance,
                reason,
                price_per_unit: null,
                total_cost: null,
                vendor: updatedItem.vendor || null
            })
            .select()
            .single();

        if (historyError) {
            await supabaseClient
                .from("inventory_items")
                .update({ current_stock: item.stock })
                .eq("id", item.id);
            throw historyError;
        }

        item.stock = Number(updatedItem.current_stock || 0);

        history.push({
            id: newHistory.id,
            inventoryItemId: newHistory.inventory_item_id,
            date: newHistory.created_at,
            item: newHistory.item_name,
            movement: newHistory.movement,
            quantity: Number(newHistory.quantity),
            unit: newHistory.unit,
            balance: Number(newHistory.balance),
            reason: newHistory.reason || "",
            pricePerUnit: null,
            totalCost: null,
            vendor: newHistory.vendor || ""
        });

        closeModal("stockOutModal");
        showInventory();
    } catch (error) {
        console.error("Stock Out error:", error);
        alert("Could not record Stock Out.\n\n" + (error.message || "Unknown error"));
    } finally {
        buttons.forEach(button => button.disabled = false);
    }
}

/* =========================
   CLOSE MODAL
========================= */

function closeModal(id) {
    document.getElementById(id).style.display = "none";
}

window.addEventListener("click", function(e) {
    if (e.target.classList.contains("modal")) {
        e.target.style.display = "none";
    }
});

/* =========================
   HELPERS
========================= */

function formatNumber(value) {
    const number = Number(value || 0);
    return Number.isInteger(number)
        ? String(number)
        : number.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

document.getElementById("itemStock").addEventListener("input", updateInitialPurchaseTotal);
document.getElementById("itemPrice").addEventListener("input", updateInitialPurchaseTotal);
