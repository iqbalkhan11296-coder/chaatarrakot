<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loyalty Admin</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --burgundy:#4b001f;
    --burgundy-dark:#300014;
    --burgundy-light:#650028;
    --gold:#d4af37;
    --gold-light:#f3d77a;
    --cream:#faf7f0;
    --text:#211b1d;
    --muted:#81787b;
    --border:#eadfe2;
    --white:#ffffff;
}

body{
    margin:0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(circle at top,#eee4e7 0,#f5f2f0 40%,#ebe7e5 100%);

    color:var(--text);
}

button,
input{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    overflow:hidden;
}

/* =========================
   HOME HEADER
========================= */

.header{
    min-height:78px;
    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            135deg,
            var(--burgundy-dark),
            var(--burgundy),
            var(--burgundy-light)
        );

    color:white;

    position:sticky;
    top:0;
    z-index:20;

    box-shadow:0 6px 25px rgba(75,0,31,.25);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark{
    width:42px;
    height:42px;

    border:1px solid rgba(212,175,55,.7);
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--gold-light);
    font-size:21px;
    font-weight:800;

    background:rgba(255,255,255,.05);
}

.logo{
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:.3px;
}

.header small{
    color:var(--gold-light);
    font-size:11px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    font-weight:700;
}

/* =========================
   HOME
========================= */

.home{
    padding:25px 18px 40px;
}

.hero{
    position:relative;
    overflow:hidden;

    padding:30px 24px;
    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            var(--burgundy-dark),
            var(--burgundy-light)
        );

    color:white;

    box-shadow:
        0 15px 35px rgba(75,0,31,.20);

    margin-bottom:18px;
}

.hero:after{
    content:"";
    position:absolute;

    width:180px;
    height:180px;

    border:1px solid rgba(212,175,55,.18);
    border-radius:50%;

    right:-80px;
    top:-70px;
}

.hero:before{
    content:"";
    position:absolute;

    width:100px;
    height:100px;

    border:1px solid rgba(212,175,55,.15);
    border-radius:50%;

    right:20px;
    bottom:-65px;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-label{
    color:var(--gold-light);
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;

    margin-bottom:10px;
}

.hero h1{
    margin:0 0 8px;

    font-family:Georgia,"Times New Roman",serif;

    font-size:30px;
    line-height:1.15;
}

.hero p{
    margin:0;

    color:#eadfe2;

    line-height:1.5;
    font-size:14px;

    max-width:400px;
}

.data-btn{
    width:100%;

    border:1px solid #b89227;
    border-radius:16px;

    padding:17px;

    font-size:14px;
    font-weight:800;
    letter-spacing:1.3px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #e3c15a,
            #c49b2e
        );

    color:#3b0018;

    box-shadow:
        0 8px 20px rgba(151,113,21,.22);

    transition:.2s;
}

.data-btn:hover{
    transform:translateY(-1px);
}

.data-btn:active{
    transform:scale(.98);
}

/* =========================
   PAGES
========================= */

.page{
    display:none;
    min-height:100vh;
    background:#fff;
}

.page.active{
    display:block;
}

/* =========================
   PAGE HEADER
========================= */

.page-header{
    min-height:70px;

    display:flex;
    align-items:center;
    gap:12px;

    padding:0 16px;

    background:
        linear-gradient(
            135deg,
            var(--burgundy-dark),
            var(--burgundy)
        );

    color:white;

    position:sticky;
    top:0;
    z-index:20;

    box-shadow:0 5px 20px rgba(75,0,31,.22);
}

.back{
    width:40px;
    height:40px;

    border:1px solid rgba(212,175,55,.35);
    border-radius:12px;

    background:rgba(255,255,255,.06);

    color:var(--gold-light);

    font-size:29px;
    line-height:1;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.page-title{
    font-family:Georgia,"Times New Roman",serif;

    font-size:20px;
    font-weight:700;

    letter-spacing:.2px;
}

/* =========================
   SEARCH
========================= */

.search{
    padding:17px 16px;

    background:#faf8f7;

    border-bottom:1px solid var(--border);
}

.search-box{
    position:relative;
}

.search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);

    color:#9a8d91;

    font-size:17px;
}

.search input{
    width:100%;

    border:1px solid #e2d7da;

    background:white;

    border-radius:15px;

    padding:14px 15px 14px 43px;

    outline:none;

    font-size:15px;

    color:var(--text);

    box-shadow:
        0 3px 12px rgba(60,20,30,.04);

    transition:.2s;
}

.search input:focus{
    border-color:var(--gold);
    box-shadow:
        0 0 0 3px rgba(212,175,55,.12);
}

/* =========================
   ACCOUNTS
========================= */

.accounts{
    padding:9px 12px 35px;

    background:#faf8f7;
}

.account{
    width:100%;

    text-align:left;

    border:1px solid transparent;
    border-bottom:1px solid #eee5e7;

    background:#fff;

    padding:15px 12px;

    cursor:pointer;

    display:flex;
    align-items:center;

    gap:13px;

    transition:.2s;
}

.account:first-child{
    border-radius:16px 16px 0 0;
}

.account:last-child{
    border-radius:0 0 16px 16px;
}

.account:hover{
    background:#fffaf2;
}

.account:active{
    transform:scale(.995);
}

.avatar{
    width:47px;
    height:47px;

    border-radius:15px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:Georgia,"Times New Roman",serif;

    font-size:19px;
    font-weight:700;

    color:var(--gold-light);

    background:
        linear-gradient(
            135deg,
            var(--burgundy),
            var(--burgundy-dark)
        );

    box-shadow:
        0 5px 12px rgba(75,0,31,.18);
}

.account-info{
    min-width:0;
    flex:1;
}

.account-name{
    font-size:15px;
    font-weight:750;

    margin-bottom:5px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.account-phone{
    color:var(--muted);
    font-size:13px;
}

.account-arrow{
    color:#b3a5a9;
    font-size:22px;
}

/* =========================
   CUSTOMER PROFILE
========================= */

.profile{
    padding:18px 16px 40px;

    background:#faf8f7;

    min-height:calc(100vh - 70px);
}

.profile-card{
    position:relative;
    overflow:hidden;

    border-radius:22px;

    padding:22px;

    display:flex;
    align-items:center;

    gap:15px;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--burgundy-dark),
            var(--burgundy),
            var(--burgundy-light)
        );

    box-shadow:
        0 12px 28px rgba(75,0,31,.20);
}

.profile-card:after{
    content:"";

    position:absolute;

    width:140px;
    height:140px;

    border:1px solid rgba(212,175,55,.18);
    border-radius:50%;

    right:-65px;
    top:-55px;
}

.big-avatar{
    width:64px;
    height:64px;

    border-radius:19px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:Georgia,"Times New Roman",serif;

    font-size:25px;
    font-weight:700;

    color:var(--burgundy);

    background:
        linear-gradient(
            135deg,
            #f5d979,
            #c99f32
        );

    box-shadow:
        0 7px 18px rgba(0,0,0,.18);

    position:relative;
    z-index:2;
}

.profile-info{
    min-width:0;
    position:relative;
    z-index:2;
}

.profile-name{
    font-family:Georgia,"Times New Roman",serif;

    font-size:21px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-phone{
    color:#e8dfe2;

    margin-top:5px;

    font-size:13px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:10px;

    margin-top:12px;
}

.stat{
    position:relative;

    border:1px solid var(--border);

    border-radius:17px;

    padding:17px;

    background:white;

    box-shadow:
        0 5px 15px rgba(50,20,30,.035);

    overflow:hidden;
}

.stat:first-child{
    background:
        linear-gradient(
            145deg,
            #fffdf5,
            #f9f1d7
        );

    border-color:#ead59a;
}

.stat-label{
    font-size:10px;

    color:#918488;

    margin-bottom:8px;

    font-weight:800;

    letter-spacing:1px;
}

.stat-value{
    font-size:19px;

    font-weight:800;

    color:var(--burgundy);
}

.stat:first-child .stat-value{
    color:#9a7411;
}

/* =========================
   HISTORY
========================= */

.history-title{
    display:flex;
    align-items:center;
    gap:9px;

    font-family:Georgia,"Times New Roman",serif;

    font-size:20px;

    font-weight:700;

    margin:29px 0 12px;

    color:var(--burgundy);
}

.history-title:before{
    content:"";

    width:4px;
    height:21px;

    border-radius:5px;

    background:var(--gold);
}

.purchase{
    border:1px solid var(--border);

    border-radius:16px;

    background:white;

    padding:16px;

    margin-bottom:10px;

    box-shadow:
        0 4px 14px rgba(50,20,30,.035);
}

.purchase-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;
}

.purchase-date{
    font-size:12px;

    color:var(--muted);
}

.purchase-total{
    font-size:16px;

    font-weight:800;

    color:var(--burgundy);
}

.items{
    margin-top:12px;

    line-height:1.65;

    font-size:14px;

    color:#443b3e;
}

.points{
    display:inline-flex;

    align-items:center;

    margin-top:12px;

    padding:6px 9px;

    border-radius:8px;

    background:#fff8df;

    border:1px solid #f0dfa8;

    color:#9a7411;

    font-size:12px;

    font-weight:800;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
    padding:50px 20px;

    text-align:center;

    color:#8a7e82;

    font-size:14px;
}

.loading{
    padding:45px 20px;

    text-align:center;

    color:#8a7e82;

    font-size:14px;
}

.loading:before{
    content:"";

    display:block;

    width:28px;
    height:28px;

    margin:0 auto 12px;

    border:3px solid #eadfe2;

    border-top-color:var(--gold);

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error{
    margin:16px;

    padding:16px;

    border-radius:14px;

    background:#fff0f2;

    border:1px solid #f2cbd1;

    color:#9d2030;

    font-size:14px;

    line-height:1.5;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:651px){

    body{
        padding:24px 0;
    }

    .app{
        border-radius:22px;

        box-shadow:
            0 15px 50px rgba(30,10,20,.15);
    }

    .header,
    .page-header{
        position:sticky;
    }
}

/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

    .hero h1{
        font-size:26px;
    }

    .profile-name{
        font-size:18px;
    }

    .stat{
        padding:14px;
    }

    .stat-value{
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HOME -->
    <section id="homePage">

        <header class="header">

            <div class="logo-area">

                <div class="logo-mark">
                    ★
                </div>

                <div class="logo">
                    Arras Customers Datas
                </div>

            </div>

            <small>Admin</small>

        </header>


        <main class="home">

            <div class="hero">

                <div class="hero-content">

                    <div class="hero-label">
                        Customer Rewards
                    </div>

                    <h1>
                        Customer Loyalty
                    </h1>

                    <p>
                        Manage customer accounts, purchases
                        and loyalty points in one place.
                    </p>

                </div>

            </div>


            <button
                class="data-btn"
                onclick="openAccounts()"
            >
                VIEW LOYALTY DATA
            </button>

        </main>

    </section>


    <!-- ACCOUNTS -->
    <section id="accountsPage" class="page">

        <header class="page-header">

            <button
                class="back"
                onclick="showPage('homePage')"
            >
                ‹
            </button>

            <div class="page-title">
                Loyalty Accounts
            </div>

        </header>


        <div class="search">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search name or phone..."
                    oninput="filterAccounts()"
                >

            </div>

        </div>


        <div
            id="accountsList"
            class="accounts"
        >

            <div class="loading">
                Loading accounts...
            </div>

        </div>

    </section>


    <!-- CUSTOMER -->
    <section id="customerPage" class="page">

        <header class="page-header">

            <button
                class="back"
                onclick="showPage('accountsPage')"
            >
                ‹
            </button>

            <div class="page-title">
                Customer
            </div>

        </header>


        <div id="customerContent"></div>

    </section>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=4"></script>


<script>

/*
    Uses the same Supabase connection as the billing page.

    Tables:
    loyalty_customers
    loyalty_transactions
*/


if (
    typeof supabaseClient === "undefined"
    || !supabaseClient
) {

    console.error(
        "Supabase client is not available. Check supabase.js."
    );

}


let allCustomers = [];


function showPage(id){

    document
        .querySelectorAll(".app > section")
        .forEach(section=>{
            section.classList.remove("active");
        });


    const page =
        document.getElementById(id);


    if(id === "homePage"){

        page.style.display = "block";

    }else{

        page.classList.add("active");

    }

}


function openAccounts(){

    showPage("accountsPage");

    loadCustomers();

}


async function loadCustomers(){

    const list =
        document.getElementById("accountsList");


    if(!supabaseClient){

        list.innerHTML = `
            <div class="error">
                Supabase is not connected yet.<br><br>

                Open this file and enter your Supabase URL
                and anon key in the two variables near
                the bottom.
            </div>
        `;

        return;

    }


    list.innerHTML =
        `<div class="loading">Loading accounts...</div>`;


    const {
        data,
        error
    } = await supabaseClient

        .from("loyalty_customers")

        .select("*")

        .order(
            "name",
            {
                ascending:true
            }
        );


    if(error){

        list.innerHTML = `
            <div class="error">
                Could not load loyalty accounts.<br><br>

                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }


    allCustomers = data || [];

    renderCustomers(allCustomers);

}


function renderCustomers(customers){

    const list =
        document.getElementById("accountsList");


    if(!customers.length){

        list.innerHTML =
            `<div class="empty">
                No loyalty accounts found.
            </div>`;

        return;

    }


    list.innerHTML = customers.map(customer => {

        const name =
            customer.name ||
            "Unnamed Customer";

        const phone =
            customer.phone ||
            "No phone";


        return `

            <button
                class="account"
                onclick="openCustomer('${escapeAttr(customer.id)}')"
            >

                <div class="avatar">
                    ${escapeHtml(
                        name.charAt(0).toUpperCase()
                    )}
                </div>


                <div class="account-info">

                    <div class="account-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="account-phone">
                        ${escapeHtml(phone)}
                    </div>

                </div>


                <div class="account-arrow">
                    ›
                </div>

            </button>

        `;

    }).join("");

}


function filterAccounts(){

    const query =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        allCustomers.filter(customer => {

            const name =
                String(
                    customer.name || ""
                ).toLowerCase();

            const phone =
                String(
                    customer.phone || ""
                ).toLowerCase();


            return (
                name.includes(query)
                ||
                phone.includes(query)
            );

        });


    renderCustomers(filtered);

}


async function openCustomer(id){

    showPage("customerPage");


    const content =
        document.getElementById(
            "customerContent"
        );


    content.innerHTML =
        `<div class="loading">
            Loading customer...
        </div>`;


    const customer =
        allCustomers.find(
            c =>
                String(c.id)
                ===
                String(id)
        );


    if(!customer){

        content.innerHTML =
            `<div class="error">
                Customer not found.
            </div>`;

        return;

    }


    const {
        data: purchases,
        error
    } = await supabaseClient

        .from("loyalty_transactions")

        .select("*")

        .eq(
            "customer_id",
            customer.id
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        content.innerHTML = `
            <div class="error">

                Could not load purchase history.
                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

        return;

    }


    const name =
        customer.name ||
        "Unnamed Customer";


    const phone =
        customer.phone ||
        "No phone";


    const history =
        purchases || [];


    content.innerHTML = `

        <main class="profile">


            <div class="profile-card">


                <div class="big-avatar">

                    ${escapeHtml(
                        name.charAt(0).toUpperCase()
                    )}

                </div>


                <div class="profile-info">

                    <div class="profile-name">
                        ${escapeHtml(name)}
                    </div>


                    <div class="profile-phone">
                        ${escapeHtml(phone)}
                    </div>

                </div>


            </div>



            <div class="stats">


                <div class="stat">

                    <div class="stat-label">
                        LOYALTY POINTS
                    </div>

                    <div class="stat-value">
                        ⭐ ${Number(
                            customer.points || 0
                        )}
                    </div>

                </div>



                <div class="stat">

                    <div class="stat-label">
                        VISITS
                    </div>

                    <div class="stat-value">
                        ${Number(
                            customer.visit_count || 0
                        )}
                    </div>

                </div>



                <div class="stat">

                    <div class="stat-label">
                        LIFETIME SPEND
                    </div>

                    <div class="stat-value">
                        ₹${Number(
                            customer.lifetime_spend || 0
                        ).toFixed(2)}
                    </div>

                </div>



                <div class="stat">

                    <div class="stat-label">
                        PURCHASES
                    </div>

                    <div class="stat-value">
                        ${history.length}
                    </div>

                </div>


            </div>



            <div class="history-title">
                Purchase History
            </div>


            <div>

                ${
                    history.length

                    ? history
                        .map(renderPurchase)
                        .join("")

                    : `
                        <div class="empty">
                            No purchase history.
                        </div>
                    `
                }

            </div>


        </main>

    `;

}


function renderPurchase(purchase){

    const date =
        new Date(
            purchase.created_at
        );


    const dateText =
        date.toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );


    const timeText =
        date.toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    return `

        <div class="purchase">


            <div class="purchase-top">


                <div class="purchase-date">

                    ${dateText}
                    •
                    ${timeText}

                </div>


                <div class="purchase-total">

                    ₹${Number(
                        purchase.amount || 0
                    ).toFixed(2)}

                </div>


            </div>


            <div class="items">

                ${formatDescription(
                    purchase.description
                )}

            </div>


            <div class="points">

                ${
                    Number(
                        purchase.points || 0
                    ) >= 0

                    ? `+${Number(
                        purchase.points || 0
                    )} points`

                    : `${Number(
                        purchase.points || 0
                    )} points`
                }

            </div>


        </div>

    `;

}


function formatDescription(description){

    if(!description)
        return "Purchase";


    try{

        const parsed =
            JSON.parse(description);


        if(Array.isArray(parsed)){

            return parsed.map(item => {

                if(typeof item === "string"){

                    return escapeHtml(item);

                }


                const name =
                    item.name
                    ||
                    item.item
                    ||
                    "Item";


                const qty =
                    item.quantity
                    ||
                    item.qty
                    ||
                    1;


                return `
                    ${escapeHtml(name)}
                    ×
                    ${escapeHtml(qty)}
                `;

            }).join("<br>");

        }

    }catch(e){}


    return escapeHtml(
        String(description)
    ).replace(
        /\n/g,
        "<br>"
    );

}


function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(value){

    return escapeHtml(value)
        .replace(
            /`/g,
            "&#096;"
        );

}


showPage("homePage");
