<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyalty Admin</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#f5efe8;
    color:#24151a;
}
.app{
    max-width:600px;
    min-height:100vh;
    margin:auto;
    background:#fffaf5;
    box-shadow:0 0 40px rgba(75,0,31,.10);
}
.header{
    height:68px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eadbd0;
    position:sticky;
    top:0;
    background:linear-gradient(135deg,#4b001f,#650028);
    color:#fff;
    z-index:10;
}
.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:.3px;
}
.header small{
    color:#f4dca7;
    font-weight:600;
}
.home{
    padding:26px 18px;
}
.hero{
    padding:30px 22px;
    border-radius:22px;
    background:linear-gradient(145deg,#4b001f,#72002d);
    color:#fff;
    border:1px solid #8b3b58;
    margin-bottom:20px;
    box-shadow:0 14px 30px rgba(75,0,31,.18);
}
.hero h1{
    margin:0 0 8px;
    font-size:29px;
    letter-spacing:-.4px;
}
.hero p{
    margin:0;
    color:#f3dcca;
    line-height:1.5;
}
.data-btn{
    width:100%;
    border:1px solid #d4a72c;
    border-radius:15px;
    padding:17px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,#d7ad42,#f2d477);
    color:#3d0019;
    box-shadow:0 8px 20px rgba(75,0,31,.14);
    letter-spacing:.5px;
}
.data-btn:active{transform:scale(.99)}
.page{display:none}
.page.active{display:block}
.page-header{
    height:68px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 16px;
    border-bottom:1px solid #eadbd0;
    position:sticky;
    top:0;
    background:linear-gradient(135deg,#4b001f,#650028);
    color:#fff;
    z-index:10;
}
.back{
    border:0;
    background:rgba(255,255,255,.12);
    color:#fff;
    width:38px;
    height:38px;
    border-radius:11px;
    font-size:27px;
    line-height:1;
    cursor:pointer;
}
.page-title{
    font-size:20px;
    font-weight:800;
}
.search{
    padding:16px;
    border-bottom:1px solid #eadbd0;
    background:#fffaf5;
}
.search input{
    width:100%;
    border:1px solid #ddcfc5;
    background:#fff;
    color:#24151a;
    border-radius:13px;
    padding:14px 15px;
    outline:none;
    font-size:15px;
    box-shadow:0 3px 10px rgba(75,0,31,.04);
}
.search input:focus{
    border-color:#b88625;
    box-shadow:0 0 0 3px rgba(216,174,66,.16);
}
.accounts{
    padding:10px 12px 30px;
}
.account{
    width:100%;
    text-align:left;
    border:1px solid #eadbd0;
    border-radius:16px;
    background:#fff;
    padding:15px;
    margin:7px 0;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:13px;
    box-shadow:0 5px 16px rgba(75,0,31,.055);
    transition:.18s ease;
}
.account:hover{
    transform:translateY(-1px);
    border-color:#d8b866;
    box-shadow:0 8px 20px rgba(75,0,31,.10);
}
.avatar{
    width:46px;
    height:46px;
    border-radius:14px;
    background:linear-gradient(135deg,#4b001f,#8b1646);
    color:#f6d77d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:18px;
    flex:none;
}
.account-info{min-width:0}
.account-name{
    font-weight:800;
    margin-bottom:4px;
    color:#32101d;
}
.account-phone{
    color:#8a7479;
    font-size:13px;
}
.account-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
}
.whatsapp-btn{
    border:0;
    border-radius:10px;
    padding:9px 11px;
    background:#25D366;
    color:#fff;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(37,211,102,.18);
}
.whatsapp-btn:hover{filter:brightness(.95)}
.empty{
    padding:45px 20px;
    text-align:center;
    color:#8a7479;
}
.profile{
    padding:20px 16px 30px;
}
.profile-card{
    border:1px solid #eadbd0;
    border-radius:20px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;
    background:linear-gradient(145deg,#fff,#fff8ef);
    box-shadow:0 7px 20px rgba(75,0,31,.07);
}
.big-avatar{
    width:64px;
    height:64px;
    border-radius:18px;
    background:linear-gradient(135deg,#4b001f,#8b1646);
    color:#f6d77d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:800;
    box-shadow:0 7px 16px rgba(75,0,31,.16);
}
.profile-name{
    font-size:21px;
    font-weight:800;
    color:#32101d;
}
.profile-phone{
    color:#8a7479;
    margin-top:5px;
}
.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}
.stat{
    border:1px solid #eadbd0;
    border-radius:16px;
    padding:15px;
    background:#fff;
    box-shadow:0 5px 14px rgba(75,0,31,.045);
}
.stat-label{
    font-size:11px;
    color:#967f84;
    margin-bottom:7px;
    font-weight:800;
    letter-spacing:.5px;
}
.stat-value{
    font-size:19px;
    font-weight:800;
    color:#4b001f;
}
.history-title{
    font-size:19px;
    font-weight:800;
    margin:30px 0 12px;
    color:#32101d;
}
.purchase{
    border:1px solid #eadbd0;
    border-radius:15px;
    padding:16px;
    margin:9px 0;
    background:#fff;
    box-shadow:0 4px 12px rgba(75,0,31,.04);
}
.purchase-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}
.purchase-date{
    font-size:13px;
    color:#8a7479;
}
.purchase-total{
    font-weight:800;
    color:#4b001f;
}
.items{
    margin-top:10px;
    line-height:1.55;
    font-size:14px;
    color:#4d3a40;
}
.points{
    margin-top:10px;
    font-size:13px;
    font-weight:800;
    color:#9a6d00;
}
.loading{
    padding:35px;
    text-align:center;
    color:#8a7479;
}
.error{
    margin:16px;
    padding:14px;
    border-radius:12px;
    background:#fff0f0;
    border:1px solid #edcaca;
    color:#a00000;
    font-size:14px;
}
@media(min-width:601px){
    body{padding:20px 0}
    .app{border-radius:20px;overflow:hidden}
}
</style>
</head>
<body>

<div class="app">

    <!-- HOME -->
    <section id="homePage">
        <header class="header">
            <div class="logo">Loyalty</div>
            <small>Admin</small>
        </header>

        <main class="home">
            <div class="hero">
                <h1>Customer Loyalty</h1>
                <p>Manage customer accounts, purchases and loyalty points.</p>
            </div>

            <button class="data-btn" onclick="openAccounts()">
                DATAS
            </button>
        </main>
    </section>

    <!-- ACCOUNTS -->
    <section id="accountsPage" class="page">
        <header class="page-header">
            <button class="back" onclick="showPage('homePage')">‹</button>
            <div class="page-title">Loyalty Accounts</div>
        </header>

        <div class="search">
            <input id="searchInput" type="text"
                   placeholder="Search name or phone..."
                   oninput="filterAccounts()">
        </div>

        <div id="accountsList" class="accounts">
            <div class="loading">Loading accounts...</div>
        </div>
    </section>

    <!-- CUSTOMER -->
    <section id="customerPage" class="page">
        <header class="page-header">
            <button class="back" onclick="showPage('accountsPage')">‹</button>
            <div class="page-title">Customer</div>
        </header>

        <div id="customerContent"></div>
    </section>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=4"></script>

<script>
/*
    Uses the same Supabase connection as the billing page.

    Tables:
    loyalty_customers
    loyalty_transactions
*/

if (typeof supabaseClient === "undefined" || !supabaseClient) {
    console.error("Supabase client is not available. Check supabase.js.");
}

let allCustomers = [];

function showPage(id){
    document.querySelectorAll(".app > section").forEach(section=>{
        section.classList.remove("active");
    });

    const page = document.getElementById(id);

    if(id === "homePage"){
        page.style.display = "block";
    }else{
        page.classList.add("active");
    }
}

function openAccounts(){
    showPage("accountsPage");
    loadCustomers();
}

async function loadCustomers(){

    const list = document.getElementById("accountsList");

    if(!supabaseClient){
        list.innerHTML = `
            <div class="error">
                Supabase is not connected yet.<br><br>
                Open this file and enter your Supabase URL and anon key
                in the two variables near the bottom.
            </div>`;
        return;
    }

    list.innerHTML = `<div class="loading">Loading accounts...</div>`;

    const { data, error } = await supabaseClient
        .from("loyalty_customers")
        .select("*")
        .order("name", { ascending:true });

    if(error){
        list.innerHTML = `
            <div class="error">
                Could not load loyalty accounts.<br><br>
                ${escapeHtml(error.message)}
            </div>`;
        return;
    }

    allCustomers = data || [];

    /*
        Purchase transactions are the source of truth for loyalty.
        This deliberately does not depend on points, visit_count or
        lifetime_spend stored in loyalty_customers because older rows
        may contain stale zero values.
    */
    if(allCustomers.length){

        const customerIds = allCustomers.map(customer => customer.id);

        const {
            data: transactions,
            error: transactionError
        } = await supabaseClient
            .from("loyalty_transactions")
            .select("customer_id, amount, points, type, created_at")
            .in("customer_id", customerIds)
            .eq("type", "purchase");

        if(transactionError){
            console.error(
                "Could not load loyalty transactions:",
                transactionError
            );
        }else{

            const purchasesByCustomer = {};

            (transactions || []).forEach(transaction => {

                if(!purchasesByCustomer[transaction.customer_id]){
                    purchasesByCustomer[transaction.customer_id] = [];
                }

                purchasesByCustomer[transaction.customer_id].push(transaction);
            });

            allCustomers.forEach(customer => {
                customer._purchases =
                    purchasesByCustomer[customer.id] || [];
            });
        }
    }

    renderCustomers(allCustomers);
}

function renderCustomers(customers){

    const list = document.getElementById("accountsList");

    if(!customers.length){
        list.innerHTML = `<div class="empty">No loyalty accounts found.</div>`;
        return;
    }

    list.innerHTML = customers.map(customer => {

        const name = customer.name || "Unnamed Customer";
        const phone = customer.phone || "No phone";

        const stats = calculateStats(customer._purchases || []);

        return `
            <button class="account"
                onclick="openCustomer('${escapeAttr(customer.id)}')">

                <div class="avatar">
                    ${escapeHtml(name.charAt(0).toUpperCase())}
                </div>

                <div class="account-info">
                    <div class="account-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="account-phone">
                        ${escapeHtml(phone)}
                    </div>
                </div>

                ${
                    customer.phone
                    ? `
                        <div class="account-actions">
                            <button
                                class="whatsapp-btn"
                                type="button"
                                onclick="event.stopPropagation(); sendLoyaltyWhatsApp('${escapeAttr(customer.phone)}','${escapeAttr(name)}',${stats.points})">
                                WhatsApp
                            </button>
                        </div>
                      `
                    : ""
                }

            </button>
        `;
    }).join("");
}

function filterAccounts(){

    const query =
        document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    const filtered = allCustomers.filter(customer => {

        const name = String(customer.name || "").toLowerCase();
        const phone = String(customer.phone || "").toLowerCase();

        return name.includes(query) || phone.includes(query);
    });

    renderCustomers(filtered);
}

async function openCustomer(id){

    showPage("customerPage");

    const content = document.getElementById("customerContent");
    content.innerHTML = `<div class="loading">Loading customer...</div>`;

    const customer = allCustomers.find(c => String(c.id) === String(id));

    if(!customer){
        content.innerHTML = `<div class="error">Customer not found.</div>`;
        return;
    }

    const { data: purchases, error } = await supabaseClient
        .from("loyalty_transactions")
        .select("*")
        .eq("customer_id", customer.id)
        .order("created_at", { ascending:false });

    if(error){
        content.innerHTML = `
            <div class="error">
                Could not load purchase history.<br><br>
                ${escapeHtml(error.message)}
            </div>`;
        return;
    }

    const name = customer.name || "Unnamed Customer";
    const phone = customer.phone || "No phone";

    const history = purchases || [];

    /*
        Calculate loyalty directly from purchase history.
        Rule: ₹50 spent = 1 point.
        Visits = number of purchase transactions.
        Lifetime spend = sum of purchase transaction amounts.
    */
    const stats = calculateStats(history);

    content.innerHTML = `
        <main class="profile">

            <div class="profile-card">
                <div class="big-avatar">
                    ${escapeHtml(name.charAt(0).toUpperCase())}
                </div>

                <div>
                    <div class="profile-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="profile-phone">
                        ${escapeHtml(phone)}
                    </div>
                </div>
            </div>

            <div class="stats">

                <div class="stat">
                    <div class="stat-label">LOYALTY POINTS</div>
                    <div class="stat-value">
                        ⭐ ${stats.points}
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">VISITS</div>
                    <div class="stat-value">
                        ${stats.visits}
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">LIFETIME SPEND</div>
                    <div class="stat-value">
                        ₹${stats.lifetimeSpend.toFixed(2)}
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">PURCHASES</div>
                    <div class="stat-value">
                        ${history.length}
                    </div>
                </div>

            </div>

            <div class="history-title">
                Purchase History
            </div>

            <div>
                ${
                    history.length
                    ? history.map(renderPurchase).join("")
                    : `<div class="empty">No purchase history.</div>`
                }
            </div>

        </main>
    `;
}

function renderPurchase(purchase){

    const date = new Date(purchase.created_at);

    const dateText = date.toLocaleDateString("en-IN", {
        day:"2-digit",
        month:"short",
        year:"numeric"
    });

    const timeText = date.toLocaleTimeString("en-IN", {
        hour:"2-digit",
        minute:"2-digit"
    });

    const amount = Number(purchase.amount || 0);
    const calculatedPoints = Math.floor(amount / 50);

    return `
        <div class="purchase">

            <div class="purchase-top">

                <div class="purchase-date">
                    ${dateText} • ${timeText}
                </div>

                <div class="purchase-total">
                    ₹${amount.toFixed(2)}
                </div>

            </div>

            <div class="items">
                ${formatDescription(purchase.description)}
            </div>

            <div class="points">
                +${calculatedPoints} points
            </div>

        </div>
    `;
}

function calculateStats(purchases){

    const history = Array.isArray(purchases)
        ? purchases
        : [];

    let lifetimeSpend = 0;
    let points = 0;

    history.forEach(purchase => {

        const amount =
            Number(purchase.amount || 0);

        lifetimeSpend += amount;

        /*
            Loyalty rule:
            ₹50 spent = 1 point.
        */
        points += Math.floor(amount / 50);
    });

    return {
        points: points,
        visits: history.length,
        lifetimeSpend: lifetimeSpend
    };
}


function sendLoyaltyWhatsApp(phone, name, points){

    let number =
        String(phone || "").replace(/\\D/g, "");

    if(number.startsWith("00")){
        number = number.substring(2);
    }

    if(number.length === 10){
        number = "91" + number;
    }

    const message =
        `Hi ${name}! 🎉 You currently have ${points} loyalty points with Chaatarra. Thank you for being our valued customer! ❤️`;

    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);

    window.open(url, "_blank");
}


function formatDescription(description){

    if(!description) return "Purchase";

    try{
        const parsed = JSON.parse(description);

        if(Array.isArray(parsed)){
            return parsed.map(item => {
                if(typeof item === "string"){
                    return escapeHtml(item);
                }

                const name = item.name || item.item || "Item";
                const qty = item.quantity || item.qty || 1;

                return `${escapeHtml(name)} × ${escapeHtml(qty)}`;
            }).join("<br>");
        }
    }catch(e){}

    return escapeHtml(String(description)).replace(/\n/g,"<br>");
}

function escapeHtml(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeAttr(value){
    return escapeHtml(value).replace(/`/g,"&#096;");
}

showPage("homePage");
</script>

</body>
</html>
