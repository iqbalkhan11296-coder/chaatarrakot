<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loyalty Admin</title>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js?v=4"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #faf7f0;

            color:
                #2b1a20;

        }


        button,
        input {

            font-family:
                inherit;

        }


        /* =========================================
           MAIN APP
        ========================================= */

        .app {

            min-height: 100vh;

        }


        /* =========================================
           HOME
        ========================================= */

        #homePage {

            min-height: 100vh;

        }


        .hero {

            background:
                linear-gradient(
                    135deg,
                    #300014,
                    #4b001f,
                    #650028
                );

            color: white;

            padding:
                50px 25px 45px;

            text-align: center;

            border-bottom:
                3px solid #d4af37;

        }


        .logo-mark {

            width: 68px;

            height: 68px;

            margin:
                0 auto 18px;

            border:
                2px solid #d4af37;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            color:
                #d4af37;

            font-size:
                30px;

            font-weight:
                bold;

        }


        .hero h1 {

            margin:
                0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                36px;

            letter-spacing:
                1px;

        }


        .hero p {

            margin:
                10px 0 0;

            color:
                #f3d77a;

            font-size:
                14px;

            letter-spacing:
                2px;

            text-transform:
                uppercase;

        }


        .hero-line {

            width:
                70px;

            height:
                2px;

            background:
                #d4af37;

            margin:
                22px auto 0;

        }


        .home-content {

            max-width:
                900px;

            margin:
                auto;

            padding:
                30px 18px 50px;

        }


        .welcome-card {

            background:
                white;

            border:
                1px solid #e5d7b0;

            border-radius:
                18px;

            padding:
                28px;

            text-align:
                center;

            box-shadow:
                0 10px 35px
                rgba(75, 0, 31, 0.08);

        }


        .welcome-card h2 {

            margin:
                0 0 8px;

            color:
                #4b001f;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                27px;

        }


        .welcome-card p {

            color:
                #75666b;

            margin:
                0 0 25px;

        }


        .data-button {

            width:
                100%;

            max-width:
                450px;

            padding:
                18px;

            border:
                1px solid #d4af37;

            border-radius:
                12px;

            background:
                #4b001f;

            color:
                #f3d77a;

            font-size:
                17px;

            font-weight:
                bold;

            cursor:
                pointer;

            transition:
                0.2s;

        }


        .data-button:hover {

            background:
                #650028;

            transform:
                translateY(-2px);

        }


        /* =========================================
           PAGES
        ========================================= */

        .page {

            display:
                none;

            min-height:
                100vh;

            background:
                #faf7f0;

        }


        .page.active {

            display:
                block;

        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {

            background:
                #4b001f;

            color:
                white;

            padding:
                18px;

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            border-bottom:
                2px solid #d4af37;

            position:
                sticky;

            top:
                0;

            z-index:
                10;

        }


        .back-button {

            width:
                42px;

            height:
                42px;

            border:
                1px solid #d4af37;

            border-radius:
                10px;

            background:
                transparent;

            color:
                #f3d77a;

            font-size:
                25px;

            cursor:
                pointer;

        }


        .page-header-text {

            flex:
                1;

        }


        .page-header h1 {

            margin:
                0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                24px;

        }


        .page-header p {

            margin:
                3px 0 0;

            color:
                #e9d99e;

            font-size:
                12px;

        }


        /* =========================================
           ACCOUNTS
        ========================================= */

        .accounts-container {

            max-width:
                900px;

            margin:
                auto;

            padding:
                20px;

        }


        .search-box {

            margin-bottom:
                18px;

        }


        .search-box input {

            width:
                100%;

            padding:
                15px 17px;

            border:
                1px solid #d8c9a0;

            border-radius:
                12px;

            background:
                white;

            font-size:
                16px;

            outline:
                none;

        }


        .search-box input:focus {

            border-color:
                #b28b20;

            box-shadow:
                0 0 0 3px
                rgba(212, 175, 55, 0.12);

        }


        #accountsList {

            display:
                flex;

            flex-direction:
                column;

            gap:
                10px;

        }


        .account {

            width:
                100%;

            display:
                flex;

            align-items:
                center;

            gap:
                15px;

            padding:
                16px;

            border:
                1px solid #e3d7ba;

            border-radius:
                14px;

            background:
                white;

            cursor:
                pointer;

            text-align:
                left;

            transition:
                0.2s;

        }


        .account:hover {

            border-color:
                #d4af37;

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 20px
                rgba(75, 0, 31, 0.08);

        }


        .avatar {

            width:
                48px;

            height:
                48px;

            flex-shrink:
                0;

            border-radius:
                50%;

            background:
                #4b001f;

            color:
                #f3d77a;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                20px;

            font-weight:
                bold;

            border:
                1px solid #d4af37;

        }


        .account-info {

            flex:
                1;

            min-width:
                0;

        }


        .account-name {

            color:
                #4b001f;

            font-size:
                17px;

            font-weight:
                bold;

            margin-bottom:
                4px;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

        }


        .account-phone {

            color:
                #817278;

            font-size:
                13px;

        }


        .account-arrow {

            color:
                #b28b20;

            font-size:
                28px;

        }


        /* =========================================
           CUSTOMER PROFILE
        ========================================= */

        .profile {

            max-width:
                900px;

            margin:
                auto;

            padding:
                20px;

        }


        .profile-card {

            background:
                linear-gradient(
                    135deg,
                    #4b001f,
                    #650028
                );

            border:
                1px solid #d4af37;

            border-radius:
                18px;

            padding:
                25px;

            display:
                flex;

            align-items:
                center;

            gap:
                18px;

            color:
                white;

            box-shadow:
                0 12px 30px
                rgba(75, 0, 31, 0.16);

        }


        .big-avatar {

            width:
                72px;

            height:
                72px;

            flex-shrink:
                0;

            border:
                2px solid #d4af37;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                #f3d77a;

            font-size:
                30px;

            font-weight:
                bold;

        }


        .profile-info {

            min-width:
                0;

        }


        .profile-name {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                27px;

            margin-bottom:
                7px;

        }


        .profile-phone {

            color:
                #eadca7;

            font-size:
                14px;

        }


        /* =========================================
           STATISTICS
        ========================================= */

        .stats {

            display:
                grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap:
                12px;

            margin:
                18px 0 30px;

        }


        .stat {

            background:
                white;

            border:
                1px solid #e3d7ba;

            border-radius:
                14px;

            padding:
                18px 12px;

            text-align:
                center;

            box-shadow:
                0 5px 18px
                rgba(75, 0, 31, 0.05);

        }


        .stat-label {

            color:
                #89777e;

            font-size:
                10px;

            font-weight:
                bold;

            letter-spacing:
                1px;

            margin-bottom:
                9px;

        }


        .stat-value {

            color:
                #4b001f;

            font-size:
                21px;

            font-weight:
                bold;

        }


        /* =========================================
           HISTORY
        ========================================= */

        .history-title {

            color:
                #4b001f;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                25px;

            font-weight:
                bold;

            margin:
                0 0 14px;

        }


        .purchase {

            background:
                white;

            border:
                1px solid #e3d7ba;

            border-radius:
                14px;

            padding:
                17px;

            margin-bottom:
                11px;

            box-shadow:
                0 5px 18px
                rgba(75, 0, 31, 0.04);

        }


        .purchase-top {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                10px;

            margin-bottom:
                12px;

        }


        .purchase-date {

            color:
                #88777c;

            font-size:
                12px;

        }


        .purchase-total {

            color:
                #4b001f;

            font-size:
                19px;

            font-weight:
                bold;

            white-space:
                nowrap;

        }


        .items {

            padding:
                11px 0;

            border-top:
                1px solid #eee5d3;

            border-bottom:
                1px solid #eee5d3;

            color:
                #44363b;

            font-size:
                14px;

            line-height:
                1.8;

        }


        .points {

            margin-top:
                10px;

            color:
                #a07b15;

            font-size:
                13px;

            font-weight:
                bold;

        }


        /* =========================================
           STATES
        ========================================= */

        .loading,
        .empty,
        .error {

            background:
                white;

            border:
                1px solid #e3d7ba;

            border-radius:
                14px;

            padding:
                30px 20px;

            text-align:
                center;

            color:
                #776a70;

        }


        .error {

            color:
                #a00020;

            border-color:
                #e3a9b7;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (
            max-width: 700px
        ){

            .hero {

                padding:
                    38px 20px 35px;

            }


            .hero h1 {

                font-size:
                    30px;

            }


            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .profile-card {

                padding:
                    20px;

            }


            .big-avatar {

                width:
                    60px;

                height:
                    60px;

                font-size:
                    25px;

            }


            .profile-name {

                font-size:
                    23px;

            }

        }


        @media (
            max-width: 420px
        ){

            .stats {

                gap:
                    8px;

            }


            .stat {

                padding:
                    15px 8px;

            }


            .stat-value {

                font-size:
                    18px;

            }


            .stat-label {

                font-size:
                    9px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =================================================
         HOME PAGE
    ================================================== -->

    <section id="homePage">


        <div class="hero">


            <div class="logo-mark">

                ★

            </div>


            <h1>

                Loyalty Admin

            </h1>


            <p>

                Customer Loyalty

            </p>


            <div class="hero-line"></div>


        </div>


        <div class="home-content">


            <div class="welcome-card">


                <h2>

                    Customer Loyalty

                </h2>


                <p>

                    Manage customer accounts,
                    purchases and loyalty points.

                </p>


                <button
                    class="data-button"
                    onclick="openAccounts()"
                >

                    VIEW CUSTOMER ACCOUNTS

                </button>


            </div>


        </div>


    </section>



    <!-- =================================================
         ACCOUNTS PAGE
    ================================================== -->

    <section
        id="accountsPage"
        class="page"
    >


        <div class="page-header">


            <button
                class="back-button"
                onclick="showPage('homePage')"
            >

                ‹

            </button>


            <div class="page-header-text">


                <h1>

                    Customer Accounts

                </h1>


                <p>

                    Loyalty customer database

                </p>


            </div>


        </div>


        <div class="accounts-container">


            <div class="search-box">


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name or phone..."
                    oninput="filterAccounts()"
                >


            </div>


            <div id="accountsList">


                <div class="loading">

                    Loading accounts...

                </div>


            </div>


        </div>


    </section>



    <!-- =================================================
         CUSTOMER PAGE
    ================================================== -->

    <section
        id="customerPage"
        class="page"
    >


        <div class="page-header">


            <button
                class="back-button"
                onclick="openAccounts()"
            >

                ‹

            </button>


            <div class="page-header-text">


                <h1>

                    Customer Profile

                </h1>


                <p>

                    Loyalty account details

                </p>


            </div>


        </div>


        <div id="customerContent">


            <div class="loading">

                Loading customer...

            </div>


        </div>


    </section>


</div>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>


/* =========================================================
   SUPABASE CHECK
========================================================= */

if (
    typeof supabaseClient === "undefined"
    ||
    !supabaseClient
) {

    console.error(
        "Supabase client is not available. Check supabase.js."
    );

}


/* =========================================================
   GLOBAL CUSTOMER DATA
========================================================= */

let allCustomers = [];


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function showPage(id) {


    document
        .querySelectorAll(".app > section")
        .forEach(section => {

            section.style.display = "none";

            section.classList.remove(
                "active"
            );

        });


    const page =
        document.getElementById(id);


    if (!page) {

        return;

    }


    page.style.display = "block";


    if (id !== "homePage") {

        page.classList.add(
            "active"
        );

    }

}


/* =========================================================
   OPEN ACCOUNTS
========================================================= */

function openAccounts() {


    showPage(
        "accountsPage"
    );


    loadCustomers();

}


/* =========================================================
   LOAD CUSTOMERS
========================================================= */

async function loadCustomers() {


    const list =
        document.getElementById(
            "accountsList"
        );


    if (
        typeof supabaseClient === "undefined"
        ||
        !supabaseClient
    ) {

        list.innerHTML = `

            <div class="error">

                Supabase is not connected.

                <br><br>

                Please check supabase.js.

            </div>

        `;

        return;

    }


    list.innerHTML = `

        <div class="loading">

            Loading accounts...

        </div>

    `;


    const {
        data,
        error
    } =
        await supabaseClient

            .from(
                "loyalty_customers"
            )

            .select("*")

            .order(
                "name",
                {
                    ascending: true
                }
            );


    if (error) {


        console.error(
            "Customer loading error:",
            error
        );


        list.innerHTML = `

            <div class="error">

                Could not load customer accounts.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    allCustomers =
        data || [];


    renderCustomers(
        allCustomers
    );

}


/* =========================================================
   RENDER CUSTOMER LIST
========================================================= */

function renderCustomers(
    customers
) {


    const list =
        document.getElementById(
            "accountsList"
        );


    if (!customers.length) {


        list.innerHTML = `

            <div class="empty">

                No loyalty accounts found.

            </div>

        `;

        return;

    }


    list.innerHTML =

        customers
            .map(customer => {


                const name =
                    customer.name
                    ||
                    "Unnamed Customer";


                const phone =
                    customer.phone
                    ||
                    "No phone number";


                return `

                    <button
                        class="account"
                        onclick="
                            openCustomer(
                                '${escapeAttr(customer.id)}'
                            )
                        "
                    >


                        <div class="avatar">

                            ${escapeHtml(
                                name
                                    .charAt(0)
                                    .toUpperCase()
                            )}

                        </div>


                        <div class="account-info">


                            <div class="account-name">

                                ${escapeHtml(
                                    name
                                )}

                            </div>


                            <div class="account-phone">

                                ${escapeHtml(
                                    phone
                                )}

                            </div>


                        </div>


                        <div class="account-arrow">

                            ›

                        </div>


                    </button>

                `;


            })
            .join("");

}


/* =========================================================
   SEARCH
========================================================= */

function filterAccounts() {


    const input =
        document.getElementById(
            "searchInput"
        );


    const query =
        input
            .value
            .trim()
            .toLowerCase();


    const filtered =
        allCustomers.filter(
            customer => {


                const name =
                    String(
                        customer.name
                        ||
                        ""
                    )
                    .toLowerCase();


                const phone =
                    String(
                        customer.phone
                        ||
                        ""
                    )
                    .toLowerCase();


                return (

                    name.includes(
                        query
                    )

                    ||

                    phone.includes(
                        query
                    )

                );

            }
        );


    renderCustomers(
        filtered
    );

}


/* =========================================================
   OPEN CUSTOMER
========================================================= */

async function openCustomer(
    id
) {


    showPage(
        "customerPage"
    );


    const content =
        document.getElementById(
            "customerContent"
        );


    content.innerHTML = `

        <div class="profile">

            <div class="loading">

                Loading customer...

            </div>

        </div>

    `;


    const customer =
        allCustomers.find(
            c =>
                String(c.id)
                ===
                String(id)
        );


    if (!customer) {


        content.innerHTML = `

            <div class="profile">

                <div class="error">

                    Customer not found.

                </div>

            </div>

        `;

        return;

    }


    /* =====================================================
       LOAD ALL PURCHASES
    ===================================================== */

    const {
        data: purchases,
        error
    } =
        await supabaseClient

            .from(
                "loyalty_transactions"
            )

            .select("*")

            .eq(
                "customer_id",
                customer.id
            )

            .eq(
                "type",
                "purchase"
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {


        console.error(
            "Purchase history error:",
            error
        );


        content.innerHTML = `

            <div class="profile">

                <div class="error">

                    Could not load purchase history.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            </div>

        `;

        return;

    }


    const history =
        purchases || [];


    /* =====================================================
       CALCULATE LOYALTY VALUES FROM TRANSACTIONS

       ₹50 = 1 point
       1 purchase = 1 visit
       Lifetime spend = sum of purchases
    ===================================================== */

    let lifetimeSpend = 0;

    let totalPoints = 0;

    let visits = 0;


    history.forEach(
        purchase => {


            const amount =
                Number(
                    purchase.amount
                    ||
                    0
                );


            lifetimeSpend +=
                amount;


            totalPoints +=
                Math.floor(
                    amount / 50
                );


            visits++;


        }
    );


    const name =
        customer.name
        ||
        "Unnamed Customer";


    const phone =
        customer.phone
        ||
        "No phone number";


    /* =====================================================
       DISPLAY CUSTOMER
    ===================================================== */

    content.innerHTML = `

        <div class="profile">


            <!-- CUSTOMER -->

            <div class="profile-card">


                <div class="big-avatar">

                    ${escapeHtml(
                        name
                            .charAt(0)
                            .toUpperCase()
                    )}

                </div>


                <div class="profile-info">


                    <div class="profile-name">

                        ${escapeHtml(
                            name
                        )}

                    </div>


                    <div class="profile-phone">

                        ${escapeHtml(
                            phone
                        )}

                    </div>


                </div>


            </div>



            <!-- STATISTICS -->

            <div class="stats">


                <div class="stat">


                    <div class="stat-label">

                        LOYALTY POINTS

                    </div>


                    <div class="stat-value">

                        ⭐ ${totalPoints}

                    </div>


                </div>



                <div class="stat">


                    <div class="stat-label">

                        VISITS

                    </div>


                    <div class="stat-value">

                        ${visits}

                    </div>


                </div>



                <div class="stat">


                    <div class="stat-label">

                        LIFETIME SPEND

                    </div>


                    <div class="stat-value">

                        ₹${lifetimeSpend.toFixed(2)}

                    </div>


                </div>



                <div class="stat">


                    <div class="stat-label">

                        PURCHASES

                    </div>


                    <div class="stat-value">

                        ${history.length}

                    </div>


                </div>


            </div>



            <!-- PURCHASE HISTORY -->

            <div class="history-title">

                Purchase History

            </div>


            <div>


                ${
                    history.length > 0

                    ?

                    history
                        .map(
                            renderPurchase
                        )
                        .join("")

                    :

                    `

                        <div class="empty">

                            No purchase history.

                        </div>

                    `

                }


            </div>


        </div>

    `;

}


/* =========================================================
   PURCHASE CARD
========================================================= */

function renderPurchase(
    purchase
) {


    const date =
        new Date(
            purchase.created_at
        );


    const dateText =
        date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );


    const timeText =
        date.toLocaleTimeString(
            "en-IN",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    const amount =
        Number(
            purchase.amount
            ||
            0
        );


    const points =
        Math.floor(
            amount / 50
        );


    return `

        <div class="purchase">


            <div class="purchase-top">


                <div class="purchase-date">

                    ${dateText}

                    •

                    ${timeText}

                </div>


                <div class="purchase-total">

                    ₹${amount.toFixed(2)}

                </div>


            </div>


            <div class="items">

                ${formatDescription(
                    purchase.description
                )}

            </div>


            <div class="points">

                +${points} points

            </div>


        </div>

    `;

}


/* =========================================================
   FORMAT PURCHASE DESCRIPTION
========================================================= */

function formatDescription(
    description
) {


    if (!description) {

        return "Purchase";

    }


    try {


        const parsed =
            JSON.parse(
                description
            );


        if (
            Array.isArray(parsed)
        ) {


            return parsed
                .map(item => {


                    if (
                        typeof item
                        ===
                        "string"
                    ) {

                        return escapeHtml(
                            item
                        );

                    }


                    const itemName =
                        item.name
                        ||
                        item.item
                        ||
                        "Item";


                    const quantity =
                        item.quantity
                        ||
                        item.qty
                        ||
                        1;


                    return `

                        ${escapeHtml(
                            itemName
                        )}

                        ×

                        ${escapeHtml(
                            quantity
                        )}

                    `;


                })
                .join(
                    "<br>"
                );

        }


    } catch (error) {


        console.warn(
            "Could not parse purchase description:",
            error
        );


    }


    return escapeHtml(
        String(
            description
        )
    )
    .replace(
        /\n/g,
        "<br>"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttr(
    value
) {


    return escapeHtml(
        value
    )
    .replace(
        /`/g,
        "&#096;"
    );

}
