<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chaatarra Sales</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

header {
    background: #4b001f;
    color: #FFD700;
    text-align: center;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 2px;
}

header p {
    margin: 6px 0 0;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.controls {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;

    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: end;
}

.controls div {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

label {
    font-size: 13px;
    font-weight: bold;
}

input,
select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    background: #4b001f;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.card h3 {
    margin: 0;
    color: #777;
    font-size: 14px;
}

.value {
    margin-top: 8px;
    color: #4b001f;
    font-size: 27px;
    font-weight: bold;
}

.counter-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.counter-card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
}

.counter-card h3 {
    margin: 0 0 8px;
    color: #4b001f;
}

.counter-card div {
    font-size: 22px;
    font-weight: bold;
}

.section {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    overflow-x: auto;
}

.section h2 {
    margin-top: 0;
    color: #4b001f;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

th {
    background: #4b001f;
    color: white;
    padding: 11px;
    text-align: left;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.right {
    text-align: right;
}

.total-row {
    font-weight: bold;
    background: #fff4f7;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #777;
}

.error {
    display: none;
    background: #ffe5e5;
    color: #a00000;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
    white-space: pre-wrap;
}

@media(max-width:700px) {

    .summary,
    .counter-grid {
        grid-template-columns: 1fr;
    }

    .controls {
        flex-direction: column;
        align-items: stretch;
    }

    .controls div,
    .controls input,
    .controls select,
    .controls button {
        width: 100%;
    }

}

@media print {

    .controls {
        display: none;
    }

    body {
        background: white;
    }

}

</style>
</head>

<body>

<header>

    <h1>CHAATARRA</h1>

    <p>SALES REPORT</p>

</header>


<div class="container">


<div id="errorBox" class="error"></div>


<!-- FILTER -->

<div class="controls">

    <div>

        <label>FROM</label>

        <input
            type="date"
            id="fromDate">

    </div>


    <div>

        <label>TO</label>

        <input
            type="date"
            id="toDate">

    </div>


    <div>

        <label>COUNTER</label>

        <select id="counterFilter">

            <option value="all">
                All Counters
            </option>

            <option value="chaats">
                Chaats
            </option>

            <option value="drinks">
                Drinks
            </option>

            <option value="burgers">
                Burgers
            </option>

        </select>

    </div>


    <button onclick="loadSales()">
        REFRESH
    </button>


    <button onclick="window.print()">
        PRINT
    </button>

</div>


<!-- TOTALS -->

<div class="summary">

    <div class="card">

        <h3>TOTAL SALES</h3>

        <div
            class="value"
            id="totalSales">

            ₹0

        </div>

    </div>


    <div class="card">

        <h3>ITEMS SOLD</h3>

        <div
            class="value"
            id="totalItems">

            0

        </div>

    </div>


    <div class="card">

        <h3>KOTs</h3>

        <div
            class="value"
            id="totalKots">

            0

        </div>

    </div>

</div>


<!-- COUNTER TOTALS -->

<div class="counter-grid">

    <div class="counter-card">

        <h3>CHAATS</h3>

        <div id="chaatTotal">
            ₹0
        </div>

    </div>


    <div class="counter-card">

        <h3>DRINKS</h3>

        <div id="drinkTotal">
            ₹0
        </div>

    </div>


    <div class="counter-card">

        <h3>BURGERS</h3>

        <div id="burgerTotal">
            ₹0
        </div>

    </div>

</div>


<!-- ITEM SALES -->

<div class="section">

    <h2>ITEMS SOLD</h2>


    <div
        id="itemLoading"
        class="loading">

        Loading sales...

    </div>


    <table
        id="itemTable"
        style="display:none;">

        <thead>

        <tr>

            <th>ITEM</th>

            <th>COUNTER</th>

            <th class="right">
                QTY
            </th>

            <th class="right">
                PRICE
            </th>

            <th class="right">
                TOTAL
            </th>

        </tr>

        </thead>


        <tbody id="itemBody"></tbody>

    </table>

</div>


<!-- KOT LIST -->

<div class="section">

    <h2>ALL KOTs</h2>


    <div
        id="kotLoading"
        class="loading">

        Loading KOTs...

    </div>


    <table
        id="kotTable"
        style="display:none;">

        <thead>

        <tr>

            <th>ID</th>

            <th>ORDER ID</th>

            <th>COUNTER</th>

            <th>ITEMS</th>

            <th>STATUS</th>

            <th>TIME</th>

        </tr>

        </thead>


        <tbody id="kotBody"></tbody>

    </table>

</div>


</div>


<script>

/*
====================================================
IMPORTANT
====================================================

Your supabase.js creates:

const supabase = ...

Therefore we use:

supabase.from(...)

NOT:

supabaseClient.from(...)
====================================================
*/


function todayIndia() {

    return new Date()
        .toLocaleDateString(
            "en-CA",
            {
                timeZone: "Asia/Kolkata"
            }
        );

}


document.getElementById("fromDate").value =
    todayIndia();

document.getElementById("toDate").value =
    todayIndia();


/*
====================================================
LOAD SALES
====================================================
*/

async function loadSales() {

    const errorBox =
        document.getElementById("errorBox");


    errorBox.style.display =
        "none";


    document.getElementById(
        "itemLoading"
    ).style.display = "block";


    document.getElementById(
        "kotLoading"
    ).style.display = "block";


    try {

        /*
        GET COUNTER KOTs
        */

        const result =
            await supabase
                .from("counter_kot")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        const kots = result.data;

        const error = result.error;


        if (error) {

            throw error;

        }


        console.log(
            "COUNTER KOT DATA:",
            kots
        );


        /*
        FILTER
        */

        const from =
            document.getElementById(
                "fromDate"
            ).value;


        const to =
            document.getElementById(
                "toDate"
            ).value;


        const selectedCounter =
            document.getElementById(
                "counterFilter"
            ).value;


        let filtered =
            kots || [];


        if (from) {

            filtered =
                filtered.filter(kot => {

                    const date =
                        new Date(
                            kot.created_at
                        )
                        .toLocaleDateString(
                            "en-CA",
                            {
                                timeZone:
                                    "Asia/Kolkata"
                            }
                        );


                    return date >= from;

                });

        }


        if (to) {

            filtered =
                filtered.filter(kot => {

                    const date =
                        new Date(
                            kot.created_at
                        )
                        .toLocaleDateString(
                            "en-CA",
                            {
                                timeZone:
                                    "Asia/Kolkata"
                            }
                        );


                    return date <= to;

                });

        }


        if (
            selectedCounter !== "all"
        ) {

            filtered =
                filtered.filter(kot => {

                    return String(
                        kot.counter
                    ).toLowerCase() ===
                    selectedCounter;

                });

        }


        /*
        ITEM SUMMARY
        */

        const items = {};


        let totalSales = 0;

        let totalItems = 0;


        let chaats = 0;

        let drinks = 0;

        let burgers = 0;


        filtered.forEach(kot => {

            let kotItems =
                kot.items;


            /*
            Convert JSON string
            if necessary.
            */

            if (
                typeof kotItems ===
                "string"
            ) {

                try {

                    kotItems =
                        JSON.parse(
                            kotItems
                        );

                }

                catch(e) {

                    console.error(
                        "Bad items JSON:",
                        kotItems
                    );

                    kotItems = [];

                }

            }


            if (
                !Array.isArray(kotItems)
            ) {

                console.warn(
                    "Items is not array:",
                    kotItems
                );

                return;

            }


            kotItems.forEach(item => {

                const name =
                    item.name ||
                    item.item ||
                    item.title ||
                    "Unknown";


                const price =
                    Number(
                        item.price || 0
                    );


                const quantity =
                    Number(
                        item.quantity ||
                        item.qty ||
                        1
                    );


                const counter =
                    item.counter ||
                    kot.counter ||
                    "unknown";


                const amount =
                    price * quantity;


                const key =
                    name + "|" + counter;


                if (!items[key]) {

                    items[key] = {

                        name:
                            name,

                        counter:
                            counter,

                        price:
                            price,

                        quantity:
                            0,

                        total:
                            0

                    };

                }


                items[key].quantity +=
                    quantity;


                items[key].total +=
                    amount;


                totalItems +=
                    quantity;


                totalSales +=
                    amount;


                if (
                    counter ===
                    "chaats"
                ) {

                    chaats += amount;

                }


                if (
                    counter ===
                    "drinks"
                ) {

                    drinks += amount;

                }


                if (
                    counter ===
                    "burgers"
                ) {

                    burgers += amount;

                }

            });

        });


        /*
        SUMMARY
        */

        document.getElementById(
            "totalSales"
        ).innerText =
            "₹" +
            totalSales.toFixed(2);


        document.getElementById(
            "totalItems"
        ).innerText =
            totalItems;


        document.getElementById(
            "totalKots"
        ).innerText =
            filtered.length;


        document.getElementById(
            "chaatTotal"
        ).innerText =
            "₹" +
            chaats.toFixed(2);


        document.getElementById(
            "drinkTotal"
        ).innerText =
            "₹" +
            drinks.toFixed(2);


        document.getElementById(
            "burgerTotal"
        ).innerText =
            "₹" +
            burgers.toFixed(2);


        /*
        ITEM TABLE
        */

        const body =
            document.getElementById(
                "itemBody"
            );


        body.innerHTML = "";


        const sorted =
            Object.values(items)
                .sort(
                    (a,b) =>
                        b.total -
                        a.total
                );


        sorted.forEach(item => {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.name
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.counter
                    )}
                </td>

                <td class="right">
                    ${item.quantity}
                </td>

                <td class="right">
                    ₹${item.price.toFixed(2)}
                </td>

                <td class="right">
                    ₹${item.total.toFixed(2)}
                </td>

            `;


            body.appendChild(row);

        });


        /*
        TOTAL ROW
        */

        const totalRow =
            document.createElement(
                "tr"
            );


        totalRow.className =
            "total-row";


        totalRow.innerHTML = `

            <td>
                TOTAL
            </td>

            <td></td>

            <td class="right">
                ${totalItems}
            </td>

            <td></td>

            <td class="right">
                ₹${totalSales.toFixed(2)}
            </td>

        `;


        body.appendChild(
            totalRow
        );


        document.getElementById(
            "itemLoading"
        ).style.display =
            "none";


        document.getElementById(
            "itemTable"
        ).style.display =
            "table";


        /*
        KOT TABLE
        */

        const kotBody =
            document.getElementById(
                "kotBody"
            );


        kotBody.innerHTML = "";


        filtered.forEach(kot => {

            let kotItems =
                kot.items;


            if (
                typeof kotItems ===
                "string"
            ) {

                try {

                    kotItems =
                        JSON.parse(
                            kotItems
                        );

                }

                catch(e) {

                    kotItems = [];

                }

            }


            let text = "";


            if (
                Array.isArray(kotItems)
            ) {

                text =
                    kotItems
                        .map(item => {

                            const name =
                                item.name ||
                                item.item ||
                                item.title ||
                                "Unknown";


                            const qty =
                                item.quantity ||
                                item.qty ||
                                1;


                            return (
                                escapeHtml(
                                    name
                                ) +
                                " × " +
                                qty
                            );

                        })
                        .join("<br>");

            }


            const time =
                new Date(
                    kot.created_at
                )
                .toLocaleString(
                    "en-IN",
                    {
                        timeZone:
                            "Asia/Kolkata"
                    }
                );


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        String(
                            kot.id ||
                            "-"
                        )
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        String(
                            kot.order_id ||
                            "-"
                        )
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        kot.counter ||
                        "-"
                    )}
                </td>

                <td>
                    ${text || "-"}
                </td>

                <td>
                    ${escapeHtml(
                        kot.status ||
                        "-"
                    )}
                </td>

                <td>
                    ${time}
                </td>

            `;


            kotBody.appendChild(
                row
            );

        });


        document.getElementById(
            "kotLoading"
        ).style.display =
            "none";


        document.getElementById(
            "kotTable"
        ).style.display =
            "table";

    }


    catch(error) {

        console.error(
            "SALES PAGE ERROR:",
            error
        );


        errorBox.innerText =
            "SALES ERROR:\n\n" +
            error.message;


        errorBox.style.display =
            "block";


        document.getElementById(
            "itemLoading"
        ).style.display =
            "none";


        document.getElementById(
            "kotLoading"
        ).style.display =
            "none";

    }

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )
