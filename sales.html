<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chaatarra Sales</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #4b001f;
    color: #FFD700;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 2px;
}

header p {
    margin: 6px 0 0;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

/* FILTER */

.filter {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: end;
}

.filter div {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

label {
    font-weight: bold;
    font-size: 13px;
}

input,
select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    background: #4b001f;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

/* SUMMARY */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

.card h3 {
    margin: 0;
    color: #777;
    font-size: 14px;
}

.value {
    margin-top: 8px;
    color: #4b001f;
    font-size: 27px;
    font-weight: bold;
}

/* COUNTER SUMMARY */

.counter-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.counter-card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
}

.counter-card h3 {
    margin: 0 0 8px;
    color: #4b001f;
}

.counter-card div {
    font-size: 22px;
    font-weight: bold;
}

/* SECTION */

.section {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    overflow-x: auto;
}

.section h2 {
    margin-top: 0;
    color: #4b001f;
}

/* TABLE */

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 550px;
}

th {
    background: #4b001f;
    color: white;
    padding: 11px;
    text-align: left;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.right {
    text-align: right;
}

.total-row {
    font-weight: bold;
    background: #fff4f7;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #777;
}

.error {
    display: none;
    background: #ffe5e5;
    color: #a00000;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
    white-space: pre-wrap;
}

/* MOBILE */

@media(max-width:700px) {

    .summary,
    .counter-grid {
        grid-template-columns: 1fr;
    }

    .filter {
        flex-direction: column;
        align-items: stretch;
    }

    .filter div,
    .filter input,
    .filter select,
    .filter button {
        width: 100%;
    }

}

@media print {

    .filter {
        display: none;
    }

    body {
        background: white;
    }

    header {
        color: black;
        background: white;
    }

}

</style>
</head>

<body>

<header>

    <h1>CHAATARRA</h1>
    <p>SALES REPORT</p>

</header>


<div class="container">

    <div id="errorBox" class="error"></div>


    <!-- FILTER -->

    <div class="filter">

        <div>
            <label>FROM</label>
            <input type="date" id="fromDate">
        </div>

        <div>
            <label>TO</label>
            <input type="date" id="toDate">
        </div>

        <div>
            <label>COUNTER</label>

            <select id="counterFilter">

                <option value="all">All Counters</option>

                <option value="chaats">Chaats</option>

                <option value="drinks">Drinks</option>

                <option value="burgers">Burgers</option>

            </select>

        </div>

        <button onclick="loadSales()">
            REFRESH
        </button>

        <button onclick="window.print()">
            PRINT
        </button>

    </div>


    <!-- MAIN SUMMARY -->

    <div class="summary">

        <div class="card">

            <h3>TOTAL SALES</h3>

            <div
                class="value"
                id="totalSales">
                ₹0
            </div>

        </div>


        <div class="card">

            <h3>ITEMS SOLD</h3>

            <div
                class="value"
                id="totalItems">
                0
            </div>

        </div>


        <div class="card">

            <h3>KOTs</h3>

            <div
                class="value"
                id="totalKots">
                0
            </div>

        </div>

    </div>


    <!-- COUNTERS -->

    <div class="counter-grid">

        <div class="counter-card">

            <h3>CHAATS</h3>

            <div id="chaatTotal">
                ₹0
            </div>

        </div>


        <div class="counter-card">

            <h3>DRINKS</h3>

            <div id="drinkTotal">
                ₹0
            </div>

        </div>


        <div class="counter-card">

            <h3>BURGERS</h3>

            <div id="burgerTotal">
                ₹0
            </div>

        </div>

    </div>


    <!-- ITEM SALES -->

    <div class="section">

        <h2>ITEMS SOLD</h2>

        <div
            id="itemLoading"
            class="loading">

            Loading sales...

        </div>


        <table
            id="itemTable"
            style="display:none;">

            <thead>

                <tr>

                    <th>ITEM</th>

                    <th>COUNTER</th>

                    <th class="right">
                        QTY
                    </th>

                    <th class="right">
                        PRICE
                    </th>

                    <th class="right">
                        TOTAL
                    </th>

                </tr>

            </thead>

            <tbody id="itemBody"></tbody>

        </table>

    </div>


    <!-- INDIVIDUAL KOTS -->

    <div class="section">

        <h2>ORDER / KOT DETAILS</h2>

        <div
            id="kotLoading"
            class="loading">

            Loading KOTs...

        </div>


        <table
            id="kotTable"
            style="display:none;">

            <thead>

                <tr>

                    <th>KOT ID</th>

                    <th>ORDER ID</th>

                    <th>COUNTER</th>

                    <th>ITEMS</th>

                    <th>STATUS</th>

                    <th>TIME</th>

                </tr>

            </thead>

            <tbody id="kotBody"></tbody>

        </table>

    </div>

</div>


<script>

/*
====================================================
CHECK SUPABASE
====================================================
*/

if (typeof supabaseClient === "undefined") {

    document.getElementById("errorBox").style.display =
        "block";

    document.getElementById("errorBox").innerText =
        "Supabase connection was not loaded.\n\n" +
        "Make sure supabase.js is in the same folder as sales.html.";

}


/*
====================================================
DATE
====================================================
*/

function todayIndia() {

    return new Date().toLocaleDateString(
        "en-CA",
        {
            timeZone: "Asia/Kolkata"
        }
    );

}


document.getElementById("fromDate").value =
    todayIndia();

document.getElementById("toDate").value =
    todayIndia();


/*
====================================================
LOAD SALES
====================================================
*/

async function loadSales() {

    const errorBox =
        document.getElementById("errorBox");

    errorBox.style.display = "none";


    document.getElementById("itemLoading")
        .style.display = "block";

    document.getElementById("kotLoading")
        .style.display = "block";


    document.getElementById("itemTable")
        .style.display = "none";

    document.getElementById("kotTable")
        .style.display = "none";


    try {

        /*
        ================================================
        GET counter KOT DATA
        ================================================
        */

        const { data, error } =
            await supabaseClient

                .from("counter_kot")

                .select("*")

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }


        let kots = data || [];


        /*
        ================================================
        DATE FILTER
        ================================================
        */

        const from =
            document.getElementById("fromDate").value;

        const to =
            document.getElementById("toDate").value;


        if (from) {

            kots = kots.filter(kot => {

                const date =
                    new Date(kot.created_at)
                    .toLocaleDateString(
                        "en-CA",
                        {
                            timeZone:
                                "Asia/Kolkata"
                        }
                    );

                return date >= from;

            });

        }


        if (to) {

            kots = kots.filter(kot => {

                const date =
                    new Date(kot.created_at)
                    .toLocaleDateString(
                        "en-CA",
                        {
                            timeZone:
                                "Asia/Kolkata"
                        }
                    );

                return date <= to;

            });

        }


        /*
        ================================================
        COUNTER FILTER
        ================================================
        */

        const counterFilter =
            document.getElementById(
                "counterFilter"
            ).value;


        if (counterFilter !== "all") {

            kots = kots.filter(kot => {

                return String(
                    kot.counter
                ).toLowerCase() ===
                counterFilter;

            });

        }


        /*
        ================================================
        VARIABLES
        ================================================
        */

        const itemSummary = {};

        let totalSales = 0;

        let totalItems = 0;

        let chaatTotal = 0;

        let drinkTotal = 0;

        let burgerTotal = 0;


        /*
        ================================================
        PROCESS EVERY KOT
        ================================================
        */

        kots.forEach(kot => {

            let items = kot.items;


            /*
            JSONB may already be an object.
            If it is a string, convert it.
            */

            if (typeof items === "string") {

                try {

                    items =
                        JSON.parse(items);

                }

                catch(e) {

                    items = [];

                }

            }


            /*
            Items should normally be an array.
            */

            if (!Array.isArray(items)) {

                return;

            }


            items.forEach(item => {

                const name =
                    item.name ||
                    item.item ||
                    item.title ||
                    "Unknown Item";


                const price =
                    Number(
                        item.price || 0
                    );


                const quantity =
                    Number(
                        item.quantity ||
                        item.qty ||
                        1
                    );


                const counter =
                    item.counter ||
                    kot.counter ||
                    "unknown";


                const lineTotal =
                    price * quantity;


                /*
                ITEM KEY

                Same item at different counters
                stays separate.
                */

                const key =
                    name + "|" + counter;


                if (!itemSummary[key]) {

                    itemSummary[key] = {

                        name: name,

                        counter: counter,

                        price: price,

                        quantity: 0,

                        total: 0

                    };

                }


                itemSummary[key].quantity +=
                    quantity;


                itemSummary[key].total +=
                    lineTotal;


                totalItems +=
                    quantity;


                totalSales +=
                    lineTotal;


                /*
                COUNTER TOTALS
                */

                if (counter === "chaats") {

                    chaatTotal +=
                        lineTotal;

                }

                else if (counter === "drinks") {

                    drinkTotal +=
                        lineTotal;

                }

                else if (counter === "burgers") {

                    burgerTotal +=
                        lineTotal;

                }

            });

        });


        /*
        ================================================
        SUMMARY
        ================================================
        */

        document.getElementById(
            "totalSales"
        ).innerText =
            "₹" + totalSales.toFixed(2);


        document.getElementById(
            "totalItems"
        ).innerText =
            totalItems;


        document.getElementById(
            "totalKots"
        ).innerText =
            kots.length;


        document.getElementById(
            "chaatTotal"
        ).innerText =
            "₹" + chaatTotal.toFixed(2);


        document.getElementById(
            "drinkTotal"
        ).innerText =
            "₹" + drinkTotal.toFixed(2);


        document.getElementById(
            "burgerTotal"
        ).innerText =
            "₹" + burgerTotal.toFixed(2);


        /*
        ================================================
        ITEM TABLE
        ================================================
        */

        const itemBody =
            document.getElementById(
                "itemBody"
            );


        itemBody.innerHTML = "";


        const sortedItems =
            Object.values(itemSummary)
            .sort(
                (a,b) =>
                    b.total - a.total
            );


        sortedItems.forEach(item => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.name
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.counter
                    )}
                </td>

                <td class="right">
                    ${item.quantity}
                </td>

                <td class="right">
                    ₹${item.price.toFixed(2)}
                </td>

                <td class="right">
                    ₹${item.total.toFixed(2)}
                </td>

            `;


            itemBody.appendChild(row);

        });


        /*
        TOTAL ROW
        */

        const totalRow =
            document.createElement("tr");


        totalRow.className =
            "total-row";


        totalRow.innerHTML = `

            <td>TOTAL</td>

            <td></td>

            <td class="right">
                ${totalItems}
            </td>

            <td></td>

            <td class="right">
                ₹${totalSales.toFixed(2)}
            </td>

        `;


        itemBody.appendChild(
            totalRow
        );


        document.getElementById(
            "itemLoading"
        ).style.display = "none";


        document.getElementById(
            "itemTable"
        ).style.display = "table";


        /*
        ================================================
        KOT TABLE
        ================================================
        */

        const kotBody =
            document.getElementById(
                "kotBody"
            );


        kotBody.innerHTML = "";


        kots.forEach(kot => {

            let items = kot.items;


            if (typeof items === "string") {

                try {

                    items =
                        JSON.parse(items);

                }

                catch(e) {

                    items = [];

                }

            }


            let itemText = "";


            if (Array.isArray(items)) {

                itemText =
                    items.map(item => {

                        const name =
                            item.name ||
                            item.item ||
                            item.title ||
                            "Unknown";


                        const qty =
                            item.quantity ||
                            item.qty ||
                            1;


                        return (
                            escapeHtml(name) +
                            " × " +
                            qty
                        );

                    }).join("<br>");

            }


            const time =
                new Date(kot.created_at)
                .toLocaleString(
                    "en-IN",
                    {
                        timeZone:
                            "Asia/Kolkata"
                    }
                );


            const status =
                kot.status || "Pending";


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        String(kot.id || "-")
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        String(
                            kot.order_id || "-"
                        )
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        kot.counter || "-"
                    )}
                </td>

                <td>
                    ${itemText || "-"}
                </td>

                <td>
                    ${escapeHtml(status)}
                </td>

                <td>
                    ${time}
                </td>

            `;


            kotBody.appendChild(row);

        });


        document.getElementById(
            "kotLoading"
        ).style.display = "none";


        document.getElementById(
            "kotTable"
        ).style.display = "table";


    }

    catch(error) {

        console.error(
            "SALES ERROR:",
            error
        );


        errorBox.innerText =
            "Unable to load sales.\n\n" +
            error.message;


        errorBox.style.display =
            "block";


        document.getElementById(
            "itemLoading"
        ).style.display = "none";


        document.getElementById(
            "kotLoading"
        ).style.display = "none";

    }

}


/*
========
