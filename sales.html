<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAATARRA - Sales</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #4b001f;
    color: #FFD700;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 5px 0 0;
    color: white;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.controls {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.controls label {
    font-weight: bold;
    margin-right: 5px;
}

.controls input,
.controls select,
.controls button {
    padding: 10px;
    margin: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.controls button {
    background: #4b001f;
    color: #FFD700;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h3 {
    margin: 0;
    color: #666;
    font-size: 15px;
}

.card strong {
    display: block;
    font-size: 26px;
    color: #4b001f;
    margin-top: 8px;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section h2 {
    margin-top: 0;
    color: #4b001f;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #4b001f;
    color: #FFD700;
    padding: 12px;
    text-align: left;
}

td {
    padding: 11px;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #fafafa;
}

.status {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status.pending {
    background: #fff3cd;
    color: #856404;
}

.status.served,
.status.completed {
    background: #d4edda;
    color: #155724;
}

.status.cancelled {
    background: #f8d7da;
    color: #721c24;
}

.loading {
    text-align: center;
    padding: 30px;
    font-size: 18px;
}

.error {
    background: #f8d7da;
    color: #721c24;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.debug {
    background: #222;
    color: #0f0;
    padding: 15px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-x: auto;
}

@media(max-width:700px) {

    .summary {
        grid-template-columns: 1fr;
    }

    .section {
        overflow-x: auto;
    }

    table {
        min-width: 800px;
    }

    .controls input,
    .controls select,
    .controls button {
        width: 100%;
        margin: 5px 0;
    }
}
</style>
</head>

<body>

<header>
    <h1>CHAATARRA</h1>
    <p>Sales Report</p>
</header>

<div class="container">

    <div class="controls">

        <label>From:</label>
        <input type="date" id="fromDate">

        <label>To:</label>
        <input type="date" id="toDate">

        <label>Counter:</label>
        <select id="counterFilter">
            <option value="all">All Counters</option>
        </select>

        <label>Status:</label>
        <select id="statusFilter">
            <option value="all">All Status</option>
        </select>

        <button onclick="applyFilters()">Apply</button>
        <button onclick="resetFilters()">Reset</button>
        <button onclick="loadSales()">Refresh</button>

    </div>

    <div id="errorBox" class="error"></div>

    <div class="summary">

        <div class="card">
            <h3>Total Orders</h3>
            <strong id="totalOrders">0</strong>
        </div>

        <div class="card">
            <h3>Total Items Sold</h3>
            <strong id="totalItems">0</strong>
        </div>

        <div class="card">
            <h3>Total Sales</h3>
            <strong id="totalSales">₹0</strong>
        </div>

    </div>

    <div class="section">

        <h2>Items Sold</h2>

        <div id="itemsLoading" class="loading">
            Loading sales...
        </div>

        <div id="itemsTableContainer"></div>

    </div>

    <div class="section">

        <h2>Order Details</h2>

        <div id="ordersTableContainer"></div>

    </div>

    <div class="section">

        <h2>Item Summary</h2>

        <div id="summaryTableContainer"></div>

    </div>

    <div class="section">

        <details>
            <summary><b>Technical Information</b></summary>
            <br>
            <div id="debugBox" class="debug">
                Waiting for data...
            </div>
        </details>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
"https://ucqeyhcycwksiubmlilg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YdIvl7IqdpT0UZOHBumEiw_ZThYEsgV";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL DATA
   ===================================================== */

let ordersData = [];
let kotData = [];
let combinedData = [];


/* =====================================================
   LOAD SALES
   ===================================================== */

async function loadSales() {

    showError("");

    document.getElementById("itemsLoading").style.display = "block";

    try {

        /*
         * Load main orders table
         */

        const {
            data: orders,
            error: ordersError
        } = await supabaseClient
            .from("orders")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (ordersError) {
            throw new Error(
                "ORDERS TABLE ERROR:\n" +
                ordersError.message
            );
        }


        /*
         * Load counter KOT table
         */

        const {
            data: kots,
            error: kotError
        } = await supabaseClient
            .from("counter_kot")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (kotError) {
            throw new Error(
                "COUNTER_KOT TABLE ERROR:\n" +
                kotError.message
            );
        }


        ordersData = orders || [];
        kotData = kots || [];


        /*
         * Combine orders + counter KOT
         */

        combinedData = [];


        kotData.forEach(kot => {

            let order = ordersData.find(
                o => String(o.id) === String(kot.order_id)
            );


            let items = parseItems(kot.items);


            if (!Array.isArray(items)) {
                return;
            }


            items.forEach(item => {

                const quantity =
                    Number(
                        item.quantity ??
                        item.qty ??
                        1
                    );


                const price =
                    Number(
                        item.price ??
                        item.unit_price ??
                        0
                    );


                combinedData.push({

                    orderId: kot.order_id,

                    kotId: kot.id,

                    order: order,

                    table:
                        order?.table_number ??
                        kot.table_number ??
                        "-",

                    created_at:
                        order?.created_at ??
                        kot.created_at ??
                        null,

                    item:
                        item.name ??
                        item.item_name ??
                        "Unknown Item",

                    quantity: quantity,

                    price: price,

                    amount: quantity * price,

                    counter:
                        item.counter ??
                        kot.counter ??
                        "-",

                    status:
                        kot.status ??
                        order?.status ??
                        "Unknown"

                });

            });

        });


        populateFilters();

        renderSales();

        updateDebug();


    } catch (error) {

        console.error(error);

        showError(error.message);

        document.getElementById("itemsLoading").style.display = "none";

    }

}


/* =====================================================
   PARSE ITEMS
   ===================================================== */

function parseItems(items) {

    if (!items) {
        return [];
    }


    /*
     * Already an array
     */

    if (Array.isArray(items)) {
        return items;
    }


    /*
     * JSON string
     */

    if (typeof items === "string") {

        try {

            const parsed =
                JSON.parse(items);

            if (Array.isArray(parsed)) {
                return parsed;
            }

            if (
                parsed &&
                Array.isArray(parsed.items)
            ) {
                return parsed.items;
            }

        } catch (e) {

            console.error(
                "Could not parse items:",
                items
            );

        }

    }


    /*
     * Object containing items
     */

    if (
        typeof items === "object" &&
        Array.isArray(items.items)
    ) {
        return items.items;
    }


    return [];

}


/* =====================================================
   FILTER OPTIONS
   ===================================================== */

function populateFilters() {

    const counterSelect =
        document.getElementById("counterFilter");

    const statusSelect =
        document.getElementById("statusFilter");


    const counters =
        [...new Set(
            combinedData
                .map(x => x.counter)
                .filter(Boolean)
        )];


    const statuses =
        [...new Set(
            combinedData
                .map(x => x.status)
                .filter(Boolean)
        )];


    counterSelect.innerHTML =
        '<option value="all">All Counters</option>';


    counters.forEach(counter => {

        counterSelect.innerHTML +=
            `<option value="${escapeHtml(counter)}">
                ${escapeHtml(counter)}
            </option>`;

    });


    statusSelect.innerHTML =
        '<option value="all">All Status</option>';


    statuses.forEach(status => {

        statusSelect.innerHTML +=
            `<option value="${escapeHtml(status)}">
                ${escapeHtml(status)}
            </option>`;

    });

}


/* =====================================================
   APPLY FILTERS
   ===================================================== */

function applyFilters() {

    renderSales();

}


/* =====================================================
   RENDER SALES
   ===================================================== */

function renderSales() {

    const fromDate =
        document.getElementById("fromDate").value;

    const toDate =
        document.getElementById("toDate").value;

    const counter =
        document.getElementById("counterFilter").value;

    const status =
        document.getElementById("statusFilter").value;


    let filtered =
        combinedData.filter(row => {


            /*
             * Counter filter
             */

            if (
                counter !== "all" &&
                row.counter !== counter
            ) {
                return false;
            }


            /*
             * Status filter
             */

            if (
                status !== "all" &&
                row.status !== status
            ) {
                return false;
            }


            /*
             * Date filter
             */

            if (
                fromDate ||
                toDate
            ) {

                if (!row.created_at) {
                    return false;
                }


                const date =
                    new Date(row.created_at);


                const dateString =
                    date.toISOString()
                        .split("T")[0];


                if (
                    fromDate &&
                    dateString < fromDate
                ) {
                    return false;
                }


                if (
                    toDate &&
                    dateString > toDate
                ) {
                    return false;
                }

            }


            return true;

        });


    renderSummary(filtered);

    renderItemsTable(filtered);

    renderOrdersTable(filtered);

    renderItemSummary(filtered);

}


/* =====================================================
   SUMMARY CARDS
   ===================================================== */

function renderSummary(data) {

    const orderIds =
        new Set(
            data.map(x => x.orderId)
        );


    const totalOrders =
        orderIds.size;


    const totalItems =
        data.reduce(
            (sum, x) =>
                sum + Number(x.quantity || 0),
            0
        );


    const totalSales =
        data.reduce(
            (sum, x) =>
                sum + Number(x.amount || 0),
            0
        );


    document.getElementById("totalOrders")
        .textContent = totalOrders;


    document.getElementById("totalItems")
        .textContent = totalItems;


    document.getElementById("totalSales")
        .textContent =
        "₹" + totalSales.toFixed(2);

}


/* =====================================================
   ITEMS TABLE
   ===================================================== */

function renderItemsTable(data) {

    document.getElementById("itemsLoading")
        .style.display = "none";


    const container =
        document.getElementById(
            "itemsTableContainer"
        );


    if (!data.length) {

        container.innerHTML =
            '<div class="empty">No sales found.</div>';

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>
                    <th>Date / Time</th>
                    <th>Order</th>
                    <th>Table</th>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Amount</th>
                    <th>Counter</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody>

    `;


    data.forEach(row => {

        html += `

            <tr>

                <td>
                    ${formatDate(row.created_at)}
                </td>

                <td>
                    #${escapeHtml(row.orderId)}
                </td>

                <td>
                    ${escapeHtml(row.table)}
                </td>

                <td>
                    <b>${escapeHtml(row.item)}</b>
                </td>

                <td>
                    ${row.quantity}
                </td>

                <td>
                    ₹${row.price.toFixed(2)}
                </td>

                <td>
                    <b>₹${row.amount.toFixed(2)}</b>
                </td>

                <td>
                    ${escapeHtml(row.counter)}
                </td>

                <td>
                    <span class="status ${statusClass(row.status)}">
                        ${escapeHtml(row.status)}
                    </span>
                </td>

            </tr>

        `;

    });


    html += `
            </tbody>
        </table>
    `;


    container.innerHTML = html;

}


/* =====================================================
   ORDER TABLE
   ===================================================== */

function renderOrdersTable(data) {

    const container =
        document.getElementById(
            "ordersTableContainer"
        );


    const orderMap = new Map();


    data.forEach(row => {

        if (!orderMap.has(row.orderId)) {

            orderMap.set(
                row.orderId,
                {
                    orderId: row.orderId,
                    table: row.table,
                    created_at: row.created_at,
                    amount: 0,
                    items: 0,
                    status: row.status
                }
            );

        }


        const order =
            orderMap.get(row.orderId);


        order.amount +=
            Number(row.amount || 0);


        order.items +=
            Number(row.quantity || 0);

    });


    const orders =
        [...orderMap.values()];


    if (!orders.length) {

        container.innerHTML =
            '<div class="empty">No orders found.</div>';

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>
                    <th>Date / Time</th>
                    <th>Order</th>
                    <th>Table</th>
                    <th>Items</th>
                    <th>Calculated Total</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody>

    `;


    orders.forEach(order => {

        html += `

            <tr>

                <td>
                    ${formatDate(order.created_at)}
                </td>

                <td>
                    <b>#${escapeHtml(order.orderId)}</b>
                </td>

                <td>
                    ${escapeHtml(order.table)}
                </td>

                <td>
                    ${order.items}
                </td>

                <td>
                    ₹${order.amount.toFixed(2)}
                </td>

                <td>
                    <span class="status ${statusClass(order.status)}">
                        ${escapeHtml(order.status)}
                    </span>
                </td>

            </tr>

        `;

    });


    html += `
            </tbody>
        </table>
    `;


    container.innerHTML = html;

}


/* =====================================================
   ITEM SUMMARY
   ===================================================== */

function renderItemSummary(data) {

    const container =
        document.getElementById(
            "summaryTableContainer"
        );


    const map = new Map();


    data.forEach(row => {

        const key =
            row.item + "|" + row.counter;


        if (!map.has(key)) {

            map.set(
                key,
                {
                    item: row.item,
                    counter: row.counter,
                    quantity: 0,
                    amount: 0
                }
            );

        }


        const entry =
            map.get(key);


        entry.quantity +=
            Number(row.quantity || 0);


        entry.amount +=
            Number(row.amount || 0);

    });


    const summary =
        [...map.values()]
        .sort(
            (a,b) =>
                b.quantity - a.quantity
        );


    if (!summary.length) {

        container.innerHTML =
            '<div class="empty">No item data.</div>';

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>
                    <th>Item</th>
                    <th>Counter</th>
                    <th>Total Quantity</th>
                    <th>Total Amount</th>
                </tr>

            </thead>

            <tbody>

    `;


    summary.forEach(row => {

        html += `

            <tr>

                <td>
                    <b>${escapeHtml(row.item)}</b>
                </td>

                <td>
                    ${escapeHtml(row.counter)}
                </td>

                <td>
                    ${row.quantity}
                </td>

                <td>
                    <b>₹${row.amount.toFixed(2)}</b>
                </td>

            </tr>

        `;

    });


    html += `
            </tbody>
        </table>
    `;


    container.innerHTML = html;

}


/* =====================================================
   RESET
   ===================================================== */

function resetFilters() {

    document.getElementById("fromDate").value = "";

    document.getElementById("toDate").value = "";

    document.getElementById("counterFilter").value = "all";

    document.getElementById("statusFilter").value = "all";

    renderSales();

}


/* =====================================================
   DATE FORMAT
   ===================================================== */

function formatDate(value) {

    if (!value) {
        return "-";
    }


    const date =
        new Date(value);


    if (isNaN(date.getTime())) {
        return "-";
    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   STATUS CLASS
   ===================================================== */

function statusClass(status) {

    if (!status) {
        return "";
    }


    return String(status)
        .toLowerCase()
        .replace(/\s+/g, "-");

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

    const box =
        document.getElementById("errorBox");


    if (!message) {

        box.style.display = "none";
        box.textContent = "";

        return;

    }


    box.style.display = "block";

    box.textContent = message;

}


/* =====================================================
   DEBUG INFORMATION
   ===================================================== */

function updateDebug() {

    const statuses =
        [...new Set(
            kotData.map(k => k.status)
        )];


    const counters =
        [...new Set(
            kotData.map(k => k.counter)
        )];


    document.getElementById("debugBox")
        .textContent =

`ORDERS ROWS: ${ordersData.length}

COUNTER_KOT ROWS: ${kotData.length}

ITEM ROWS CREATED: ${combinedData.length}

COUNTERS:
${JSON.stringify(counters, null, 2)}

STATUSES:
${JSON.stringify(statuses, null, 2)}

First order:
${JSON.stringify(
    ordersData[0] || null,
    null,
    2
)}

First counter_kot:
${JSON.stringify(
    kotData[0] || null,
    null,
    2
)}`;

}


/* =====================================================
   START
   ===================================================== */

loadSales();

</script>

</body>
</html>
