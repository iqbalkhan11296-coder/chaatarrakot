<script>


/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
"https://ucqeyhcycwksiubmlilg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YdIvl7IqdpT0UZOHBumEiw_ZThYEsgV";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL DATA
   ===================================================== */

let ordersData = [];
let kotData = [];
let salesData = [];

/*
 * Normal menu prices.
 * Used only to calculate each component's share of a combo price.
 */
const basePrices = {
    "Pani Puri": 50,
    "Masala Puri": 60,
    "Samosa Chaat": 80,
    "Dahi Puri": 80,

    "Mango Shake": 90,
    "Oreo Shake": 80,
    "Strawberry Shake": 90,
    "Mint Lime": 35,

    "Classic Burger": 120,
    "Chicken Burger": 150,
    "Cheese Burger": 140,
    "Double Burger": 180
};


/* =====================================================
   LOAD SALES
   ===================================================== */

async function loadSales() {

    showError("");

    document.getElementById(
        "itemsLoading"
    ).style.display = "block";


    try {

        /*
         * IMPORTANT:
         * Sales are calculated from ORDERS.
         *
         * This is necessary because combo orders are stored
         * as one item in orders.items.
         *
         * counter_kot splits the combo into preparation
         * components and therefore must NOT be used to
         * calculate sales revenue.
         */


        const {
            data: orders,
            error: ordersError
        } = await supabaseClient

            .from("orders")

            .select("*")

            .order("created_at", {
                ascending: false
            });


        if (ordersError) {

            throw new Error(
                "ORDERS TABLE ERROR:\n" +
                ordersError.message
            );

        }


        /*
         * Load KOT only for counter/status information.
         */

        const {
            data: kots,
            error: kotError
        } = await supabaseClient

            .from("counter_kot")

            .select("*")

            .order("created_at", {
                ascending: false
            });


        if (kotError) {

            throw new Error(
                "COUNTER_KOT TABLE ERROR:\n" +
                kotError.message
            );

        }


        ordersData = orders || [];

        kotData = kots || [];


        /*
         * Build SALES DATA directly from orders.
         */

        salesData = [];


        ordersData.forEach(order => {

            const items =
                parseItems(order.items);


            if (!Array.isArray(items)) {
                return;
            }


            items.forEach(item => {

                const quantity =
                    Number(
                        item.quantity ??
                        item.qty ??
                        1
                    );

                const price =
                    Number(
                        item.price ??
                        item.unit_price ??
                        0
                    );

                const isCombo =
                    item.type === "combo";

                const itemName =
                    item.name ??
                    item.item_name ??
                    "Unknown Item";

                /*
                 * COMBO:
                 * Split the actual combo selling price between
                 * the component counters according to the
                 * normal component prices.
                 */
                if (
                    isCombo &&
                    Array.isArray(item.components) &&
                    item.components.length
                ) {

                    const components =
                        item.components.map(component => {

                            const name =
                                component.name ??
                                component.item_name ??
                                "Unknown Item";

                            const componentPrice =
                                Number(
                                    component.price ??
                                    component.unit_price ??
                                    basePrices[name] ??
                                    0
                                );

                            return {
                                name: name,
                                counter:
                                    component.counter ||
                                    "-",
                                price:
                                    componentPrice
                            };

                        });

                    /*
                     * COMBO PRICING:
                     * Chaats and Burgers keep their full normal price.
                     * The discount is taken from Drinks.
                     *
                     * Example:
                     * Pani Puri ₹50 + Mint Lime ₹35
                     * Combo ₹80
                     * Chaats = ₹50
                     * Drinks = ₹30
                     */
                    const fixedComponents =
                        components.filter(
                            component =>
                                component.counter === "chaats" ||
                                component.counter === "burgers"
                        );

                    const drinkComponents =
                        components.filter(
                            component =>
                                component.counter === "drinks"
                        );

                    const fixedTotal =
                        fixedComponents.reduce(
                            (sum, component) =>
                                sum + component.price,
                            0
                        );

                    const comboTotal =
                        quantity * price;

                    const remainingForDrinks =
                        comboTotal -
                        quantity * fixedTotal;

                    if (components.length > 0) {

                        components.forEach(
                            (component, index) => {

                                let allocatedAmount = 0;

                                if (
                                    component.counter === "chaats" ||
                                    component.counter === "burgers"
                                ) {

                                    allocatedAmount =
                                        quantity *
                                        component.price;

                                } else if (
                                    component.counter === "drinks"
                                ) {

                                    const drinkNormalTotal =
                                        drinkComponents.reduce(
                                            (sum, drink) =>
                                                sum + drink.price,
                                            0
                                        );

                                    allocatedAmount =
                                        drinkNormalTotal > 0
                                            ? remainingForDrinks *
                                              (
                                                  component.price /
                                                  drinkNormalTotal
                                              )
                                            : 0;

                                }

                                salesData.push({

                                    orderId:
                                        order.id,

                                    orderNumber:
                                        order.order_number,

                                    order:
                                        order,

                                    created_at:
                                        order.created_at,

                                    table:
                                        order.table_number ??
                                        "-",

                                    customer:
                                        order.customer_name ??
                                        "-",

                                    item:
                                        component.name,

                                    quantity:
                                        quantity,

                                    /*
                                     * Original menu price of
                                     * this component.
                                     */

                                    price:
                                        component.price,

                                    /*
                                     * THIS is the important value:
                                     * the component's share of the
                                     * actual combo selling price.
                                     */

                                    amount:
                                        allocatedAmount,

                                    counter:
                                        component.counter,

                                    status:
                                        order.status ??
                                        "Pending",

                                    type:
                                        "combo",

                                    components:
                                        item.components,

                                    comboName:
                                        itemName,

                                    comboGroup:
                                        order.id +
                                        "_" +
                                        itemName,

                                    comboComponentIndex:
                                        index,

                                    isComboComponent:
                                        true

                                });

                            }
                        );

                    } else {

                        /*
                         * Safety fallback if component prices
                         * cannot be determined.
                         */

                        salesData.push({

                            orderId:
                                order.id,

                            orderNumber:
                                order.order_number,

                            order:
                                order,

                            created_at:
                                order.created_at,

                            table:
                                order.table_number ??
                                "-",

                            customer:
                                order.customer_name ??
                                "-",

                            item:
                                itemName,

                            quantity:
                                quantity,

                            price:
                                price,

                            amount:
                                quantity * price,

                            counter:
                                "-",

                            status:
                                order.status ??
                                "Pending",

                            type:
                                "combo",

                            components:
                                item.components,

                            comboName:
                                itemName,

                            comboGroup:
                                order.id +
                                "_" +
                                itemName,

                            isComboComponent:
                                false

                        });

                    }

                } else {

                    /*
                     * NORMAL SINGLE ITEM:
                     * unchanged.
                     */

                    salesData.push({

                        orderId:
                            order.id,

                        orderNumber:
                            order.order_number,

                        order:
                            order,

                        created_at:
                            order.created_at,

                        table:
                            order.table_number ??
                            "-",

                        customer:
                            order.customer_name ??
                            "-",

                        item:
                            itemName,

                        quantity:
                            quantity,

                        price:
                            price,

                        amount:
                            quantity * price,

                        counter:
                            item.counter || "-",

                        status:
                            order.status ??
                            "Pending",

                        type:
                            "single",

                        components:
                            []

                    });

                }

            });

        });

        populateFilters();

        renderSales();

        updateDebug();


    } catch (error) {

        console.error(error);

        showError(
            error.message
        );

        document.getElementById(
            "itemsLoading"
        ).style.display = "none";

    }

}


/* =====================================================
   PARSE ITEMS
   ===================================================== */

function parseItems(items) {

    if (!items) {
        return [];
    }


    if (Array.isArray(items)) {
        return items;
    }


    if (typeof items === "string") {

        try {

            const parsed =
                JSON.parse(items);


            if (Array.isArray(parsed)) {
                return parsed;
            }


            if (
                parsed &&
                Array.isArray(parsed.items)
            ) {

                return parsed.items;

            }

        } catch (e) {

            console.error(
                "Could not parse items:",
                items
            );

        }

    }


    if (
        typeof items === "object" &&
        Array.isArray(items.items)
    ) {

        return items.items;

    }


    return [];

}


/* =====================================================
   FILTER OPTIONS
   ===================================================== */

function populateFilters() {

    const statusSelect =
        document.getElementById(
            "statusFilter"
        );


    const statuses =
        [
            ...new Set(
                salesData
                    .map(x => x.status)
                    .filter(Boolean)
            )
        ];


    statusSelect.innerHTML =
        '<option value="all">All Status</option>';


    statuses.forEach(status => {

        statusSelect.innerHTML +=

            `<option value="${escapeHtml(status)}">
                ${escapeHtml(status)}
            </option>`;

    });

}


/* =====================================================
   APPLY FILTERS
   ===================================================== */

function applyFilters() {

    renderSales();

}


/* =====================================================
   GET FILTERED DATA
   ===================================================== */

function getFilteredData() {

    const fromDate =
        document.getElementById(
            "fromDate"
        ).value;


    const toDate =
        document.getElementById(
            "toDate"
        ).value;


    const counter =
        document.getElementById(
            "counterFilter"
        ).value;


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    return salesData.filter(row => {


        /*
         * Counter filter
         */

        if (counter !== "all") {

            /*
             * Normal item
             */

            if (
                row.type === "single" &&
                row.counter !== counter
            ) {

                return false;

            }


            /*
             * Combo:
             * check component counters.
             */

            if (
                row.type === "combo" &&
                row.counter !== counter
            ) {

                return false;

            }

        }


        /*
         * Status filter
         */

        if (
            status !== "all" &&
            row.status !== status
        ) {

            return false;

        }


        /*
         * Date filter
         */

        if (
            fromDate ||
            toDate
        ) {

            if (!row.created_at) {
                return false;
            }


            const date =
                new Date(
                    row.created_at
                );


            const dateString =
                date.toISOString()
                    .split("T")[0];


            if (
                fromDate &&
                dateString < fromDate
            ) {

                return false;

            }


            if (
                toDate &&
                dateString > toDate
            ) {

                return false;

            }

        }


        return true;

    });

}


/* =====================================================
   RENDER SALES
   ===================================================== */

function renderSales() {

    const filtered =
        getFilteredData();


    renderSummary(
        filtered
    );


    renderItemsTable(
        filtered
    );


    renderOrdersTable(
        filtered
    );


    renderItemSummary(
        filtered
    );

}


/* =====================================================
   SUMMARY
   ===================================================== */

function renderSummary(data) {


    /*
     * Unique orders
     */

    const orderIds =
        new Set(
            data.map(
                x => x.orderId
            )
        );


    const totalOrders =
        orderIds.size;


    /*
     * Total quantities.
     *
     * Both normal items and combos count
     * as one sold item per quantity.
     */

    const totalItems =
        data.reduce(
            (sum, x) =>
                sum +
                Number(
                    x.quantity || 0
                ),
            0
        );


    /*
     * Number of combos sold
     */

    const comboGroups =
        new Map();

    data
        .filter(
            x =>
                x.type === "combo"
        )
        .forEach(x => {

            const key =
                x.comboGroup ||
                (
                    x.orderId +
                    "|" +
                    x.item
                );

            if (!comboGroups.has(key)) {

                comboGroups.set(
                    key,
                    Number(
                        x.quantity || 0
                    )
                );

            }

        });

    const totalCombos =
        Array.from(
            comboGroups.values()
        ).reduce(
            (sum, quantity) =>
                sum + quantity,
            0
        );


    /*
     * Sales amount.
     *
     * Because each row comes from orders.items,
     * combo price is counted ONCE.
     */

    const totalSales =
        data.reduce(
            (sum, x) =>
                sum +
                Number(
                    x.amount || 0
                ),
            0
        );


    document.getElementById(
        "totalOrders"
    ).textContent =
        totalOrders;


    document.getElementById(
        "totalItems"
    ).textContent =
        totalItems;


    document.getElementById(
        "totalCombos"
    ).textContent =
        totalCombos;


    document.getElementById(
        "totalSales"
    ).textContent =
        "₹" +
        totalSales.toFixed(2);

}


/* =====================================================
   SALES ITEMS TABLE
   ===================================================== */

function renderItemsTable(data) {

    document.getElementById(
        "itemsLoading"
    ).style.display = "none";


    const container =
        document.getElementById(
            "itemsTableContainer"
        );


    if (!data.length) {

        container.innerHTML =
            '<div class="empty">No sales found.</div>';

        return;

    }


    let html = `

    <table>

    <thead>

    <tr>

        <th>Date / Time</th>

        <th>Order</th>

        <th>Customer</th>

        <th>Item</th>

        <th>Type</th>

        <th>Qty</th>

        <th>Price</th>

        <th>Amount</th>

        <th>Counter</th>

        <th>Status</th>

    </tr>

    </thead>

    <tbody>

    `;


    data.forEach(row => {


        let componentText = "";

        /*
         * Combo components are now separate rows.
         * Show the original combo name underneath the item.
         */

        if (
            row.type === "combo" &&
            row.comboName
        ) {

            componentText =
                "From combo: " +
                escapeHtml(row.comboName);

        }


        html += `

        <tr>

            <td>
                ${formatDate(
                    row.created_at
                )}
            </td>


            <td>
                <b>
                    #${escapeHtml(
                        row.orderNumber ??
                        row.orderId
                    )}
                </b>
            </td>


            <td>
                ${escapeHtml(
                    row.customer
                )}
            </td>


            <td>

                <b>
                    ${escapeHtml(
                        row.item
                    )}
                </b>

                ${
                    componentText
                    ? `
                    <div class="combo-components">
                        Includes:
                        ${componentText}
                    </div>
                    `
                    : ""
                }

            </td>


            <td>

                <span class="type ${row.type}">

                    ${
                        row.type === "combo"
                        ? "COMBO"
                        : "SINGLE"
                    }

                </span>

            </td>


            <td>
                ${row.quantity}
            </td>


            <td>
                ₹${row.price.toFixed(2)}
            </td>


            <td>
                <b>
                    ₹${row.amount.toFixed(2)}
                </b>
            </td>


            <td>
                ${escapeHtml(
                    row.counter
                )}
            </td>


            <td>

                <span
                    class="status ${statusClass(
                        row.status
                    )}"
                >

                    ${escapeHtml(
                        row.status
                    )}

                </span>

            </td>

        </tr>

        `;

    });


    html += `

    </tbody>

    </table>

    `;


    container.innerHTML =
        html;

}


/* =====================================================
   ORDER DETAILS
   ===================================================== */

function renderOrdersTable(data) {

    const container =
        document.getElementById(
            "ordersTableContainer"
        );


    const orderMap =
        new Map();


    data.forEach(row => {

        if (
            !orderMap.has(
                row.orderId
            )
        ) {

            orderMap.set(
                row.orderId,
                {

                    orderId:
                        row.orderId,

                    orderNumber:
                        row.orderNumber,

                    customer:
                        row.customer,

                    table:
                        row.table,

                    created_at:
                        row.created_at,

                    amount:
                        0,

                    items:
                        0,

                    combos:
                        0,

                    status:
                        row.status

                }
            );

        }


        const order =
            orderMap.get(
                row.orderId
            );


        order.amount +=
            Number(
                row.amount || 0
            );


        order.items +=
            Number(
                row.quantity || 0
            );


        if (
            row.type === "combo"
        ) {

            order.combos +=
                Number(
                    row.quantity || 0
                );

        }

    });


    const orders =
        [
            ...orderMap.values()
        ];


    if (!orders.length) {

        container.innerHTML =
            '<div class="empty">No orders found.</div>';

        return;

    }


    let html = `

    <table>

    <thead>

    <tr>

        <th>Date / Time</th>

        <th>Order</th>

        <th>Customer</th>

        <th>Items</th>

        <th>Combos</th>

        <th>Calculated Total</th>

        <th>Status</th>

    </tr>

    </thead>

    <tbody>

    `;


    orders.forEach(order => {

        html += `

        <tr>

            <td>
                ${formatDate(
                    order.created_at
                )}
            </td>


            <td>
                <b>
                    #${escapeHtml(
                        order.orderNumber ??
                        order.orderId
                    )}
                </b>
            </td>


            <td>
                ${escapeHtml(
                    order.customer
                )}
            </td>


            <td>
                ${order.items}
            </td>


            <td>
                ${order.combos}
            </td>


            <td>
                <b>
                    ₹${order.amount.toFixed(2)}
                </b>
            </td>


            <td>

                <span
                    class="status ${statusClass(
                        order.status
                    )}"
                >

                    ${escapeHtml(
                        order.status
                    )}

                </span>

            </td>

        </tr>

        `;

    });


    html += `

    </tbody>

    </table>

    `;


    container.innerHTML =
        html;

}


/* =====================================================

function renderItemSummary(data) {

    const container =
        document.getElementById(
            "summaryTableContainer"
        );


    const map =
        new Map();


    data.forEach(row => {

        /*
         * Keep SINGLE and COMBO separate.
         */

        const key =
            row.type +
            "|" +
            row.item +
            "|" +
            (row.comboName || "");


        if (
            !map.has(key)
        ) {

            map.set(
                key,
                {

                    item:
                        row.item,

                    type:
                        row.type,

                    comboName:
                        row.comboName || "",

                    quantity:
                        0,

                    amount:
                        0

                }
            );

        }


        const entry =
            map.get(key);


        entry.quantity +=
            Number(
                row.quantity || 0
            );


        entry.amount +=
            Number(
                row.amount || 0
            );

    });


    const summary =
        [
            ...map.values()
        ]
        .sort(
            (a,b) =>
                b.quantity -
                a.quantity
        );


    if (!summary.length) {

        container.innerHTML =
            '<div class="empty">No item data.</div>';

        return;

    }


    let html = `

    <table>

    <thead>

    <tr>

        <th>Item</th>

        <th>Type</th>

        <th>Total Quantity</th>

        <th>Total Amount</th>

    </tr>

    </thead>

    <tbody>

    `;


    summary.forEach(row => {

        html += `

        <tr>

            <td>
                <b>
                    ${escapeHtml(
                        row.item
                    )}
                </b>

                ${
                    row.type === "combo" && row.comboName
                    ? `
                        <div class="combo-components">
                            From combo: ${escapeHtml(row.comboName)}
                        </div>
                    `
                    : ""
                }
            </td>


            <td>

                <span
                    class="type ${row.type}"
                >

                    ${
                        row.type === "combo"
                        ? "COMBO"
                        : "SINGLE"
                    }

                </span>

            </td>


            <td>
                ${row.quantity}
            </td>


            <td>
                <b>
                    ₹${row.amount.toFixed(2)}
                </b>
            </td>

        </tr>

        `;

    });


    html += `

    </tbody>

    </table>

    `;


    container.innerHTML =
        html;

}


/* =====================================================
   EXPORT TO EXCEL
   ===================================================== */

function getOrderPayment(order) {

    if (!order) return "-";

    return (
        order.payment_method ??
        order.payment ??
        order.payment_type ??
        order.paymentMode ??
        order.payment_mode ??
        "-"
    );
}

function exportToExcel() {

    if (typeof XLSX === "undefined") {
        alert("Excel library is still loading. Please try again.");
        return;
    }

    const data = getFilteredData();

    if (!data.length) {
        alert("There is no sales data to export for the selected filters.");
        return;
    }

    const workbook = XLSX.utils.book_new();

    /*
     * -----------------------------------------------------
     * SHEET 1: SALES ITEMS
     * -----------------------------------------------------
     */

    const itemRows = data.map(row => ({
        "Date / Time": formatDate(row.created_at),
        "Order": "#" + (row.orderNumber ?? row.orderId),
        "Customer": row.customer ?? "-",
        "Payment": getOrderPayment(row.order),
        "Item": row.item ?? "-",
        "Type": row.type === "combo" ? "COMBO" : "SINGLE",
        "Quantity": Number(row.quantity || 0),
        "Unit Price": Number(row.price || 0),
        "Revenue": Number(row.amount || 0),
        "Counter": row.counter ?? "-",
        "Status": row.status ?? "Pending",
        "From Combo": row.comboName ?? ""
    }));

    const salesSheet = XLSX.utils.json_to_sheet(itemRows);
    XLSX.utils.book_append_sheet(workbook, salesSheet, "Sales Items");

    /*
     * -----------------------------------------------------
     * SHEET 2: ORDER DETAILS
     * -----------------------------------------------------
     */

    const orderMap = new Map();

    data.forEach(row => {

        if (!orderMap.has(row.orderId)) {
            orderMap.set(row.orderId, {
                "Date / Time": formatDate(row.created_at),
                "Order": "#" + (row.orderNumber ?? row.orderId),
                "Customer": row.customer ?? "-",
                "Payment": getOrderPayment(row.order),
                "Items": 0,
                "Combos": 0,
                "Total": 0,
                "Status": row.status ?? "Pending"
            });
        }

        const order = orderMap.get(row.orderId);

        order["Items"] += Number(row.quantity || 0);
        order["Total"] += Number(row.amount || 0);

        if (row.type === "combo") {
            order["Combos"] += Number(row.quantity || 0);
        }
    });

    const orderRows = [...orderMap.values()];
    const orderSheet = XLSX.utils.json_to_sheet(orderRows);
    XLSX.utils.book_append_sheet(workbook, orderSheet, "Orders");

    /*
     * -----------------------------------------------------
     * SHEET 3: ITEM SUMMARY
     * -----------------------------------------------------
     */

    const itemMap = new Map();

    data.forEach(row => {

        const key =
            row.type +
            "|" +
            row.item +
            "|" +
            (row.comboName || "");

        if (!itemMap.has(key)) {
            itemMap.set(key, {
                "Item": row.item ?? "-",
                "Type": row.type === "combo" ? "COMBO" : "SINGLE",
                "From Combo": row.comboName ?? "",
                "Quantity": 0,
                "Revenue": 0
            });
        }

        const entry = itemMap.get(key);

        entry["Quantity"] += Number(row.quantity || 0);
        entry["Revenue"] += Number(row.amount || 0);
    });

    const itemSummaryRows = [...itemMap.values()]
        .sort((a, b) => b["Quantity"] - a["Quantity"]);

    const summarySheet =
        XLSX.utils.json_to_sheet(itemSummaryRows);

    XLSX.utils.book_append_sheet(
        workbook,
        summarySheet,
        "Item Summary"
    );

    /*
     * -----------------------------------------------------
     * SHEET 4: PAYMENT BREAKDOWN
     * -----------------------------------------------------
     */

    const paymentMap = new Map();

    orderRows.forEach(order => {

        const payment = order["Payment"] || "-";

        if (!paymentMap.has(payment)) {
            paymentMap.set(payment, {
                "Payment Method": payment,
                "Orders": 0,
                "Revenue": 0
            });
        }

        const entry = paymentMap.get(payment);

        entry["Orders"] += 1;
        entry["Revenue"] += Number(order["Total"] || 0);
    });

    const paymentRows = [...paymentMap.values()];

    const paymentSheet =
        XLSX.utils.json_to_sheet(paymentRows);

    XLSX.utils.book_append_sheet(
        workbook,
        paymentSheet,
        "Payments"
    );

    /*
     * -----------------------------------------------------
     * SHEET 5: REPORT SUMMARY
     * -----------------------------------------------------
     */

    const totalOrders =
        new Set(data.map(x => x.orderId)).size;

    const totalItems =
        data.reduce(
            (sum, x) => sum + Number(x.quantity || 0),
            0
        );

    const totalSales =
        data.reduce(
            (sum, x) => sum + Number(x.amount || 0),
            0
        );

    const comboGroups = new Map();

    data
        .filter(x => x.type === "combo")
        .forEach(x => {

            const key =
                x.comboGroup ||
                x.orderId + "|" + x.item;

            if (!comboGroups.has(key)) {
                comboGroups.set(
                    key,
                    Number(x.quantity || 0)
                );
            }
        });

    const totalCombos =
        [...comboGroups.values()]
            .reduce(
                (sum, quantity) => sum + quantity,
                0
            );

    const averageBill =
        totalOrders > 0
            ? totalSales / totalOrders
            : 0;

    const fromDate =
        document.getElementById("fromDate").value || "All";

    const toDate =
        document.getElementById("toDate").value || "All";

    const counter =
        document.getElementById("counterFilter").value;

    const status =
        document.getElementById("statusFilter").value;

    const reportRows = [
        {
            "Report": "CHAATARRA SALES REPORT",
            "Value": ""
        },
        {
            "Report": "From Date",
            "Value": fromDate
        },
        {
            "Report": "To Date",
            "Value": toDate
        },
        {
            "Report": "Counter",
            "Value": counter
        },
        {
            "Report": "Status",
            "Value": status
        },
        {
            "Report": "",
            "Value": ""
        },
        {
            "Report": "Total Orders",
            "Value": totalOrders
        },
        {
            "Report": "Total Items Sold",
            "Value": totalItems
        },
        {
            "Report": "Total Combos Sold",
            "Value": totalCombos
        },
        {
            "Report": "Total Sales",
            "Value": totalSales
        },
        {
            "Report": "Average Bill",
            "Value": averageBill
        }
    ];

    const reportSheet =
        XLSX.utils.json_to_sheet(reportRows);

    XLSX.utils.book_append_sheet(
        workbook,
        reportSheet,
        "Report Summary"
    );

    /*
     * -----------------------------------------------------
     * FORMAT COLUMN WIDTHS
     * -----------------------------------------------------
     */

    function setWidths(sheet, widths) {
        sheet["!cols"] = widths.map(width => ({
            wch: width
        }));
    }

    setWidths(salesSheet, [
        20, 10, 22, 14, 28, 10,
        10, 12, 12, 14, 14, 28
    ]);

    setWidths(orderSheet, [
        20, 10, 22, 14, 10, 10, 14, 14
    ]);

    setWidths(summarySheet, [
        30, 12, 30, 12, 14
    ]);

    setWidths(paymentSheet, [
        20, 12, 15
    ]);

    setWidths(reportSheet, [
        25, 20
    ]);

    /*
     * -----------------------------------------------------
     * FILE NAME
     * -----------------------------------------------------
     */

    const today = new Date();

    const datePart =
        today.toISOString().split("T")[0];

    const fileName =
        "Chaatarra_Sales_" +
        datePart +
        ".xlsx";

    XLSX.writeFile(workbook, fileName);
}

/* =====================================================
   DATE FORMAT
   ===================================================== */

function formatDate(value) {

    if (!value) {
        return "-";
    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(
        "en-IN",
        {

            day: "2-digit",

            month: "2-digit",

            year: "numeric",

            hour: "2-digit",

            minute: "2-digit"

        }
    );

}


/* =====================================================
   STATUS CLASS
   ===================================================== */

function statusClass(status) {

    if (!status) {
        return "";
    }


    return String(status)
        .toLowerCase()
        .replace(
            /\s+/g,
            "-"
        );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

    const box =
        document.getElementById(
            "errorBox"
        );


    if (!message) {

        box.style.display =
            "none";

        box.textContent = "";

        return;

    }


    box.style.display =
        "block";


    box.textContent =
        message;

}
