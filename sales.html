<style>

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://ucqeyhcycwksiubmlilg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YdIvl7IqdpT0UZOHBumEiw_ZThYEsgV";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   SALES DATA
   ===================================================== */

let ordersData=[];
let kotData=[];
let salesData=[];

const basePrices={
    "Pani Puri":50,
    "Masala Puri":60,
    "Samosa Chaat":80,
    "Dahi Puri":80,
    "Mango Shake":90,
    "Oreo Shake":80,
    "Strawberry Shake":90,
    "Mint Lime":35,
    "Classic Burger":120,
    "Chicken Burger":150,
    "Cheese Burger":140,
    "Double Burger":180
};


/* =====================================================
   LOAD SALES
   ===================================================== */

async function loadSales(){

showError("");

try{

const {data:orders,error:ordersError}=
await supabaseClient
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(ordersError)
throw new Error("ORDERS TABLE ERROR:\n"+ordersError.message);

const {data:kots,error:kotError}=
await supabaseClient
.from("counter_kot")
.select("*")
.order("created_at",{ascending:false});

if(kotError)
throw new Error("COUNTER_KOT TABLE ERROR:\n"+kotError.message);

ordersData=orders||[];
kotData=kots||[];
salesData=[];

ordersData.forEach(order=>{

const items=parseItems(order.items);

if(!Array.isArray(items)) return;

items.forEach(item=>{

const quantity=Number(
item.quantity??item.qty??1
);

const price=Number(
item.price??item.unit_price??0
);

const isCombo=item.type==="combo";

const itemName=
item.name??item.item_name??"Unknown Item";

if(
isCombo &&
Array.isArray(item.components) &&
item.components.length
){

const components=item.components.map(component=>({

name:
component.name??
component.item_name??
"Unknown Item",

counter:
component.counter||"-",

price:Number(
component.price??
component.unit_price??
basePrices[
component.name??
component.item_name
]??0
)

}));

const fixedComponents=
components.filter(c=>
c.counter==="chaats"||
c.counter==="burgers"
);

const drinkComponents=
components.filter(c=>
c.counter==="drinks"
);

const fixedTotal=
fixedComponents.reduce(
(sum,c)=>sum+c.price,0
);

const comboTotal=
quantity*price;

const remainingForDrinks=
comboTotal-
quantity*fixedTotal;

components.forEach((component,index)=>{

let allocatedAmount=0;

if(
component.counter==="chaats"||
component.counter==="burgers"
){

allocatedAmount=
quantity*component.price;

}else if(component.counter==="drinks"){

const drinkNormalTotal=
drinkComponents.reduce(
(sum,d)=>sum+d.price,0
);

allocatedAmount=
drinkNormalTotal>0
?remainingForDrinks*
(component.price/drinkNormalTotal)
:0;

}

salesData.push({

orderId:order.id,
orderNumber:order.order_number,
order:order,
created_at:order.created_at,
table:order.table_number??"-",
customer:order.customer_name??"-",
item:component.name,
quantity:quantity,
price:component.price,
amount:allocatedAmount,
counter:component.counter,
status:order.status??"Pending",
type:"combo",
components:item.components,
comboName:itemName,
comboGroup:order.id+"_"+itemName,
comboComponentIndex:index,
isComboComponent:true

});

});

}else{

salesData.push({

orderId:order.id,
orderNumber:order.order_number,
order:order,
created_at:order.created_at,
table:order.table_number??"-",
customer:order.customer_name??"-",
item:itemName,
quantity:quantity,
price:price,
amount:quantity*price,
counter:item.counter||"-",
status:order.status??"Pending",
type:"single",
components:[]

});

}

});

});

populateFilters();
renderSales();
updateDebug();

}catch(error){

console.error(error);
showError(error.message);

}

}


/* =====================================================
   PARSE ITEMS
   ===================================================== */

function parseItems(items){

if(!items)return[];

if(Array.isArray(items))
return items;

if(typeof items==="string"){

try{

const parsed=JSON.parse(items);

if(Array.isArray(parsed))
return parsed;

if(parsed&&Array.isArray(parsed.items))
return parsed.items;

}catch(e){
console.error(e);
}

}

if(
typeof items==="object"&&
Array.isArray(items.items)
)
return items.items;

return[];
}


/* =====================================================
   FILTERS
   ===================================================== */

function populateFilters(){

const select=
document.getElementById("statusFilter");

const statuses=[
...new Set(
salesData
.map(x=>x.status)
.filter(Boolean)
)
];

select.innerHTML=
'<option value="all">All Status</option>';

statuses.forEach(status=>{

select.innerHTML+=
`<option value="${escapeHtml(status)}">
${escapeHtml(status)}
</option>`;

});

}

function applyFilters(){
renderSales();
}

function getFilteredData(){

const fromDate=
document.getElementById("fromDate").value;

const toDate=
document.getElementById("toDate").value;

const counter=
document.getElementById("counterFilter").value;

const status=
document.getElementById("statusFilter").value;

return salesData.filter(row=>{

if(
counter!=="all"&&
row.counter!==counter
)return false;

if(
status!=="all"&&
row.status!==status
)return false;

if(fromDate||toDate){

if(!row.created_at)return false;

const date=new Date(row.created_at);

const dateString=
date.getFullYear()+"-"+
String(date.getMonth()+1).padStart(2,"0")+"-"+
String(date.getDate()).padStart(2,"0");

if(fromDate&&dateString<fromDate)
return false;

if(toDate&&dateString>toDate)
return false;

}

return true;

});

}


/* =====================================================
   RENDER
   ===================================================== */

function renderSales(){

const data=getFilteredData();

renderSummary(data);
renderPaymentSummary(data);
renderOrdersTable(data);
renderItemSummary(data);

}

function renderSummary(data){

const orders=
new Set(data.map(x=>x.orderId));

const totalItems=
data.reduce(
(sum,x)=>sum+Number(x.quantity||0),0
);

const comboGroups=new Map();

data
.filter(x=>x.type==="combo")
.forEach(x=>{

const key=
x.comboGroup||
x.orderId+"|"+x.item;

if(!comboGroups.has(key))
comboGroups.set(
key,
Number(x.quantity||0)
);

});

const totalCombos=
[...comboGroups.values()]
.reduce((sum,x)=>sum+x,0);

const totalSales=
data.reduce(
(sum,x)=>sum+Number(x.amount||0),0
);

document.getElementById("totalOrders").textContent=
orders.size;

document.getElementById("totalItems").textContent=
totalItems;

document.getElementById("totalCombos").textContent=
totalCombos;

document.getElementById("totalSales").textContent=
"₹"+totalSales.toFixed(2);

}

function getOrderPayment(order){

if(!order)return"-";

return(
order.payment_method??
order.payment??
order.payment_type??
order.paymentMode??
order.payment_mode??
"-"
);

}

function renderPaymentSummary(data){

const totals={Cash:0,UPI:0};
const map=new Map();

data.forEach(row=>{

const p=String(
getOrderPayment(row.order)
).trim().toUpperCase();

const method=
p==="UPI"?"UPI":
p==="CASH"?"Cash":null;

if(!method)return;

if(!map.has(row.orderId))
map.set(row.orderId,{
method,
amount:0
});

map.get(row.orderId).amount+=
Number(row.amount||0);

});

map.forEach(x=>{
totals[x.method]+=x.amount;
});

document.getElementById("cashSales").textContent=
"₹"+totals.Cash.toFixed(2);

document.getElementById("upiSales").textContent=
"₹"+totals.UPI.toFixed(2);

}


/* =====================================================
   ORDERS TABLE
   ===================================================== */

function renderOrdersTable(data){

const container=
document.getElementById("ordersTableContainer");

const map=new Map();

data.forEach(row=>{

if(!map.has(row.orderId))
map.set(row.orderId,{
orderId:row.orderId,
orderNumber:row.orderNumber,
amount:0
});

map.get(row.orderId).amount+=
Number(row.amount||0);

});

const orders=[...map.values()];

if(!orders.length){

container.innerHTML=
'<div class="empty">No orders found.</div>';

return;

}

let html=`
<table>
<thead>
<tr>
<th>Order Number</th>
<th>Total Price</th>
</tr>
</thead>
<tbody>
`;

orders.forEach(order=>{

const number=
order.orderNumber??order.orderId;

html+=`
<tr>
<td>
<span
class="order-link"
onclick="openOrderDetails('${escapeJs(order.orderId)}')">
#${escapeHtml(number)}
</span>
</td>
<td>
<b>₹${order.amount.toFixed(2)}</b>
</td>
</tr>
`;

});

html+=`</tbody></table>`;

container.innerHTML=html;

}


/* =====================================================
   ITEM SUMMARY
   ===================================================== */

function renderItemSummary(data){

const container=
document.getElementById("summaryTableContainer");

const map=new Map();

data.forEach(row=>{

const key=
row.type+"|"+row.item+"|"+(row.comboName||"");

if(!map.has(key))
map.set(key,{
item:row.item,
type:row.type,
comboName:row.comboName||"",
quantity:0,
amount:0
});

const entry=map.get(key);

entry.quantity+=Number(row.quantity||0);
entry.amount+=Number(row.amount||0);

});

const summary=[...map.values()]
.sort((a,b)=>b.quantity-a.quantity);

if(!summary.length){

container.innerHTML=
'<div class="empty">No item data.</div>';

return;

}

let html=`
<table>
<thead>
<tr>
<th>Item</th>
<th>Type</th>
<th>Total Quantity</th>
<th>Total Amount</th>
</tr>
</thead>
<tbody>
`;

summary.forEach(row=>{

html+=`
<tr>
<td>
<b>${escapeHtml(row.item)}</b>
${
row.type==="combo"&&row.comboName
?`<div class="combo-components">
From combo: ${escapeHtml(row.comboName)}
</div>`:""
}
</td>
<td>
<span class="type ${row.type}">
${row.type==="combo"?"COMBO":"SINGLE"}
</span>
</td>
<td>${row.quantity}</td>
<td><b>₹${row.amount.toFixed(2)}</b></td>
</tr>

/* =====================================================
   MENU MANAGEMENT
   ===================================================== */

let menuItems=[];
let editingMenuId=null;


/*
 * Open manager.
 */
async function openMenuManager(){

document.getElementById("menuModal").style.display="flex";

await loadMenuManager();

}


/*
 * Close manager.
 */
function closeMenuManager(){

document.getElementById("menuModal").style.display="none";

cancelMenuEdit();

}


/*
 * Load existing categories + items.
 *
 * IMPORTANT:
 * Categories are NOT renamed.
 * Whatever exists in chaat_products.category
 * is used exactly as stored.
 */
async function loadMenuManager(){

const body=
document.getElementById("menuTableBody");

body.innerHTML=
`<tr>
<td colspan="6" class="empty">Loading menu...</td>
</tr>`;

const {data,error}=
await supabaseClient
.from("chaat_products")
.select("id,created_at,name,category,price,available")
.order("id",{ascending:true});

if(error){

body.innerHTML=
`<tr>
<td colspan="6" class="empty">
Error: ${escapeHtml(error.message)}
</td>
</tr>`;

return;

}

menuItems=data||[];

renderMenuTable();
loadCategories();

}


/*
 * Build category dropdown from the existing database values.
 */
function loadCategories(){

const select=
document.getElementById("menuItemCategory");

const categories=[
...new Set(
menuItems
.map(item=>item.category)
.filter(
category=>
category!==null&&
category!==undefined&&
String(category).trim()!==""
)
)
];

select.innerHTML="";

if(!categories.length){

select.innerHTML=
`<option value="">No category yet</option>`;

return;

}

categories.forEach(category=>{

const option=document.createElement("option");

option.value=category;
option.textContent=category;

select.appendChild(option);

});

}


/*
 * Render menu table.
 */
function renderMenuTable(){

const body=
document.getElementById("menuTableBody");

if(!menuItems.length){

body.innerHTML=
`<tr>
<td colspan="6" class="empty">
No menu items found.
</td>
</tr>`;

return;

}

body.innerHTML="";

menuItems.forEach(item=>{

const row=document.createElement("tr");

row.innerHTML=`

<td>${item.id}</td>

<td>
<b>${escapeHtml(item.name??"-")}</b>
</td>

<td>
${escapeHtml(item.category??"-")}
</td>

<td>
₹${Number(item.price??0).toFixed(2)}
</td>

<td>
<span class="${
item.available
?"available"
:"unavailable"
}">
${item.available?"Available":"Unavailable"}
</span>
</td>

<td class="menu-actions">

<button
class="edit-btn"
onclick="editMenuItem(${item.id})">
Edit
</button>

<button
class="${
item.available
?"unavailable-btn"
:"available-btn"
}"
onclick="toggleMenuAvailability(${item.id},${!item.available})">
${item.available?"Disable":"Enable"}
</button>

<button
class="delete-btn"
onclick="deleteMenuItem(${item.id})">
Delete
</button>

</td>
`;

body.appendChild(row);

});

}


/*
 * Add or update item.
 */
async function saveMenuItem(){

const name=
document.getElementById("menuItemName")
.value.trim();

const price=
Number(
document.getElementById("menuItemPrice").value
);

const category=
document.getElementById("menuItemCategory").value;

const available=
document.getElementById("menuItemAvailable").checked;

if(!name){

alert("Please enter the item name.");
return;

}

if(!Number.isFinite(price)||price<0){

alert("Please enter a valid price.");
return;

}

if(!category){

alert("Please select a category.");
return;

}

let result;

if(editingMenuId===null){

result=await supabaseClient
.from("chaat_products")
.insert({
name:name,
category:category,
price:price,
available:available
});

}else{

result=await supabaseClient
.from("chaat_products")
.update({
name:name,
category:category,
price:price,
available:available
})
.eq("id",editingMenuId);

}

if(result.error){

alert(
"Could not save menu item:\n"+
result.error.message
);

return;

}

alert(
editingMenuId===null
?"Menu item added successfully."
:"Menu item updated successfully."
);

cancelMenuEdit();

await loadMenuManager();

}


/*
 * Edit.
 */
function editMenuItem(id){

const item=
menuItems.find(x=>Number(x.id)===Number(id));

if(!item)return;

editingMenuId=item.id;

document.getElementById("menuFormTitle")
.textContent="Edit Menu Item";

document.getElementById("menuItemName")
.value=item.name??"";

document.getElementById("menuItemPrice")
.value=item.price??0;

document.getElementById("menuItemAvailable")
.checked=item.available!==false;


/*
 * Make sure exact existing category is selected.
 */
const select=
document.getElementById("menuItemCategory");

let found=false;

[...select.options].forEach(option=>{

if(option.value===item.category){

option.selected=true;
found=true;

}

});

if(!found&&item.category){

const option=document.createElement("option");

option.value=item.category;
option.textContent=item.category;
option.selected=true;

select.appendChild(option);

}

document.getElementById("menuCancelBtn")
.style.display="inline-block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/*
 * Cancel edit.
 */
function cancelMenuEdit(){

editingMenuId=null;

document.getElementById("menuFormTitle")
.textContent="Add New Menu Item";

document.getElementById("menuItemName").value="";
document.getElementById("menuItemPrice").value="";
document.getElementById("menuItemAvailable").checked=true;

document.getElementById("menuCancelBtn")
.style.display="none";

}


/*
 * Enable / Disable.
 */
async function toggleMenuAvailability(id,newValue){

const {error}=
await supabaseClient
.from("chaat_products")
.update({
available:newValue
})
.eq("id",id);

if(error){

alert(
"Could not update availability:\n"+
error.message
);

return;

}

await loadMenuManager();

}


/*
 * Delete.
 */
async function deleteMenuItem(id){

const item=
menuItems.find(x=>Number(x.id)===Number(id));

if(!item)return;

const confirmed=
confirm(
`Delete "${item.name}" from the menu?\n\n`+
`This removes it from chaat_products.`
);

if(!confirmed)return;

const {error}=
await supabaseClient
.from("chaat_products")
.delete()
.eq("id",id);

if(error){

alert(
"Could not delete item:\n"+
error.message
);

return;

}

alert("Menu item deleted.");

await loadMenuManager();

}

function getTodayLocalDate(){

const d=new Date();

return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

}

function setTodayFilter(){

const today=getTodayLocalDate();

document.getElementById("fromDate").value=today;
document.getElementById("toDate").value=today;

}

function resetFilters(){

setTodayFilter();

document.getElementById("counterFilter")
.value="all";

document.getElementById("statusFilter")
.value="all";

renderSales();

}


/* =====================================================
   HELPERS
   ===================================================== */

function formatDate(value){

if(!value)return"-";

const date=new Date(value);

if(isNaN(date.getTime()))return"-";

return date.toLocaleString(
"en-IN",
{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);

}

function escapeHtml(value){

if(value===null||value===undefined)
return"";

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJs(value){

return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}

function showError(message){

const box=
document.getElementById("errorBox");

if(!message){

box.style.display="none";
box.textContent="";
return;

}

box.style.display="block";
box.textContent=message;

}
