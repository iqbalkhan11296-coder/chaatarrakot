<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAATARRA AI Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 95%;
      max-width: 700px;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    #chat {
      height: 400px;
      overflow-y: auto;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .ai {
      background: #e8e8e8;
    }

    .user {
      background: #111;
      color: white;
      margin-left: 15%;
    }

    .error {
      background: #ffe1e1;
      color: #a00000;
    }

    .input {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      background: #888;
    }

    #status {
      text-align: center;
      margin-top: 12px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>CHAATARRA AI</h1>

  <div id="chat">
    <div class="message ai">
      CHAATARRA AI test connection.
    </div>
  </div>

  <div class="input">

    <input
      id="messageInput"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button id="sendButton">
      Send
    </button>

  </div>

  <div id="status">
    Ready
  </div>

</div>


<script>

const FUNCTION_URL =
  "https://ucqeyhcycwksiubmlilg.supabase.co/functions/v1/restaurant-ai";


const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const status = document.getElementById("status");


function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


async function sendMessage() {

  const message = input.value.trim();

  if (!message) return;

  addMessage(message, "user");

  input.value = "";

  button.disabled = true;

  status.textContent = "Connecting...";


  try {

    console.log("Calling:", FUNCTION_URL);


    const response = await fetch(FUNCTION_URL, {

      method: "POST",

      headers: {
  "Content-Type": "application/json",
  "Authorization": "Bearer sb_publishable_YdIvl7IqdpT0UZOHBumEiw_ZThYEsgV"
},
      body: JSON.stringify({
        message: message
      })

    });


    console.log("HTTP status:", response.status);
    console.log("HTTP status text:", response.statusText);


    const rawText = await response.text();

    console.log("Raw response:", rawText);


    if (!response.ok) {

      addMessage(
        "SERVER ERROR\n\n" +
        "HTTP Status: " + response.status + "\n" +
        "Status Text: " + response.statusText + "\n\n" +
        "Response:\n" +
        rawText,
        "error"
      );

      status.textContent = "Server error";

      return;
    }


    let data;

    try {

      data = JSON.parse(rawText);

    } catch (jsonError) {

      addMessage(
        "INVALID JSON RESPONSE\n\n" +
        rawText,
        "error"
      );

      status.textContent = "Invalid response";

      return;
    }


    console.log("Parsed response:", data);


    if (data.answer) {

      addMessage(data.answer, "ai");

      status.textContent = "Connected to CHAATARRA AI";

    } else {

      addMessage(
        "FUNCTION RESPONSE\n\n" +
        JSON.stringify(data, null, 2),
        "error"
      );

      status.textContent = "Unexpected response";

    }


  } catch (error) {

    console.error("FETCH ERROR:", error);

    addMessage(
      "FETCH ERROR\n\n" +
      "Name: " + error.name + "\n" +
      "Message: " + error.message + "\n\n" +
      "Check the browser Console (F12) for more details.",
      "error"
    );

    status.textContent = "Connection failed";

  }


  button.disabled = false;

  input.focus();

}


button.addEventListener("click", sendMessage);


input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendMessage();

  }

});

</script>

</body>
</html>
